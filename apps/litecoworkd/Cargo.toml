[package]
name = "litecoworkd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "litecoworkd"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
ctrlc = { version = "3.4", features = ["termination"] }
domain-workspace = { path = "../../crates/domain-workspace" }
domain-task = { path = "../../crates/domain-task" }
domain-responsibility = { path = "../../crates/domain-responsibility" }
fs2 = "0.4"
getrandom = "0.3"
hex = "0.4"
http-body = "1.0"
operator-ipc = { path = "../../crates/operator-ipc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
storage-core = { path = "../../crates/storage-core" }
storage-sqlite = { path = "../../crates/storage-sqlite" }
tempfile = "3.20"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[lints]
workspace = true
