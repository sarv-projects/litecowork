[package]
name = "sp02-driver-compare"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-unbundled"] }
chacha20poly1305 = "0.10.1"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
storage-core = { path = "../../../crates/storage-core" }
domain-workspace = { path = "../../../crates/domain-workspace" }
zeroize = "1.8"
tempfile = "3.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
