feature_id: "001"
name: "Conversation Session Supervisor and Native Turn Execution"
status: "DRAFT"
spec_revision: "1.0"
nodes:
  - id: "desktop-ui"
    owner: "Conversation UI"
    kind: "component"
    responsibility: "Draft, selected binding, submit, cancel/retry affordances and transient rendering"
    inputs: ["user input", "durable projection", "normalized transient frames"]
    outputs: ["authenticated conversation commands"]
  - id: "operator"
    owner: "litecoworkd Operator"
    kind: "authenticated boundary"
    responsibility: "Principal authentication, Workspace ownership, idempotency, expected version, typed errors"
    inputs: ["desktop IPC request"]
    outputs: ["validated Conversation command", "authorized projection"]
  - id: "conversation-service"
    owner: "ConversationService"
    kind: "domain service"
    responsibility: "Conversation/message/turn durable mutation and receipt ownership"
    inputs: ["validated command", "normalized turn outcome"]
    outputs: ["committed USER+OPEN turn receipt", "detached supervisor dispatch request"]
  - id: "sqlite-store"
    owner: "Storage"
    kind: "transaction boundary"
    responsibility: "Version fences, immutable event authority, snapshots, events, receipts and local host binding"
    inputs: ["typed storage command"]
    outputs: ["committed domain result"]
  - id: "turn-coordinator"
    owner: "AgentTurnCoordinator"
    kind: "orchestrator"
    responsibility: "TARGET boundary for turn sequencing, context acquisition, supervisor handoff, ordered outcomes, retry and continuation"
    implementation_status: "TARGET_ONLY: active Operator currently calls AgentSessionSupervisor directly; no AgentTurnCoordinator implementation/wiring was found"
    inputs: ["committed turn", "pinned binding", "context package", "normalized outcome"]
    outputs: ["supervisor lifecycle request", "ConversationService settle request"]
  - id: "session-supervisor"
    owner: "AgentSessionSupervisor"
    kind: "runtime supervisor"
    responsibility: "Partially implemented per-turn AgentSession reservation, OpenCode Server startup, readiness activation, bounded event reading and result commit"
    implementation_status: "PARTIAL: only opencode v2.0.32 branch; error handling, cancellation/quiescence, retry and restart recovery are incomplete"
    inputs: ["exact turn scope", "pinned host", "context package", "adapter observations"]
    outputs: ["storage lifecycle commands", "normalized outcome stream"]
  - id: "invocation-runner"
    owner: "InvocationRunner (Runtime)"
    kind: "provider input reconciler"
    responsibility: "Resolve Runtime-local ProviderInputBinding exact key; record the response to the same provider task; reconcile provider acceptance/rejection/unknown without Conversation or turn mutation"
    inputs: ["immutable UserRequestResponse", "Runtime-local ProviderInputBinding", "same provider task observations"]
    outputs: ["exact-key accepted, rejected or ambiguous provider outcome"]
  - id: "host-supervisor"
    owner: "AgentHostSupervisor"
    kind: "process supervisor"
    responsibility: "TARGET boundary for host process, health, concurrency, references and owned-process stop"
    implementation_status: "TARGET_ONLY: the active dispatch creates/updates a SQLite host record but directly starts/stops OpenCode per turn; no separately wired AgentHostSupervisor was found"
    inputs: ["endpoint and Runtime incarnation"]
    outputs: ["host instance identity", "bounded readiness/health observation"]
  - id: "agent-adapter"
    owner: "Qualified AgentAdapter"
    kind: "protocol adapter"
    responsibility: "Harness-specific session create, input, event, interrupt and stop transport"
    inputs: ["bounded Conversation context", "native process/session identity"]
    outputs: ["untrusted bounded protocol frames"]
  - id: "native-host"
    owner: "External native agent harness"
    kind: "external process"
    responsibility: "Native auth, model selection, private transcript, reasoning and native tools"
    inputs: ["adapter protocol"]
    outputs: ["native protocol observations"]
  - id: "presentation-operator"
    owner: "Presentation Operator"
    kind: "projection service"
    responsibility: "Owner-scoped durable snapshot/upsert and optional bounded transient frame"
    inputs: ["committed events and projection state"]
    outputs: ["authorized cursor page"]
  - id: "tauri-bridge"
    owner: "Desktop Tauri bridge"
    kind: "desktop transport"
    responsibility: "Projection subscription, backpressure and UI event bridge"
    inputs: ["authorized cursor page"]
    outputs: ["resumable client frames"]
edges:
  - id: "e01"
    from: "desktop-ui"
    to: "operator"
    kind: "authenticated-request"
    contract: "docs/API.md POST /v1/conversations/{id}/turns"
  - id: "e02"
    from: "operator"
    to: "conversation-service"
    kind: "command"
    contract: "owner-scoped turn admission and Conversation-scoped UserRequest response"
  - id: "e03"
    from: "conversation-service"
    to: "sqlite-store"
    kind: "transaction"
    contract: "USER message + OPEN turn + idempotency receipt"
  - id: "e04"
    from: "conversation-service"
    to: "turn-coordinator"
    kind: "target durable-dispatch boundary"
    implementation_status: "TARGET_ONLY: current Operator spawns the per-turn supervisor directly after the admission commit"
    contract: "committed turn ID or committed WAITING_DEPENDENCY UserRequest continuation; never uncommitted draft"
  - id: "e05"
    from: "turn-coordinator"
    to: "sqlite-store"
    kind: "read"
    contract: "immutable turn binding, host resolution and bounded context package"
  - id: "e06"
    from: "turn-coordinator"
    to: "session-supervisor"
    kind: "lifecycle-command"
    contract: "exact Conversation/Turn/Binding/Runtime incarnation"
  - id: "e07"
    from: "session-supervisor"
    to: "sqlite-store"
    kind: "transaction"
    contract: "STARTING reservation, readiness activation, LOST/CLOSED lifecycle"
  - id: "e08"
    from: "session-supervisor"
    to: "host-supervisor"
    kind: "local-process-control"
    contract: "exact endpoint and Runtime incarnation"
  - id: "e09"
    from: "session-supervisor"
    to: "agent-adapter"
    kind: "adapter-call"
    contract: "versioned adapter contract; no DB transaction held"
  - id: "e10"
    from: "agent-adapter"
    to: "native-host"
    kind: "native-protocol"
    contract: "harness-owned auth/session; protocol payload bounded"
  - id: "e11"
    from: "native-host"
    to: "agent-adapter"
    kind: "untrusted-observation"
    contract: "size, correlation, ordering and schema validation"
  - id: "e12"
    from: "agent-adapter"
    to: "session-supervisor"
    kind: "normalized-input"
    contract: "raw frames are not domain events or authority"
  - id: "e13"
    from: "session-supervisor"
    to: "turn-coordinator"
    kind: "lifecycle-outcome"
    contract: "normalized correlated events and final outcome"
  - id: "e14"
    from: "turn-coordinator"
    to: "conversation-service"
    kind: "settlement-command"
    contract: "final response candidate; no direct aggregate mutation"
  - id: "e15"
    from: "session-supervisor"
    to: "sqlite-store"
    kind: "transaction"
    implementation_status: "CODE: current OpenCode supervisor invokes SQLite directly; target ConversationService/AgentTurnCoordinator owner path is not wired"
    contract: "Implemented SQLite atomic AGENT message + terminal turn + session close + events + snapshots + request receipt; qualification/negative cases remain"
  - id: "e16"
    from: "sqlite-store"
    to: "presentation-operator"
    kind: "projection-read"
    contract: "durable committed projection and opaque cursor"
  - id: "e17"
    from: "presentation-operator"
    to: "tauri-bridge"
    kind: "bounded-subscription"
    contract: "owner-authorized page/backpressure"
  - id: "e18"
    from: "tauri-bridge"
    to: "desktop-ui"
    kind: "resumable-projection"
    contract: "durable frames are authoritative; deltas are transient"
  - id: "e19"
    from: "turn-coordinator"
    to: "invocation-runner"
    kind: "provider-input-reconciliation"
    contract: "same Runtime-local ProviderInputBinding and exact provider task/request key; update acknowledgement is not acceptance"
  - id: "e20"
    from: "invocation-runner"
    to: "turn-coordinator"
    kind: "provider-input-outcome"
    contract: "confirmed acceptance, rejection with current key, or ambiguous state; no fresh AgentSession before confirmed acceptance"
transactions:
  - id: "tx-turn-admission"
    owner: "ConversationService via Storage"
    atomic_records: ["USER ConversationMessage", "OPEN ConversationTurn", "conversation.message.added.v1", "conversation.turn.created.v2", "request receipt", "snapshot/projection"]
    external_calls_inside: false
    known_gap: "No same-Conversation nonterminal-turn guard or durable dispatch outbox/claim was found; accepted B-01 single-flight policy is not enforced by this transaction"
  - id: "tx-session-reservation"
    owner: "AgentSessionStore"
    atomic_records: ["STARTING AgentSession", "agent.session.starting.v1", "idempotency receipt"]
    external_calls_inside: false
  - id: "tx-session-activation"
    owner: "AgentSessionStore"
    atomic_records: ["ACTIVE AgentSession", "RUNNING ConversationTurn", "agent.session.started.v1", "conversation.turn.status.changed.v1", "snapshots", "Runtime-local AgentSessionHostBinding"]
    external_calls_inside: false
  - id: "tx-user-request-response"
    owner: "ConversationService via Storage"
    status: "INHERITED OWNER CONTRACT - runtime qualification required"
    atomic_records: ["immutable UserRequestResponse", "UserRequest ANSWERED with matching response digest/responder/timestamp", "ConversationTurn WAITING_USER -> WAITING_DEPENDENCY", "conversation.turn.status.changed.v1"]
    external_calls_inside: false
  - id: "tx-final-response"
    owner: "Storage implementation called by AgentSessionSupervisor"
    status: "CODE - OpenCode path uses the SQLite transaction; ConversationService ownership and qualification remain open"
    atomic_records: ["AGENT ConversationMessage", "conversation.message.added.v1", "COMPLETED ConversationTurn", "conversation.turn.settled.v1", "snapshots", "response receipt"]
    external_calls_inside: false
external_boundaries:
  - id: "native-start"
    owner: "AgentSessionSupervisor / AgentAdapter"
    input_trust: "external-process"
    timeout: "finite; first-route value unresolved"
    retry: "reconcile session/process before retry"
  - id: "native-event-stream"
    owner: "AgentAdapter"
    input_trust: "untrusted"
    timeout: "bounded poll/read deadline"
    retry: "resume exact cursor if proven; otherwise discard transient gap and resync"
  - id: "provider-input-acceptance"
    owner: "InvocationRunner (Runtime)"
    input_trust: "provider-observation"
    timeout: "bounded provider poll/deadline; exact first-route value unresolved"
    retry: "reconcile same provider task and exact input key; rejection creates a new UserRequest for the current key; ambiguous state remains WAITING_DEPENDENCY and blocks a new AgentSession"
  - id: "native-interrupt"
    owner: "AgentSessionSupervisor"
    input_trust: "external-process"
    timeout: "finite; first-route value unresolved"
    retry: "reconcile quiescence; never infer stop from request acceptance"
recovery:
  owner: "AgentSessionSupervisor with ConversationService"
  source_of_truth: ["AgentSession", "ConversationTurn", "DomainEvent", "AgentSessionHostBinding"]
  implementation_status: "NOT WIRED in active daemon startup"
  known_gap: "No durable Conversation dispatch outbox/claim or OPEN-turn recovery sweep; current detached dispatch errors can be logged without terminal settlement"
  restart_action: "TARGET ONLY: reconcile exact Runtime incarnation; settle stranded STARTING as LOST; query active adapter state only for same live incarnation; never replay uncertain prompt across incarnation"
  ui_action: "resume durable projection cursor and authorized snapshot; discard non-replayable transient frames"

