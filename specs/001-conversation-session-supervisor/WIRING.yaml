feature_id: "001"
name: "Conversation Session Supervisor and Native Turn Execution"
status: "ACCEPTED/LOCKED"
spec_revision: "1.1"
nodes:
  - id: "desktop-ui"
    owner: "Conversation UI"
    kind: "component"
    responsibility: "Draft, selected binding, submit, cancel/retry affordances and transient rendering"
    inputs: ["user input", "durable projection", "normalized transient frames"]
    outputs: ["authenticated conversation commands"]
  - id: "operator"
    owner: "litecoworkd Operator"
    kind: "authenticated boundary"
    responsibility: "Principal authentication, Workspace ownership, idempotency, expected version, typed errors"
    inputs: ["desktop IPC request"]
    outputs: ["validated Conversation command", "authorized projection"]
  - id: "conversation-service"
    owner: "ConversationService"
    kind: "domain service"
    responsibility: "Conversation/message/turn durable mutation and receipt ownership"
    inputs: ["validated command", "normalized turn outcome"]
    outputs: ["target ConversationService command", "committed USER+OPEN turn plus durable intent receipt"]
    implementation_status: "CODE: Operator route constructs the storage command directly, commits through SQLite, and then calls the thin AgentTurnCoordinator handoff; the ConversationService owner boundary is not implemented as a separate service"
  - id: "sqlite-store"
    owner: "Storage"
    kind: "transaction boundary"
    responsibility: "Version fences, immutable event authority, snapshots, events, receipts and local host binding"
    inputs: ["typed storage command"]
    outputs: ["committed domain result"]
  - id: "turn-coordinator"
    owner: "AgentTurnCoordinator"
    kind: "orchestrator"
    responsibility: "Target owner for turn sequencing, context acquisition, supervisor handoff, ordered outcomes, retry and continuation"
    implementation_status: "PARTIAL CODE: submit and retry call dispatch_admitted_turn; it asynchronously invokes AgentSessionSupervisor. T20 uses closed dispatch failure classes and bounded settlement retries, including the no-eligible-host path: transient local-store failures retry up to three times with 100 ms backoff, and permanent/exhausted failures return SETTLEMENT for recovery. A focused native-Windows helper regression verifies transient retry then success. A blocking-worker JoinError retains the Runtime-local AgentSession identity and starts an independent exact-attempt settlement; the SQLite regression proves the turn becomes FAILED, a committed STARTING session becomes LOST, the intent settles, and no AGENT answer is fabricated. Profile-catalog query failure and readable-but-missing pinned profile-row regressions cover ProfileLookup; binding-decode fault coverage verifies BindingLookup after host resolution; both leave the admitted turn FAILED, intent SETTLED and no session reservation. A real-SQLite post-admission endpoint-NEEDS_AUTH test verifies unavailable settlement, preserved USER input, settled intent and no AgentSession or AGENT answer. If recovery cannot commit, SETTLEMENT is reported and startup recovery retains the durable-fence path. The captured-writer regression proves provider/secret details are absent from the structured stderr bytes; panic-hook and external collector behavior are not verified. It does not yet own context acquisition, ordered outcomes, retry/continuation policy, or the full service boundary; exhaustive setup-stage fault evidence remains open"
    inputs: ["committed turn", "pinned binding", "context package", "normalized outcome"]
    outputs: ["asynchronous supervisor dispatch request"]
  - id: "session-supervisor"
    owner: "AgentSessionSupervisor"
    kind: "runtime supervisor"
    responsibility: "Partially implemented per-turn AgentSession reservation, OpenCode Server startup, readiness activation, bounded event reading and result commit"
    implementation_status: "PARTIAL CODE: OpenCode v2.0.32 path and v29 dispatch-intent claim are wired. T04/T07 fixtures preserve explicit normalized completion or provider failure observed during Stop; SQLite accepts exactly the observed Stop version edge and emits the actual CANCEL_REQUESTED-to-COMPLETED aggregate edge. StopUnconfirmed leaves CANCEL_REQUESTED but its private outcome is discarded and no typed recovery state is projected. Live pinned-provider semantics and partial/ambiguous output remain unqualified. T03 now persists a unique per-session AgentHostInstance as STARTING before OpenCode spawn, records READY only after the native startup and health checks, stores a Runtime-local PID reference, and records STOPPED only on observed exit; early-error drop attempts DEGRADED. On a READY persistence error, the helper re-reads the durable host state. If READY is present (including a lost commit acknowledgement), it attempts READY→STOPPING before process cleanup. If that transition commits, an observed exit commits STOPPING→STOPPED. If the first STOPPING write fails, confirmed exit triggers bounded state re-reads and retries through legal transitions; an observed retry after an earlier unconfirmed stop also reconciles DEGRADED→STOPPING→STOPPED. Ambiguous acknowledgements are accepted only after a re-read proves a terminal row. A still-STARTING row uses failed-start handling. If storage cannot confirm lifecycle transitions within the bounded reconciliation, the outcome remains unconfirmed; this does not establish restart recovery. Nine recording-store host-helper tests cover ordering, expected-state compare-and-set, lost acknowledgements, failed STOPPING writes and retry settlement; they do not inject real SQLite commit faults or run OpenCode startup. A 2026-11-15 T03 CODE regression also carries the committed STARTING AgentSession version into activation CAS and derives the started-event revision with checked arithmetic; the helper regression covers a non-initial version and rejects zero/overflow. This is not a SQLite fault-injection or successful provider-turn test. A-101 remains open: the current post-stop persistence skips STOPPING and storage allows direct-to-STOPPED edges absent from STATE-MACHINES; the owner-authorized T03/T04 storage alignment is not implemented. The former fabricated READY insertion is removed, but this does not implement the target shared AgentHostSupervisor, process reuse, retained lease, idle TTL, restart reconciliation, or same-host multi-root proof. The adapter still owns and stops the process per turn, including on StopUnconfirmed; the accepted retention rule remains incomplete. Pinned v2.0.32 foreground serve has no public graceful-shutdown route; do not use the separate opencode service stop command. Linux process ownership uses a process group, not the accepted cgroup. Remaining: setup-stage fault coverage, external collector checks, host lifecycle/StopUnconfirmed recovery, and packaged provider qualification"
    inputs: ["exact turn scope", "pinned host", "context package", "adapter observations"]
    outputs: ["storage lifecycle commands", "normalized outcome stream"]
  - id: "invocation-runner"
    owner: "InvocationRunner (Runtime)"
    kind: "provider input reconciler"
    responsibility: "Resolve Runtime-local ProviderInputBinding exact key; record the response to the same provider task; reconcile provider acceptance/rejection/unknown without Conversation or turn mutation"
    inputs: ["immutable UserRequestResponse", "Runtime-local ProviderInputBinding", "same provider task observations"]
    outputs: ["exact-key accepted, rejected or ambiguous provider outcome"]
  - id: "host-supervisor"
    owner: "AgentHostSupervisor"
    kind: "process supervisor"
    responsibility: "Target boundary for host process, health, concurrency, references and owned-process stop"
    implementation_status: "PARTIAL CODE: production OpenCode dispatch calls start_host_process to persist per-session STARTING before spawn and READY after observed startup/health, with a private PID reference. COMPLETED/CANCELLED/FAILED Conversation and session settlement now precedes per-turn shutdown; observed exit then records STOPPED, otherwise DEGRADED. On a READY persistence error, the helper re-reads host state and attempts READY→STOPPING before cleanup when a READY row exists; observed exit advances confirmed STOPPING to STOPPED. If the initial STOPPING write fails, confirmed exit retries the legal state path; an observed retry after an earlier unconfirmed stop reconciles DEGRADED→STOPPING→STOPPED. Ambiguous acknowledgements are accepted only after a re-read proves a terminal row. Unresolved cleanup stays at its last confirmed state, while a still-STARTING row uses failed-start handling. Nine recording-store tests cover expected-state CAS, lost acknowledgements, failed STOPPING writes and retry settlement; no real SQLite fault or provider process is exercised. A-101 remains open: native stop currently precedes the durable STOPPING transition, and storage accepts direct-to-STOPPED edges absent from STATE-MACHINES. The helper does not own a reusable process pool. The target shared AgentHostSupervisor, host-use lease, idle-TTL stop, daemon-restart reconciliation, neutral Runtime cwd, same-host multi-root proof, and StopUnconfirmed session reference remain absent; per-turn OpenCodeAdapter still owns and kills its server"
    inputs: ["endpoint and Runtime incarnation"]
    outputs: ["host instance identity", "bounded readiness/health observation"]
  - id: "agent-adapter"
    owner: "Qualified AgentAdapter"
    kind: "protocol adapter"
    responsibility: "Harness-specific per-turn session create, input, bounded event and interrupt transport; each OpenCode session gets the revalidated Workspace location explicitly; per-turn cleanup never stops a shared host process"
    implementation_status: "CODE: OpenCodeAdapter accepts the revalidated Workspace path and sends it in the session-create location field; one Windows fake-transport test captures two distinct paths through one server handle. OpenCodeServer also has bounded T27 permission list/get/reply methods using the pinned v2.0.32 session routes, with fake-loopback tests for exact paths, once body, 204 acknowledgment, bounded request IDs, the once/reject decision allowlist, timeout-after-dispatch without automatic reply replay, and closed 401/403/500 error mapping without exposing response body text. The active turn worker now calls reply and exact-session list through the bounded command mailbox; ambiguous-reply reconciliation is wired but synthetic only, with no successful live provider evidence. The current adapter still owns the per-turn server and its shutdown reports only whether process exit was observed; there is no shared host or live provider location/permission evidence"
    inputs: ["bounded Conversation context", "native process/session identity"]
    outputs: ["untrusted bounded protocol frames"]
  - id: "native-host"
    owner: "External native agent harness"
    kind: "external process"
    responsibility: "Native auth, model selection, private transcript, reasoning and native tools"
    inputs: ["adapter protocol"]
    outputs: ["native protocol observations"]
  - id: "presentation-operator"
    owner: "Presentation Operator"
    kind: "projection service"
    responsibility: "Owner-scoped durable snapshot/upsert and optional bounded transient frame"
    inputs: ["committed events and projection state"]
    outputs: ["authorized cursor page"]
  - id: "native-permission-registry"
    owner: "AgentSessionSupervisor / Runtime"
    kind: "ephemeral provider state"
    responsibility: "Target T27 registry correlating validated OpenCode permission requests to opaque UI tokens within one Runtime incarnation"
    implementation_status: "PARTIAL CODE: AgentSessionSupervisor owns an in-memory registry scoped by Workspace, Conversation, turn, retry ordinal, Runtime incarnation, native session and native request. It generates random opaque tokens, caps each attempt at 32 records and each Runtime at 256 retained records, deduplicates exact events, rejects conflicting duplicates and only returns safe projections. NativePermissionObserver publishes bounded turn.permission frames from normalized events without native IDs or raw paths. Exact mailbox teardown marks pending/replying prompts SESSION_ENDED internally and then discards all records/tokens for that attempt, preventing sequential-turn capacity exhaustion; active scopes are never evicted. Authenticated snapshot GET is SERVED. Reply POST and adapter command handoff are SERVED partial; provider reply reconciliation is CODE/SERVED partial and synthetic, with confirmed pending state clearing the attempted decision. Two synthetic authenticated POST-to-worker route tests verify receipt replay dispatches once and mailbox closure after fake-provider dispatch returns GONE rather than an ANSWERED receipt, with one provider call; they do not establish a live provider decision. Decision and SESSION_ENDED frames are published with monotonic per-attempt sequence. Exact-attempt and Workspace snapshot/reply routes are bridged through strict Tauri commands; inline Conversation and Needs You cards consume validated snapshots/frames. Needs You refreshes on entry/focus/visibility and explicit refresh but has no Workspace-wide push subscription. Generic resource labels remain; live provider and packaged restart/reconnect presentation are unqualified"
    inputs: ["correlated permission.asked observation", "authenticated owner decision"]
    outputs: ["sanitized live snapshot", "exact-session OpenCode reply", "bounded transient state frame"]
  - id: "tauri-bridge"
    owner: "Desktop Tauri bridge"
    kind: "desktop transport"
    responsibility: "Projection subscription, backpressure and UI event bridge"
    inputs: ["authorized cursor page"]
    outputs: ["resumable client frames"]
edges:
  - id: "e01"
    from: "desktop-ui"
    to: "operator"
    kind: "authenticated-request"
    contract: "docs/API.md POST /v1/conversations/{id}/turns"
  - id: "e02"
    from: "operator"
    to: "conversation-service"
    kind: "command"
    contract: "owner-scoped turn admission and Conversation-scoped UserRequest response"
  - id: "e03"
    from: "conversation-service"
    to: "sqlite-store"
    kind: "transaction"
    implementation_status: "TARGET_ONLY as a ConversationService call; CODE transaction is currently invoked directly by the Operator route"
    contract: "USER message + OPEN turn + idempotency receipt"
  - id: "e21"
    from: "operator"
    to: "sqlite-store"
    kind: "transaction"
    implementation_status: "CODE/SERVED: the Operator route directly invokes create_conversation_turn, atomically writing USER message, OPEN turn, events, receipt and v29 dispatch intent with the single-flight guard"
    contract: "source path for tx-turn-admission; 202 acknowledges durable admission only"
  - id: "e22"
    from: "operator"
    to: "turn-coordinator"
    kind: "post-commit dispatch handoff"
    implementation_status: "PARTIAL CODE: submit and retry invoke dispatch_admitted_turn after the durable storage commit; exact same-Runtime attempt replays are suppressed before setup by the supervisor owner guard"
    contract: "admitted turn, correlation ID and local Runtime incarnation; per-Runtime exact-attempt owner suppresses duplicates; durable intent CAS precedes host/binding/profile preflight; only the confirmed claimant may settle setup failures, and a losing/ambiguous claim is left for recovery; first-send intent on an unselected New Chat does not reach this edge"
  - id: "e23"
    from: "desktop-ui"
    to: "operator"
    kind: "Conversation create command"
    implementation_status: "CODE/SERVED: when sendTurn has no selected Conversation it invokes create_conversation only, then restores the draft into the created Conversation for a separate second Send; no USER message, turn or dispatch intent is admitted by the first click"
    contract: "POST /v1/conversations; authenticated selected-Workspace owner and Idempotency-Key; create receipt is distinct from turn admission; the carried draft is process-local and has no turn receipt"
  - id: "e04"
    from: "conversation-service"
    to: "turn-coordinator"
    kind: "target durable-dispatch boundary"
    implementation_status: "TARGET_ONLY: current source calls the coordinator directly from Operator after the SQLite admission commit; ConversationService is not the caller"
    contract: "committed turn ID or committed WAITING_DEPENDENCY UserRequest continuation; never uncommitted draft"
  - id: "e05"
    from: "turn-coordinator"
    to: "sqlite-store"
    kind: "read"
    implementation_status: "TARGET_ONLY: supervisor currently resolves pinned host and loads context directly"
    contract: "immutable turn binding, host resolution and bounded context package"
  - id: "e06"
    from: "turn-coordinator"
    to: "session-supervisor"
    kind: "lifecycle-command"
    implementation_status: "PARTIAL CODE through turn-coordinator; the Operator invokes the coordinator after admission and retry"
    contract: "exact Conversation/Turn/Binding/Runtime incarnation"
  - id: "e07"
    from: "session-supervisor"
    to: "sqlite-store"
    kind: "transaction"
    contract: "STARTING reservation, readiness activation, LOST/CLOSED lifecycle"
  - id: "e08"
    from: "session-supervisor"
    to: "host-supervisor"
    kind: "local-process-control"
    implementation_status: "PARTIAL CODE: session supervisor calls start_host_process for OpenCode and reconciles STOPPED/DEGRADED on shutdown; failed READY persistence plus unconfirmed cleanup best-effort records DEGRADED after re-reading state. A-101 also records the unresolved STOPPING-before-stop order and unsupported direct terminal edges in the storage validator. No reusable pool or TTL"
    contract: "exact endpoint and Runtime incarnation"
  - id: "e09"
    from: "session-supervisor"
    to: "agent-adapter"
    kind: "adapter-call"
    contract: "versioned adapter contract; no DB transaction held; OpenCode session creation carries the exact revalidated Workspace location independently of neutral host cwd"
  - id: "e10"
    from: "agent-adapter"
    to: "native-host"
    kind: "native-protocol"
    contract: "harness-owned auth/session; protocol payload bounded"
  - id: "e11"
    from: "native-host"
    to: "agent-adapter"
    kind: "untrusted-observation"
    contract: "size, correlation, ordering and schema validation"
  - id: "e12"
    from: "agent-adapter"
    to: "session-supervisor"
    kind: "normalized-input"
    contract: "raw frames are not domain events or authority"
  - id: "e13"
    from: "session-supervisor"
    to: "turn-coordinator"
    kind: "lifecycle-outcome"
    implementation_status: "PARTIAL CODE: coordinator starts supervisor asynchronously and logs only a structured JSON diagnostic from the closed DispatchFailureClass; it does not consume a normalized outcome stream or own settlement"
    contract: "normalized correlated events and final outcome"
  - id: "e14"
    from: "turn-coordinator"
    to: "conversation-service"
    kind: "settlement-command"
    implementation_status: "TARGET_ONLY: the OpenCode supervisor directly calls SQLite final-response/settlement operations"
    contract: "final response candidate; no direct aggregate mutation"
  - id: "e15"
    from: "session-supervisor"
    to: "sqlite-store"
    kind: "transaction"
    implementation_status: "CODE: OpenCode supervisor invokes SQLite directly; target ConversationService settlement boundary is not wired. T07 CODE regression covers completion after the one committed Stop version bump and rewrites the settled event edge/version from the transaction's current row"
    contract: "Implemented SQLite atomic AGENT message + terminal turn + session close + events + snapshots + request receipt; provider, timeout, negative and packaged qualification cases remain"
  - id: "e16"
    from: "sqlite-store"
    to: "presentation-operator"
    kind: "projection-read"
    contract: "durable committed projection and opaque cursor"
  - id: "e17"
    from: "presentation-operator"
    to: "tauri-bridge"
    kind: "bounded-subscription"
    contract: "owner-authorized page/backpressure"
  - id: "e18"
    from: "tauri-bridge"
    to: "desktop-ui"
    kind: "resumable-projection"
    contract: "durable frames are authoritative; deltas are transient"
  - id: "e19"
    from: "turn-coordinator"
    to: "invocation-runner"
    kind: "provider-input-reconciliation"
    contract: "same Runtime-local ProviderInputBinding and exact provider task/request key; update acknowledgement is not acceptance"
  - id: "e20"
    from: "invocation-runner"
    to: "turn-coordinator"
    kind: "provider-input-outcome"
    contract: "confirmed acceptance, rejection with current key, or ambiguous state; no fresh AgentSession before confirmed acceptance"
  - id: "e24"
    from: "agent-adapter"
    to: "native-permission-registry"
    kind: "normalized-observation"
    implementation_status: "CODE: pinned payload normalizer feeds an ephemeral Runtime-local prompt registry after native session creation; exact duplicate events are idempotent, conflicting duplicates and foreign sessions are rejected, and public frames use opaque tokens and generic resource labels. Duplicate events republish current prompt state. Synthetic tests pass; no live provider event captured; accepted replies and attempt teardown publish sequenced state frames"
    contract: "Feature 001 T27: validate pinned OpenCode v2.0.32 permission.asked payload, correlate exact native session, keep native IDs Runtime-local"
  - id: "e25"
    from: "desktop-ui"
    to: "operator"
    kind: "authenticated-request"
    implementation_status: "CODE/SERVED partial: typed Tauri commands validate exact-attempt and Workspace snapshots and closed replies; Conversation renders live cards only for a RUNNING attempt and consumes sequenced frames, while Needs You renders the ephemeral Workspace snapshot and refreshes on entry/focus/visibility or explicit refresh. There is no Workspace-wide push subscription, successful live provider reply or packaged qualification"
    contract: "GET /v1/conversations/{conversationId}/turns/{turnId}/permissions and POST /v1/conversations/{conversationId}/turns/{turnId}/permissions/{promptToken}/reply; allow once or explicitly disclosed session-pending rejection"
  - id: "e26"
    from: "operator"
    to: "native-permission-registry"
    kind: "authorized-command"
    implementation_status: "PARTIAL SERVED/CODE: authenticated GET reads the authorized SQLite turn then returns the exact active supervisor snapshot. POST rechecks RUNNING turn/ACTIVE AgentSession and queues a principal/idempotency-bound decision through the Runtime-local registry; the active worker invokes the pinned provider method and reconciles errors once through the exact session pending list. Negative route tests and three synthetic allow/reject/race route tests pass; rejection replay dispatches one fake native reject and does not create a LiteCowork grant. No real-provider route test"
    contract: "Workspace, owner, active turn, retry ordinal, Runtime incarnation, opaque token and idempotency checks before provider call"
  - id: "e27"
    from: "native-permission-registry"
    to: "desktop-ui"
    kind: "ephemeral-projection"
    implementation_status: "CODE/SERVED partial: supervisor publishes bounded ephemeral turn.permission frames without native identifiers or absolute paths, and authenticated GET/reply routes are mounted. Reply transitions and SESSION_ENDED are published. Authenticated exact-attempt and Workspace snapshot/reply routes are mounted; three tests exercise synthetic authenticated replies through the active worker queue: allow-once replay dispatches once, rejection replay dispatches one fake native reject without creating a LiteCowork grant, and mailbox closure after fake-provider dispatch returns GONE rather than ANSWERED. Typed Tauri commands and inline/Needs You consumers have CODE coverage. Needs You has snapshot refresh, not push subscription. Real provider and packaged restart/recovery presentation remain unqualified"
    contract: "turn.permission contains no native session/request ID, credential, raw metadata or absolute resource path; restart invalidates token and never replays a decision"
  - id: "e28"
    from: "native-permission-registry"
    to: "agent-adapter"
    kind: "bounded-attempt-scoped-provider-command"
    implementation_status: "PARTIAL CODE: an attempt-scoped bounded mailbox is registered after native session creation; the active adapter callback drains it immediately before each provider poll and remains sole owner of OpenCodeServer. The handler never receives the server handle or credentials. Focused native-Windows permission state/route coverage is recorded in CURRENT-RUN; it includes synthetic idempotency, pending-list reconciliation, bounded snapshots and owner-scope denial cases; no successful reply to a real provider is tested. Runtime restart discards the mailbox/registry and does not replay decisions"
    contract: "Resolve opaque prompt token and idempotency decision inside the Runtime; send only exact native session/request IDs plus the closed once/reject enum over an in-process channel; adapter returns acknowledged or reconciled outcome without automatic replay"
  - id: "e29"
    from: "desktop-ui"
    to: "operator"
    kind: "authenticated-resource-page-read"
    implementation_status: "CODE/SERVED: the composer invokes the existing Tauri list_resources command and follows returned nextCursor pages; it merges eligible same-Workspace text Resources by Resource ID while retaining the first-seen pinned revision, keeps prior results/cursor after a later-page failure for retry, invalidates stale work on close/scope change and stops cursor loops. Cursor-size validation matches the daemon's 2,048-byte UTF-8 limit. Attachment helper tests (6/6), the Conversation source-route guard (7/7) and UI build pass; no mounted-picker network/retry interaction or provider/packaged qualification is established"
    contract: "GET /v1/resources through the validated local Operator connection; X-Workspace-ID, limit=100 and optional opaque cursor; read-only listing does not grant attachment authority, which is rechecked for exact Resource revision at submit and dispatch"
transactions:
  - id: "tx-conversation-create"
    owner: "Operator route via Storage (target owner: ConversationService)"
    atomic_records: ["Conversation", "conversation.created.v1", "idempotency receipt"]
    external_calls_inside: false
    implementation_status: "CODE/SERVED: creates an empty Conversation only. The current New Chat first-Send UI carries its draft outside this transaction and does not admit a turn until a later Send; that cross-transaction user journey is incomplete"
  - id: "tx-turn-admission"
    owner: "Operator route via Storage (target owner: ConversationService)"
    atomic_records: ["USER ConversationMessage", "OPEN ConversationTurn", "conversation.message.added.v1", "conversation.turn.created.v2", "request receipt", "snapshot/projection", "v29 dispatch intent"]
    external_calls_inside: false
    implementation_status: "CODE/SERVED: same-Conversation single-flight guard and v29 durable intent are implemented in the mounted Operator/storage path; provider dispatch and live qualification remain separate"
  - id: "tx-session-reservation"
    owner: "AgentSessionStore"
    atomic_records: ["STARTING AgentSession", "agent.session.starting.v1", "idempotency receipt"]
    external_calls_inside: false
  - id: "tx-host-instance-start-readiness"
    owner: "AgentHostStore via start_host_process (target owner: AgentHostSupervisor)"
    atomic_records: ["STARTING AgentHostInstance", "READY after observed OpenCode startup/health", "FAILED if native startup fails"]
    external_calls_inside: false
    implementation_status: "PARTIAL CODE: each OpenCode Conversation session has a unique local host row; process startup/readiness run outside SQLite; terminal turn/session settlement runs before per-turn shutdown, followed by STOPPED/DEGRADED reconciliation. StopUnconfirmed still drops/stops the owned process without retaining its session reference. Shared-host leases, TTL, restart reconciliation, neutral Runtime cwd, same-host multi-root proof and uncertain-stop retention are not implemented"
  - id: "tx-session-activation"
    owner: "AgentSessionStore"
    atomic_records: ["ACTIVE AgentSession", "RUNNING ConversationTurn", "agent.session.started.v1", "conversation.turn.status.changed.v1", "snapshots", "Runtime-local AgentSessionHostBinding"]
    external_calls_inside: false
  - id: "tx-user-request-response"
    owner: "ConversationService via Storage"
    status: "INHERITED OWNER CONTRACT - runtime qualification required"
    atomic_records: ["immutable UserRequestResponse", "UserRequest ANSWERED with matching response digest/responder/timestamp", "ConversationTurn WAITING_USER -> WAITING_DEPENDENCY", "conversation.turn.status.changed.v1"]
    external_calls_inside: false
  - id: "tx-final-response"
    owner: "Storage implementation called by AgentSessionSupervisor"
    status: "CODE - active OpenCode caller commits COMPLETED through SQLite; ConversationService ownership and qualification remain open. Storage validation also accepts WAITING_USER and WAITING_DEPENDENCY, writes settled_at for them and closes the active AgentSession in the same transaction, although locked B-04 defines terminal outcomes only; that unused status mismatch is open under register A-93 and must not be treated as continuation support."
    atomic_records: ["AGENT ConversationMessage", "conversation.message.added.v1", "COMPLETED ConversationTurn", "conversation.turn.settled.v1", "snapshots", "response receipt"]
    external_calls_inside: false
external_boundaries:
  - id: "native-start"
    owner: "AgentSessionSupervisor / AgentAdapter"
    input_trust: "external-process"
    timeout: "finite; first-route value unresolved"
    retry: "reconcile session/process before retry"
  - id: "native-event-stream"
    owner: "AgentAdapter"
    input_trust: "untrusted"
    timeout: "bounded poll/read deadline"
    retry: "resume exact cursor if proven; otherwise discard transient gap and resync"
  - id: "provider-input-acceptance"
    owner: "InvocationRunner (Runtime)"
    input_trust: "provider-observation"
    timeout: "bounded provider poll/deadline; exact first-route value unresolved"
    retry: "reconcile same provider task and exact input key; rejection creates a new UserRequest for the current key; ambiguous state remains WAITING_DEPENDENCY and blocks a new AgentSession"
  - id: "native-interrupt"
    owner: "AgentSessionSupervisor"
    input_trust: "external-process"
    timeout: "finite; first-route value unresolved"
    retry: "reconcile quiescence; never infer stop from request acceptance"
recovery:
  owner: "Runtime startup recovery with Storage (target orchestration owners: AgentTurnCoordinator / ConversationService)"
  source_of_truth: ["AgentSession", "ConversationTurn", "DomainEvent", "AgentSessionHostBinding"]
  implementation_status: "PARTIAL CODE: runtime startup invokes agents/conversation_recovery.rs before Operator admission; tests cover seeded RUNNING/CANCEL_REQUESTED/OPEN-UNCLAIMED states, a CLAIMED intent after settlement failure, prior-incarnation RUNNING + ACTIVE AgentSession recovery to FAILED/LOST with binding release, an orphan STARTING -> LOST with turn/intent settlement and idempotency, and a real SQLite final-response commit followed by a new-incarnation recovery sweep that preserves the AGENT answer and exact replayable receipt. Workspace catalog enumeration errors now increment the Conversation recovery failure count; a shared list_workspaces() failure also yields EXPIRED_EXECUTION_LEASE_RECOVERY_FAILED and CONVERSATION_SESSION_RECOVERY_FAILED, persisted as DEGRADED before Operator admission. CODE regressions: conversation_session_recovery_reports_workspace_enumeration_failure and startup_workspace_enumeration_failure_persists_recovery_blockers. A-104: startup does not reconcile prior-incarnation AgentHostInstance process rows; OpenCode's persisted process identity is PID-only. Exact failed-turn UI/Retry projection, host-process reconciliation, the full crash-window matrix, and real process-kill or packaged restart qualification remain open"
