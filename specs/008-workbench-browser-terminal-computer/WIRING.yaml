feature_id: "008"
status: "DRAFT"
nodes:
  - id: "ui"
    owner: Desktop UI
    kind: component
  - id: "operator"
    owner: authenticated Operator
    kind: service
  - id: "owner"
    owner: domain owner service
    kind: service
  - id: "storage"
    owner: Storage
    kind: store
  - id: "browser"
    owner: browser provider
    kind: external
  - id: "pty"
    owner: PTY host
    kind: external
edges:
  - id: "e-ui-op"
    from: "ui"
    to: "operator"
    kind: command
  - id: "e-op-owner"
    from: "operator"
    to: "owner"
    kind: request
  - id: "e-owner-storage"
    from: "owner"
    to: "storage"
    kind: transaction
  - id: "e-storage-ui"
    from: "storage"
    to: "ui"
    kind: projection
  - id: "e-owner-browser"
    from: "owner"
    to: "browser"
    kind: action
  - id: "e-owner-pty"
    from: "owner"
    to: "pty"
    kind: session
transactions:
  - id: "tx-epoch"
    owner: Trust and browser owner
    atomic_records: ["browser_epoch","consent"]
    external_calls_inside: false
  - id: "tx-term"
    owner: Environment owner
    atomic_records: ["terminal_session"]
    external_calls_inside: false
external_boundaries:
  - id: "outside-sqlite"
    owner: domain owner
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
recovery:
  owner: domain owner
  source_of_truth: durable-owner-records
  restart_action: reload-last-commit-and-reconcile
