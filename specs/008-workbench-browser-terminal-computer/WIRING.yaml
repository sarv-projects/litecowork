feature_id: "008"
status: "IN_REVIEW"
# TARGET only: the contextual object-tab shell reads existing owner objects and local layout state.
# Tab selection/restore has no edge that starts a provider, grants authority or dispatches work.
nodes:
  - id: "ui"
    owner: Desktop UI
    kind: component
  - id: "settings-ui"
    owner: Desktop Settings shell (target Browser & Computer category; revision 1.1 TARGET, not currently mounted)
    kind: component
  - id: "operator"
    owner: authenticated Operator
    kind: service
  - id: "owner"
    owner: domain owner service
    kind: service
  - id: "storage"
    owner: Storage
    kind: store
  - id: "browser"
    owner: browser provider
    kind: external
  - id: "browser-profile-owner"
    owner: Browser profile/session domain owner
    kind: service
  - id: "browser-access-owner"
    owner: Trust grant, Workspace request-policy, BrowserLeaseArbiter and effective-access projection owner
    kind: service
  - id: "agent-session-capability-owner"
    owner: Feature 001/002 provider-specific AgentSession and mediated-tool capability owner
    kind: service
  - id: "pty"
    owner: PTY host
    kind: external
  - id: "activity"
    owner: Workbench Activity read projection over committed events (target)
    kind: service
  - id: "diff"
    owner: exact-revision and VCS diff service in litecoworkd (target)
    kind: service
  - id: "computer-session"
    owner: ComputerSessionService under Environment and Trust owners (revision 1.1 TARGET)
    kind: service
  - id: "capture-broker"
    owner: private native capture broker (provider recommendation not selected)
    kind: external
  - id: "input-arbiter"
    owner: existing Environment control authority and serialized physical desktop broker
    kind: service
  - id: "canvas"
    owner: existing exact-version Artifact and editor owner (not a new runtime)
    kind: component
edges:
  - id: "e-ui-op"
    from: "ui"
    to: "operator"
    kind: command
  - id: "e-settings-op"
    from: "settings-ui"
    to: "operator"
    kind: authenticated-browser-settings-query-or-command-target-only
  - id: "e-op-profile-settings-read"
    from: "operator"
    to: "browser-profile-owner"
    kind: workspace-profile-settings-read-target-only
  - id: "e-op-access-settings-read"
    from: "operator"
    to: "browser-access-owner"
    kind: effective-origin-and-workspace-policy-read-target-only
  - id: "e-op-agent-capability-read"
    from: "operator"
    to: "agent-session-capability-owner"
    kind: provider-specific-mediated-browser-tool-capability-read-target-only
  - id: "e-op-profile-settings"
    from: "operator"
    to: "browser-profile-owner"
    kind: profile-status-import-cleanup-target-only
  - id: "e-op-browser-access-settings"
    from: "operator"
    to: "browser-access-owner"
    kind: workspace-request-policy-and-exact-origin-grant-target-only
  - id: "e-access-owner-agent-capability-gate"
    from: "browser-access-owner"
    to: "agent-session-capability-owner"
    kind: verify-provider-tool-provisioning-before-policy-mutation-or-new-session-target-only
  - id: "e-profile-settings-storage"
    from: "browser-profile-owner"
    to: "storage"
    kind: versioned-profile-data-target-only
  - id: "e-browser-access-settings-storage"
    from: "browser-access-owner"
    to: "storage"
    kind: scoped-policy-and-grant-target-only
  - id: "e-storage-profile-owner-read"
    from: "storage"
    to: "browser-profile-owner"
    kind: authorized-versioned-profile-projection-read-target-only
  - id: "e-storage-access-owner-read"
    from: "storage"
    to: "browser-access-owner"
    kind: authorized-workspace-origin-and-grant-projection-read-target-only
  - id: "e-agent-capability-owner-op-response"
    from: "agent-session-capability-owner"
    to: "operator"
    kind: provider-capability-observation-target-only
  - id: "e-profile-owner-op-projection"
    from: "browser-profile-owner"
    to: "operator"
    kind: authorized-profile-settings-projection-target-only
  - id: "e-access-owner-op-projection"
    from: "browser-access-owner"
    to: "operator"
    kind: effective-permission-and-source-reason-projection-target-only
  - id: "e-op-settings-projection"
    from: "operator"
    to: "settings-ui"
    kind: authenticated-typed-settings-response-target-only
  - id: "e-profile-owner-browser-effect"
    from: "browser-profile-owner"
    to: "browser"
    kind: staged-import-or-profile-cleanup-after-durable-intent-target-only
  - id: "e-browser-profile-owner-result"
    from: "browser"
    to: "browser-profile-owner"
    kind: untrusted-provider-result-for-reconciliation-target-only
  - id: "e-op-owner"
    from: "operator"
    to: "owner"
    kind: request
  - id: "e-owner-storage"
    from: "owner"
    to: "storage"
    kind: transaction
  - id: "e-storage-ui"
    from: "storage"
    to: "ui"
    kind: projection
  - id: "e-owner-browser"
    from: "owner"
    to: "browser"
    kind: action
  - id: "e-owner-pty"
    from: "owner"
    to: "pty"
    kind: session
  - id: "e-op-activity"
    from: "operator"
    to: "activity"
    kind: read-target-only
  - id: "e-activity-storage"
    from: "activity"
    to: "storage"
    kind: committed-event-read
  - id: "e-op-diff"
    from: "operator"
    to: "diff"
    kind: read-target-only
  - id: "e-diff-storage"
    from: "diff"
    to: "storage"
    kind: exact-revision-read
  - id: "e-op-computer"
    from: "operator"
    to: "computer-session"
    kind: authenticated-command-target-only
  - id: "e-computer-storage"
    from: "computer-session"
    to: "storage"
    kind: session-permit-intent-receipt-transaction
  - id: "e-computer-capture"
    from: "computer-session"
    to: "capture-broker"
    kind: authorized-outside-transaction-target-only
  - id: "e-capture-ui"
    from: "capture-broker"
    to: "ui"
    kind: redacted-bounded-ephemeral-frames-target-only
  - id: "e-computer-input"
    from: "computer-session"
    to: "input-arbiter"
    kind: last-hop-epoch-and-attempt-effect-authorized-input-target-only
  - id: "e-ui-canvas"
    from: "ui"
    to: "canvas"
    kind: authorized-exact-artifact-version-view-target-only
transactions:
  - id: "tx-epoch"
    owner: Trust and browser owner
    atomic_records: ["browser_epoch","consent"]
    external_calls_inside: false
  - id: "tx-term"
    owner: Environment owner
    atomic_records: ["terminal_session", "command_receipt", "quiescence_receipt"]
    external_calls_inside: false
  - id: "tx-computer-permit"
    owner: Trust and Environment session owner (revision 1.1 TARGET)
    atomic_records: ["computer_session_revision", "audience_observation_permit", "audit", "outbox", "idempotency_receipt"]
    external_calls_inside: false
  - id: "tx-computer-fence"
    owner: existing EnvironmentControlLease authority (no second lease store)
    atomic_records: ["control_lease_epoch", "transfer_intent", "action_receipt", "audit", "outbox", "idempotency_receipt"]
    external_calls_inside: false
external_boundaries:
  - id: "browser-profile-provider-effect"
    owner: Browser profile owner
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
  - id: "outside-sqlite"
    owner: domain owner
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
recovery:
  owner: domain owner
  source_of_truth: durable-owner-records
  restart_action: reload-last-commit-and-reconcile

