feature_id: "007"
status: "DRAFT"
nodes:
  - id: "ui"
    owner: Desktop UI
    kind: component
  - id: "operator"
    owner: authenticated Operator
    kind: service
  - id: "owner"
    owner: domain owner service
    kind: service
  - id: "storage"
    owner: Storage
    kind: store
  - id: "editor"
    owner: format editor engine
    kind: external
edges:
  - id: "e-ui-op"
    from: "ui"
    to: "operator"
    kind: command
  - id: "e-op-owner"
    from: "operator"
    to: "owner"
    kind: request
  - id: "e-owner-storage"
    from: "owner"
    to: "storage"
    kind: transaction
  - id: "e-storage-ui"
    from: "storage"
    to: "ui"
    kind: projection
  - id: "e-owner-editor"
    from: "owner"
    to: "editor"
    kind: edit
  - id: "e-editor-owner"
    from: "editor"
    to: "owner"
    kind: bytes
transactions:
  - id: "tx-version"
    owner: ArtifactStore
    atomic_records: ["artifact_version","provenance"]
    external_calls_inside: false
  - id: "tx-export"
    owner: ArtifactStore
    atomic_records: ["export_receipt"]
    external_calls_inside: false
external_boundaries:
  - id: "outside-sqlite"
    owner: domain owner
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
recovery:
  owner: domain owner
  source_of_truth: durable-owner-records
  restart_action: reload-last-commit-and-reconcile

