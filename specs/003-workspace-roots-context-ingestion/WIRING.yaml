feature_id: "003"
status: "DRAFT"
nodes:
  - id: "ui"
    owner: Desktop UI
    kind: component
  - id: "operator"
    owner: authenticated Operator
    kind: service
  - id: "owner"
    owner: domain owner service
    kind: service
  - id: "storage"
    owner: Storage
    kind: store
  - id: "fs"
    owner: OS directory identity
    kind: external
edges:
  - id: "e-ui-op"
    from: "ui"
    to: "operator"
    kind: command
  - id: "e-op-owner"
    from: "operator"
    to: "owner"
    kind: request
  - id: "e-owner-storage"
    from: "owner"
    to: "storage"
    kind: transaction
  - id: "e-storage-ui"
    from: "storage"
    to: "ui"
    kind: projection
  - id: "e-owner-fs"
    from: "owner"
    to: "fs"
    kind: reopen
  - id: "e-fs-owner"
    from: "fs"
    to: "owner"
    kind: identity
transactions:
  - id: "tx-root"
    owner: ResourceService
    atomic_records: ["workspace_root","private_binding"]
    external_calls_inside: false
  - id: "tx-attach"
    owner: Conversation context owner
    atomic_records: ["context_attachment"]
    external_calls_inside: false
external_boundaries:
  - id: "outside-sqlite"
    owner: domain owner
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
recovery:
  owner: domain owner
  source_of_truth: durable-owner-records
  restart_action: reload-last-commit-and-reconcile
