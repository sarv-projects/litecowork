feature_id: "016"
name: "Intelligent Workspace Presentation Runtime"
status: "IN_REVIEW"
spec_revision: "0.4-proposed"
notes: "Revision 0.4 is a TARGET proposal. The product owner directed Saved Views to remain in V1 and Feature 007 B-21 to be amended; its cross-owner review, T01 whole-scope acceptance and T02 contract promotion remain open. Existing reads/stream are SERVED; validators are partial CODE. No production publisher, media ingestion, interactive renderer, Canvas controller, remembered-state route or Saved View route exists. Saved Views preserve declared defaults only; B-40 changed-input state remains transient."
nodes:
  - id: "session-supervisor"
    owner: "AgentSessionSupervisor (Feature 001)"
    kind: "runtime supervisor"
    responsibility: "Final semantic text commit; hands harness file outputs to media ingestion"
    inputs: ["native observations"]
    outputs: ["committed AGENT message", "harness file paths"]
  - id: "presentation-binder"
    owner: "PresentationBinder"
    kind: "daemon service"
    responsibility: "Derive a RichPresentation from committed semantic text and validated PresentationIntent after commit"
    implementation_status: "TARGET_ONLY"
    inputs: ["committed AGENT message"]
    outputs: ["candidate document"]
  - id: "presentation-validator"
    owner: "domain-presentation crate"
    kind: "pure library"
    responsibility: "Bounds, V1 allowlist, canonical bytes, digests, slice bindings, chart bindings, CalcAst"
    implementation_status: "PARTIAL: checks exist inside storage-sqlite rich_presentations.rs for five baseline kinds"
    inputs: ["document bytes", "semantic context"]
    outputs: ["validated document or typed rejection"]
  - id: "presentation-store"
    owner: "RichPresentationStore (Storage)"
    kind: "transaction boundary"
    responsibility: "Publish, idempotent replay, reads"
    inputs: ["validated document"]
    outputs: ["committed presentation"]
  - id: "media-ingestion"
    owner: "MediaIngestionService"
    kind: "daemon service"
    responsibility: "Sniff, bound and hash harness image files; request Artifact create"
    implementation_status: "TARGET_ONLY"
    inputs: ["admitted Workspace file path"]
    outputs: ["blob", "Artifact create request"]
  - id: "artifact-service"
    owner: "Feature 007 Artifact create"
    kind: "external feature service"
    responsibility: "Atomic Artifact and ArtifactVersion create with provenance and Conversation association"
    inputs: ["create request"]
    outputs: ["Artifact version"]
  - id: "presentation-operator"
    owner: "Presentation Operator"
    kind: "authenticated boundary"
    responsibility: "GET /v1/rich-presentations/{presentation_id}, GET /v1/conversations/{conversation_id}/presentation, POST /v1/stream (existing)"
    inputs: ["IPC request"]
    outputs: ["authorized projection"]
  - id: "conversation-bridge"
    owner: "Tauri conversation_bridge"
    kind: "IPC client"
    responsibility: "get_rich_presentation with valid_rich_presentation_response (existing)"
    inputs: ["UI request"]
    outputs: ["envelope"]
  - id: "desktop-validator"
    owner: "rich-presentation.ts"
    kind: "component"
    responsibility: "Defensive re-validation mirroring the Rust validator; fallback decision"
    inputs: ["envelope", "semantic text", "preference"]
    outputs: ["validated presentation or null"]
  - id: "rich-view"
    owner: "Desktop UI"
    kind: "component"
    responsibility: "RichResponseView, ChartBlock, SafeCalculatorBlock, semantic fallback, accessibility"
    inputs: ["validated presentation", "semantic text"]
    outputs: ["rendered view (no host commands)"]
  - id: "artifact-workbench"
    owner: "Desktop UI (Artifacts)"
    kind: "component"
    responsibility: "Image Artifact view; interactive Artifact inert PREVIEW_ONLY"
    inputs: ["Artifact projection"]
    outputs: ["rendered view"]
edges:
  - id: "e-supervisor-binder"
    from: "session-supervisor"
    to: "presentation-binder"
    kind: "after-commit call"
  - id: "e-binder-validator"
    from: "presentation-binder"
    to: "presentation-validator"
    kind: "validate"
  - id: "e-binder-store"
    from: "presentation-binder"
    to: "presentation-store"
    kind: "publish"
  - id: "e-store-validator"
    from: "presentation-store"
    to: "presentation-validator"
    kind: "validate inside publish before insert (pure, no I/O)"
  - id: "e-supervisor-media"
    from: "session-supervisor"
    to: "media-ingestion"
    kind: "harness file output"
  - id: "e-media-artifact"
    from: "media-ingestion"
    to: "artifact-service"
    kind: "create Artifact version"
  - id: "e-store-operator"
    from: "presentation-store"
    to: "presentation-operator"
    kind: "read"
  - id: "e-operator-bridge"
    from: "presentation-operator"
    to: "conversation-bridge"
    kind: "authenticated IPC response"
  - id: "e-bridge-desktop-validator"
    from: "conversation-bridge"
    to: "desktop-validator"
    kind: "envelope"
  - id: "e-desktop-validator-view"
    from: "desktop-validator"
    to: "rich-view"
    kind: "validated presentation or fallback"
  - id: "e-artifact-workbench"
    from: "artifact-service"
    to: "artifact-workbench"
    kind: "Artifact projection (via Feature 007 routes)"
transactions:
  - id: "tx-publish-presentation"
    owner: "RichPresentationStore"
    atomic_records: ["rich_presentations row", "blob reference", "rich.presentation.published.v1", "idempotency receipt"]
    external_calls_inside: false
  - id: "tx-record-rejection"
    owner: "PresentationBinder via Storage"
    atomic_records: ["rich.presentation.rejected.v1"]
    external_calls_inside: false
  - id: "tx-media-artifact-create"
    owner: "Feature 007 Artifact create"
    atomic_records: ["Artifact", "ArtifactVersion with provenance", "Conversation association", "artifact created event", "idempotency receipt"]
    external_calls_inside: false
external_boundaries:
  - id: "harness-semantic-output"
    owner: "AgentSessionSupervisor"
    input_trust: "untrusted"
    timeout: "turn-bounded (Feature 001)"
    retry: "binder failure never retries the turn"
  - id: "harness-file-output"
    owner: "MediaIngestionService"
    input_trust: "untrusted"
    timeout: "bounded read of at most 20 MiB"
    retry: "none; a rejected file stays a rejection"
  - id: "webview-render"
    owner: "Desktop UI"
    input_trust: "validated data only"
    timeout: "render budget 100 ms per main-thread task"
    retry: "fallback to semantic text"

# Revision 0.4 revised V1 graph. Every node and edge below is TARGET unless an owner route above is explicitly marked existing.
revision_0_3_review:
  status: "TARGET_PROPOSAL_BLOCKED"
  authority: "Feature 016 SPEC section 20; docs/ACP-PRESENTATION-PIPELINE-LLD.md; canonical owner schemas only"
  acceptance_gate: ["T25 completes cross-owner review of the selected Feature 007 Saved View direction", "T01 accepts/revises complete V1 AC set", "T02 promotes canonical contracts before implementation"]
  baseline: "B-40 SAFE_CALCULATOR posture remains; executable Interactive Artifact Runtime stays PREVIEW_ONLY"
  nodes:
    - id: "qualified-intent-ingress"
      owner: "AgentModule and Conversation"
      inputs: ["exact provider/version/auth descriptor", "correlated native structured output or scoped local MCP proposal", "bounded semantic text fallback"]
      outputs: ["ephemeral validated intent with host-derived scope"]
      authority: "proposal only; tool_call observation is not host execution"
    - id: "surface-controller"
      owner: "Desktop Presentation Runtime"
      inputs: ["validated immutable presentation", "declared primitive inputs"]
      outputs: ["same revision to inline and Workbench Canvas", "deterministic derived outputs", "semantic fallback"]
    - id: "interaction-state-service"
      owner: "Presentation Runtime and Storage"
      inputs: ["authenticated owner consent", "exact document namespace", "expected revision", "RequestId and payload digest"]
      outputs: ["state-only receipt", "authorized input projection", "content-free event"]
    - id: "modification-review"
      owner: "Conversation and host UI"
      inputs: ["explicitly previewed selected snapshot", "parent presentation and base revision"]
      outputs: ["ordinary new Conversation turn", "new-message presentation lineage"]
    - id: "saved-view-artifact"
      owner: "ArtifactStore and Library (Feature 007), after T25/T01/T02 acceptance and route promotion"
      inputs: ["exact RichPresentation digest", "source Conversation/message ids", "canonical presentation declared defaults only", "owner-authorized request identity"]
      outputs: ["immutable ArtifactVersion", "Library projection", "durable owner receipt"]
      authority: "proposal only; Feature 007 decides whether its Artifact model can represent this without weakening Artifact invariants"
    - id: "contextual-canvas"
      owner: "Workbench (Feature 008)"
      inputs: ["authorized current view or exact Saved View version", "source object identity", "declared RichPresentation defaults only"]
      outputs: ["contextual right-side Canvas tab", "focus/scroll return point"]
      authority: "proposal only; no new permanent sidebar destination or provider start"
  edges:
    - from: "qualified-intent-ingress"
      to: "presentation-binder"
      kind: "candidate staging; semantic commit must precede independent publish"
    - from: "rich-view"
      to: "surface-controller"
      kind: "host navigation Open in Canvas/Return; one controller, no agent dispatch"
    - from: "contextual-canvas"
      to: "surface-controller"
      kind: "reuse the exact message/document/controller identity"
    - from: "surface-controller"
      to: "interaction-state-service"
      kind: "host-only Remember/Forget commands after separate consent; unavailable until T22"
    - from: "surface-controller"
      to: "modification-review"
      kind: "Ask to change this view; explicit snapshot review and Send only"
    - from: "surface-controller"
      to: "saved-view-artifact"
      kind: "explicit capability-gated Save/Open/Update/Archive through Feature 007 owner command and receipt"
    - from: "modification-review"
      to: "session-supervisor"
      kind: "Feature 001 admitted new turn, never original-message mutation"
  transactions:
    - id: "tx-interaction-update-proposed"
      owner: "Storage"
      atomic_records: ["compare expected revision and deletion fence", "allowlisted input state", "idempotency receipt", "content-free state-change event"]
      external_calls_inside: false
    - id: "tx-interaction-forget-proposed"
      owner: "Storage and retention owners"
      atomic_records: ["delete protected input content", "advance deletion fence", "minimal allowed receipt"]
      external_calls_inside: false
    - id: "tx-saved-view-artifact-owner-proposed"
      owner: "Feature 007 ArtifactStore"
      atomic_records: ["create or append exact immutable ArtifactVersion", "source lineage", "idempotency receipt", "Artifact/Library projection event"]
      external_calls_inside: false
  recovery:
    - "Wrong session/retry/incarnation or unsupported ingress: refuse proposal, preserve semantic turn"
    - "State timeout: reconcile same RequestId; two-window revision conflict preserves local draft"
    - "Remember/Forget and Conversation deletion/revocation fence late state writes; backup cannot resurrect forgotten content"
    - "Saved View timeout/conflict: reconcile exact Feature 007 receipt/version; preserve draft and never substitute latest version"
    - "Changed document namespace starts fresh; migration needs explicit preview and consent"
    - "Late agent modification creates no overwrite; compare base revision and require review"
  gates: ["T25 cross-owner review of the selected Feature 007 Saved View direction", "T01 whole revised V1 scope acceptance after T25", "T02 canonical contract promotion", "T20 provider-specific ingress evidence or deliberate semantic-only fallback; resolve A-85 before exposing a tool", "T21 shared inline/Canvas controller under Feature 008", "T22 separate remembered-input state consent/privacy/migration review", "T23 Feature 007 Saved View operations plus explicit Feature 001 new-turn modification", "T24 exact packaged SYSTEM and USER evidence for all accepted ACs"]
