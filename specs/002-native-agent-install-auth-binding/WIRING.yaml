feature_id: "002"
status: "ACCEPTED/LOCKED"
nodes:
  - id: "catalog-ui"
    owner: Settings Agent Catalog and profile UI
    kind: component
  - id: "operator"
    owner: authenticated Operator
    kind: service
  - id: "registry"
    owner: AgentRegistryService
    kind: service
  - id: "lifecycle"
    owner: AgentLifecycleService
    kind: service
  - id: "profile"
    owner: AgentProfile and descriptor owner
    kind: service
  - id: "auth-observation"
    owner: Runtime-local AgentAuthObservationStore
    kind: store
  - id: "credential-submission-receipt"
    owner: Runtime-local AgentCredentialSubmissionStore (v36)
    kind: store
  - id: "binding"
    owner: AgentBindingService
    kind: service
  - id: "storage"
    owner: Runtime-local and Workspace-scoped stores
    kind: store
  - id: "native-module"
    owner: trusted AgentModule / AgentLifecycleAdapter
    kind: external
  - id: "os-auth"
    owner: native agent auth / OS credential broker
    kind: external
  - id: "os-secret-store"
    owner: local OS keyring through write-only SecretStore
    kind: external
  - id: "conversation"
    owner: Feature 001 Conversation supervisor
    kind: service
edges:
  - id: "e-ui-op"
    from: "catalog-ui"
    to: "operator"
    kind: command-and-scoped-read
  - id: "e-op-registry"
    from: "operator"
    to: "registry"
    kind: discovery-request
  - id: "e-registry-store"
    from: "registry"
    to: "storage"
    kind: cached-metadata
  - id: "e-op-lifecycle"
    from: "operator"
    to: "lifecycle"
    kind: lifecycle-command
  - id: "e-lifecycle-native"
    from: "lifecycle"
    to: "native-module"
    kind: bounded-module-call-outside-transaction
  - id: "e-native-observation"
    from: "native-module"
    to: "lifecycle"
    kind: version-auth-config-readiness-observation
  - id: "e-lifecycle-store"
    from: "lifecycle"
    to: "storage"
    kind: runtime-local-observation-and-receipt
  - id: "e-op-profile"
    from: "operator"
    to: "profile"
    kind: profile-and-descriptor-read
  - id: "e-profile-auth"
    from: "profile"
    to: "os-auth"
    kind: native-login-or-secure-slot-broker
  - id: "e-auth-observation"
    from: "operator"
    to: "auth-observation"
    kind: profile-runtime-incarnation-scoped-reservation-and-read
  - id: "e-auth-launch"
    from: "operator"
    to: "os-auth"
    kind: bounded-native-launch-after-reservation-outside-transaction
  - id: "e-auth-projection"
    from: "auth-observation"
    to: "profile"
    kind: exact-scope-unexpired-generation-fenced-descriptor-overlay
  - id: "e-credential-reservation"
    from: "operator"
    to: "credential-submission-receipt"
    kind: owner-scoped-exact-replay-and-pending-reservation-before-descriptor-side-effect
  - id: "e-credential-keyring"
    from: "operator"
    to: "os-secret-store"
    kind: idempotent-write-to-preallocated-secret-ref-outside-sqlite
  - id: "e-credential-settlement"
    from: "credential-submission-receipt"
    to: "storage"
    kind: v36-pending-to-committed-receipt-and-metadata-audit-transaction
  - id: "e-op-binding"
    from: "operator"
    to: "binding"
    kind: workspace-cas-command
  - id: "e-binding-store"
    from: "binding"
    to: "storage"
    kind: transaction-and-idempotency-receipt
  - id: "e-conversation"
    from: "binding"
    to: "conversation"
    kind: future-admission-binding-reference
  - id: "e-store-ui"
    from: "storage"
    to: "catalog-ui"
    kind: scoped-projection
transactions:
  - id: "tx-registry-observation"
    owner: AgentRegistryService
    atomic_records: ["registry_cache_snapshot"]
    external_calls_inside: false
  - id: "tx-install-operation"
    owner: AgentLifecycleService
    atomic_records: ["lifecycle_operation_intent", "lifecycle_operation_receipt", "installation_observation"]
    external_calls_inside: false
  - id: "tx-profile-observation"
    owner: AgentProfileService
    atomic_records: ["profile_observation", "control_descriptor"]
    external_calls_inside: false
  - id: "tx-auth-reservation"
    owner: Agent Runtime
    atomic_records: ["agent_auth_observation: exact profile/runtime/incarnation/module/version/method scope, generation, AUTHENTICATING, observed_at, expires_at"]
    external_calls_inside: false
  - id: "tx-credential-reservation"
    owner: AgentCredentialSubmissionStore
    atomic_records: ["agent_credential_submission_receipts: operation scope, key digest, keyed request fingerprint, SecretKind, preallocated SecretRef ID, PENDING, created_at"]
    external_calls_inside: false
  - id: "tx-credential-settlement"
    owner: AgentCredentialSubmissionStore
    atomic_records: ["agent_credential_submission_receipts: provider_ref, COMMITTED, committed_at", "audit_records: slot and opaque SecretRef metadata only"]
    external_calls_inside: false
  - id: "tx-binding"
    owner: AgentBindingService
    atomic_records: ["agent_binding", "domain_event", "idempotency_receipt", "audit_record"]
    external_calls_inside: false
external_boundaries:
  - id: "native-lifecycle"
    owner: trusted AgentModule
    input_trust: validated-module-request-only
    timeout: bounded
    retry: reconcile-before-retry
  - id: "native-auth"
    owner: native harness or OS credential broker
    input_trust: descriptor-declared-method-and-slot-only
    timeout: bounded
    retry: never-replay-secret; reconcile-auth-observation
  - id: "credential-keyring"
    owner: local OS keyring
    input_trust: authenticated-owner-and-fresh-LITECOWORK_SECRET_STORE-slot
    timeout: operating-system-credential-store-boundary
    retry: same-preallocated-secret-ref; compare-existing-content-in-private-adapter; never-overwrite-different-content
recovery:
  owner: Agent Runtime and Workspace binding owners
  source_of_truth: last-committed-runtime-observation-workspace-binding-receipt-and-credential-submission-receipt
  restart_action: re-probe-runtime-incarnation-and-install-auth-descriptor-independently; preserve-binding; reconcile-in-flight-lifecycle-before-new-side-effect; exact credential retry resumes PENDING v36 receipt through same keyring account before descriptor reread

# Status note (updated 2026-11-23): this graph remains accepted TARGET wiring, with A-120 USER-DELEGATED
# direction recorded for durable auth observations; it is not Agent Runtime/Storage/Security owner ratification or evidence that
# every edge is fully implemented or qualified. CODE/SERVED cross-check:
# - The profile probe -> computed OpenCode offer -> disabled AgentBinding path is implemented for the exact
#   2.0.32/complete-probe/observed-host-stop tuple (002-T01); no packaged native bind/send journey is qualified.
# - Descriptor GET/refresh is served for the OpenCode module through `agent_control_operator.rs` and
#   `AgentDescriptorService`; persistence reuses the migration-16 `agent_control_descriptors` table (002-T04/T05).
#   Probe throttling is in-memory; `getAgentSessionOptions` and `getAgentHarnessCapabilities` are served
#   projections of the same fresh descriptor. Neither route mounts a model picker or proves dispatchability.
# - Enable uses a fresh descriptor-revision CAS for descriptor-backed profiles; legacy module-less profiles do
#   not enforce that check yet (002-T06).
# - Auth-begin/native-config routes and ID-only bridges exist, but the production launcher/opener fail closed;
#   OpenCode declares no method/target. T07 now owns the exact-scope persistent observation path, while provider
#   login, module-reported completion/re-probe and packaged qualification remain unavailable (002-T07/T10).
# - CODE/SERVED includes the authenticated `agent_credentials_routes.rs::submit_credential` sequence:
#   owner-scoped receipt lookup and Runtime-keyed fingerprint first; fresh profile/descriptor/slot
#   validation for new operations; short PENDING reservation; idempotent SecretStore write outside
#   SQLite; then receipt and metadata-audit settlement. Exact replay/conflict and seeded-PENDING
#   recovery have route tests. The seeded retry is not a daemon restart test. Current OpenCode/Claude
#   descriptors declare no LiteCowork slot, so no provider sign-in or visible UI journey exists;
#   native OS-keyring restart qualification remains open (002-T08).
# - The ACP client and Matchmaker are code-level components but are not wired to a qualified provider flow
#   (002-T17/T18). Install/update remain target-only; model-option and harness-capability projections are served,
#   but the Tauri picker bridge and Conversation admission consumer remain absent.
