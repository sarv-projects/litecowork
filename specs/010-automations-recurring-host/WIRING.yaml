feature_id: "010"
status: "DRAFT"
nodes:
  - id: "ui"
    owner: Desktop UI
    kind: component
  - id: "operator"
    owner: authenticated Operator
    kind: service
  - id: "owner"
    owner: domain owner service
    kind: service
  - id: "storage"
    owner: Storage
    kind: store
  - id: "clock"
    owner: local clock and Runtime wake
    kind: external
edges:
  - id: "e-ui-op"
    from: "ui"
    to: "operator"
    kind: command
  - id: "e-op-owner"
    from: "operator"
    to: "owner"
    kind: request
  - id: "e-owner-storage"
    from: "owner"
    to: "storage"
    kind: transaction
  - id: "e-storage-ui"
    from: "storage"
    to: "ui"
    kind: projection
  - id: "e-clock-owner"
    from: "clock"
    to: "owner"
    kind: fire
  - id: "e-owner-clock"
    from: "owner"
    to: "clock"
    kind: cursor
transactions:
  - id: "tx-occurrence"
    owner: TriggerHost
    atomic_records: ["automation_occurrence"]
    external_calls_inside: false
  - id: "tx-link"
    owner: TaskService
    atomic_records: ["task","occurrence_link"]
    external_calls_inside: false
external_boundaries:
  - id: "outside-sqlite"
    owner: domain owner
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
recovery:
  owner: domain owner
  source_of_truth: durable-owner-records
  restart_action: reload-last-commit-and-reconcile
