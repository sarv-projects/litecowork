feature_id: "010"
status: "ACCEPTED/LOCKED"
# Owner-accepted 2026-11-09. Edges below are accepted target wiring unless a comment says
# the path is served today; acceptance is not evidence that an edge is served.
nodes:
  - id: "ui"
    owner: Desktop UI
    kind: component
  - id: "operator"
    owner: authenticated Operator
    kind: service
  - id: "owner"
    owner: Automation / Routine domain owner
    kind: service
  - id: "storage"
    owner: Storage
    kind: store
  - id: "trigger-host"
    owner: local AutomationTriggerHostWorker
    kind: service
  - id: "task-service"
    owner: Feature 005 TaskService (materialization only in this feature)
    kind: service
  - id: "notification-policy"
    owner: NotificationService and Workspace preferences
    kind: service
  - id: "local-presenter"
    owner: Desktop notification presenter (TARGET; no claim/settle worker served)
    kind: component
  - id: "connection-broker"
    owner: Feature 006 Connection broker (TARGET for CONNECTOR_EVENT)
    kind: service
  - id: "clock"
    owner: local clock and Runtime wake
    kind: external
  - id: "capability-invocation"
    owner: Capability Fabric / CapabilityInvocation owner
    kind: service
  - id: "external-workflow"
    owner: optional target-only external WorkflowBackendAdapter (not implemented in this checkout)
    kind: external
edges:
  - id: "e-ui-op"
    from: "ui"
    to: "operator"
    kind: command
  - id: "e-op-owner"
    from: "operator"
    to: "owner"
    kind: request
  - id: "e-owner-storage"
    from: "owner"
    to: "storage"
    kind: transaction
  - id: "e-storage-ui"
    from: "storage"
    to: "ui"
    kind: projection
  - id: "e-clock-owner"
    from: "clock"
    to: "trigger-host"
    kind: observe
  - id: "e-trigger-cursor"
    from: "trigger-host"
    to: "storage"
    kind: schedule-cursor-read-and-advance
  - id: "e-trigger-materialize"
    from: "trigger-host"
    to: "task-service"
    kind: materialize-one-ready-task-per-occurrence
  - id: "e-trigger-occurrence"
    from: "trigger-host"
    to: "storage"
    kind: occurrence-identity-commit
  - id: "e-outcome-notification"
    from: "owner"
    to: "notification-policy"
    kind: decide-from-settled-outcome-and-preference
  - id: "e-notification-row"
    from: "notification-policy"
    to: "storage"
    kind: pending-or-suppressed-delivery-write
  - id: "e-notification-claim"
    from: "local-presenter"
    to: "operator"
    kind: claim-and-settle-command-TARGET
  - id: "e-notification-projection"
    from: "storage"
    to: "ui"
    kind: delivery-status-projection
  - id: "e-connector-observe"
    from: "trigger-host"
    to: "connection-broker"
    kind: poll-provider-events-TARGET
  - id: "e-connector-receipt"
    from: "connection-broker"
    to: "trigger-host"
    kind: untrusted-event-observation-TARGET
  - id: "e-owner-invocation"
    from: "owner"
    to: "capability-invocation"
    kind: request
  - id: "e-invocation-backend"
    from: "capability-invocation"
    to: "external-workflow"
    kind: external-call
  - id: "e-backend-observation"
    from: "external-workflow"
    to: "capability-invocation"
    kind: observation
transactions:
  - id: "tx-occurrence"
    owner: TriggerHost
    atomic_records: ["automation_occurrence"]
    external_calls_inside: false
  - id: "tx-link"
    owner: TaskService
    atomic_records: ["task","occurrence_link"]
    external_calls_inside: false
  - id: "tx-outcome-settlement"
    owner: TriggerHost + Storage / NotificationService decision
    atomic_records: ["automation_occurrences", "domain_events", "notification_deliveries"]
    external_calls_inside: false
  - id: "tx-notification-claim"
    owner: NotificationService (TARGET)
    atomic_records: ["notification_deliveries"]
    external_calls_inside: false
  - id: "tx-notification-settle"
    owner: NotificationService (TARGET)
    atomic_records: ["notification_deliveries", "domain_events"]
    external_calls_inside: false
  - id: "tx-connector-event"
    owner: TriggerHost + Storage (TARGET)
    atomic_records: ["automation_occurrences", "automation_trigger_bindings", "domain_events"]
    external_calls_inside: false
# A-97: quiet-hours atomic record mapping is intentionally unresolved until the
# Workspace-level target is reconciled with the per-event-class preference owner.
# Connector event payload digest is a field on automation_occurrences, not a record.
external_boundaries:
  - id: "outside-sqlite"
    owner: domain owner
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
  - id: "connector-event-poll"
    owner: Feature 006 Connection broker (TARGET; not enabled by this checkout)
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
    cursor_storage: existing encrypted Runtime-local automation_trigger_bindings; exact event receipt mapping remains T09 work
  - id: "notification-presentation"
    owner: local desktop presenter (TARGET)
    input_trust: owner-projected notification class/status only; no Task body text
    timeout: bounded
    retry: settle FAILED or AMBIGUOUS; never infer SENT
  - id: "workflow-backend"
    owner: target-only WorkflowBackendAdapter; no production implementation exists
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
    result_owner: CapabilityInvocation
recovery:
  owner: domain owner
  source_of_truth: durable-owner-records
  restart_action: reload-last-commit-and-reconcile

# TARGET ONLY: there is no WorkflowBackendAdapter implementation or route in apps/ or crates/.
# Do not interpret the edge above as a currently served execution path.
# If implemented, the external workflow graph, graph revisions, provider nodes and provider
# run/step states remain provider-owned. LiteCowork stores only its Routine reference and
# CapabilityInvocation/Task/Attempt/Effect receipts authorized by their owner services.
