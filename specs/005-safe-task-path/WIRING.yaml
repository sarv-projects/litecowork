# Environment provisioning/attestation occurs outside SQLite. Planning reservation
# binds a Task-scoped read-only Environment to TASK_PLANNING. Attempt reservation binds
# a fresh ATTEMPT_PRIVATE Environment, Attempt, lease and ATTEMPT_EXECUTION session.
# Attempt admission does not authorize an Effect. File dispatch is a later transaction
# that revalidates the live lease/fence while atomically committing Invocation, Trust,
# Effect STARTED and ApprovalUse.
transactions:
  - id: "tx-task"
    owner: TaskService
    atomic_records: ["task","task_spec_revision","task.created.v1","idempotency_receipt"]
    external_calls_inside: false
  - id: "tx-attempt"
    owner: Task Runtime
    atomic_records: ["environment_metadata","attempt","step_current_attempt","execution_lease","agent_session_starting","attempt.created.v1","lease.acquired.v1","agent.session.starting.v1","idempotency_receipt"]
    preconditions: ["provider preparation and current-incarnation attestation completed outside SQLite","ATTEMPT_PRIVATE Environment matches Task/Attempt/Runtime/incarnation"]
    recovery: "If this transaction fails after provider preparation, Runtime destroys or quarantines the unbound Environment before retry. Provider launch is after commit."
    external_calls_inside: false
  - id: "tx-file-write-grant"
    owner: Trust + Storage
    atomic_records: ["capability_grant","capability_grant_aggregate_state","capability.grant.created.v1","audit_record","idempotency_receipt"]
    preconditions: ["Attempt is already admitted and RUNNING","current accepted PlanRevision and exact RUNNING Step match the request","active Attempt AgentSession and current Runtime incarnation","live unexpired lease/fence","active WorkspaceRoot","exact locally managed immutable candidate ResourceRevision is AVAILABLE, within the accepted/requested byte bound, and Resource.provenance.created_by_attempt equals this Attempt"]
    scope: "one CORE_BUILTIN workspace.file.replace operation bound to one Attempt, Step, WorkspaceRoot, normalized relative path, base digest, candidate ResourceRef/content digest/size, accepted plan-action digest and short expiry"
    approval_use: "none; the owner Approval is resolved separately and consumed only by tx-mediated-invocation-dispatch"
    recovery: "Exact retry replays the durable receipt before mutable Resource/lease revalidation; changed request payload conflicts. Lease/plan/root/resource races fail before any write."
    external_calls_inside: false
  - id: "tx-planner-session-reservation"
    owner: Task Runtime
    atomic_records: ["environment_metadata","agent_session_starting","agent.session.starting.v1","idempotency_receipt"]
    preconditions: ["read-only TASK_SHARED Environment is attested for exact TaskSpec revision and Resource set","current Runtime incarnation"]
    recovery: "If reservation fails after provider preparation, Runtime destroys or quarantines the unbound Environment before retry. Start planner only after commit."
    external_calls_inside: false
  - id: "tx-task-file-proposal"
    owner: Task Runtime + ResourceStore
    atomic_records: ["resource","immutable_resource_revision","resource.created.v1","resource aggregate snapshot","managed encrypted blob location","idempotency_receipt"]
    preconditions: ["Attempt/Step/Environment/current incarnation are owner-resolved","trusted runner frame is bounded and identity-correlated","provider observed recursive process-scope populated=0 and reaped the direct launcher","output channel returns only accepted Step's bounded bytes","Resource provenance.created_by_attempt equals the Attempt"]
    scope: "one output candidate per Attempt + Step; Runtime computes digest and uses the existing Resource lifecycle"
    authority_effect: "none; proposal capture does not issue Trust grant, Approval, CapabilityInvocation or Effect"
    replay: "exact same Attempt/Step/digest replays the Resource receipt; changed digest conflicts and requires a new Attempt"
    external_calls_inside: false
  - id: "tx-plan-accept"
    owner: TaskService
    atomic_records: ["task_aggregate_and_current_plan_pointer","plan_revision","steps","task.plan.revised.v1","step.created.v1","idempotency_receipt"]
    event_contract: "one step.created.v1 event for each committed Step; see docs/EVENTS.md"
    external_calls_inside: false
  - id: "tx-effect-propose"
    owner: Effect / CapabilityInvocation owner
    atomic_records: ["capability_invocation_created","effect","effect_aggregate_state","effect.proposed.v1","idempotency_receipt"]
    preconditions: ["exact ResourceRevision exists in same Workspace","target digest and size verified","Attempt and plan action are current"]
    external_calls_inside: false
  - id: "tx-effect-transition"
    owner: Effect owner
    atomic_records: ["effect","effect_aggregate_state","idempotency_receipt"]
    event_contract: "one applicable canonical non-STARTED Effect transition event; see docs/EVENTS.md"
    external_calls_inside: false
  - id: "tx-mediated-invocation-dispatch"
    owner: Invocation + Trust + Effect + ApprovalUse + lease owners
    atomic_records: ["capability_invocation_dispatched","effect_started","approval_use_consumption","aggregate_state_snapshots","domain_events","audit_record","idempotency_receipt"]
    required_atomic_gates: ["Trust authorization decision","exact Approval/action digest","active Attempt/session","current ExecutionLease fence and epoch","grant","activation","Effect transition to STARTED","closed Effect target revalidation","exact Core file-write grant target/scope match"]
    event_contract: "canonical Invocation status and effect.started.v1 events; see docs/EVENTS.md"
    external_effect: "Provider file replacement starts only after this transaction commits. This transaction revalidates an earlier Attempt/lease; it does not create or acquire the lease."
    external_calls_inside: false
  - id: "tx-evidence-append"
    owner: Evidence owner
    atomic_records: ["evidence","evidence_aggregate_state","evidence.created.v1","idempotency_receipt"]
    external_calls_inside: false
  - id: "tx-verification-create"
    owner: Verification owner
    atomic_records: ["verification_run","pinned_resource_inputs","dependency_edges","verification.started.v1","aggregate_state","idempotency_receipt"]
    external_calls_inside: false
  - id: "tx-verification-settle"
    owner: Verification owner + Evidence owner
    atomic_records: ["verification_run","verified_evidence_if_passed","aggregate_state","idempotency_receipt"]
    event_contract: "verification.completed.v2 and evidence.created.v1 when PASSED; see docs/EVENTS.md"
    external_calls_inside: false
external_boundaries:
  - id: "outside-sqlite"
    owner: domain owner
    input_trust: untrusted
    timeout: bounded
    retry: reconcile-before-retry
  - id: "b18-file-replacement"
    owner: Environments file-replacement primitive
    input_trust: "typed approved target and exact bounded ResourceRevision bytes after committed mediated dispatch"
    timeout: bounded
    retry: "never reissue an ambiguous replacement; reconcile target and Effect-keyed temp first"
  - id: "attempt-output-frame"
    owner: trusted Linux scope runner + Task Runtime
    input_trust: "untrusted candidate bytes from one fixed file on the Attempt-private capped tmpfs"
    timeout: "bounded by the Attempt and process-scope deadline"
    retry: "discard partial frame; no Resource is created until exact scope quiescence and full frame validation"
recovery:
  owner: domain owner
  source_of_truth: durable-owner-records
  restart_action: reload-last-commit-and-reconcile

# Current source boundary cross-checked 2026-11-18
# The graph above is the target sequence, not currently integrated execution wiring.
# In the active checkout, Task create/spec edit and read-only planning readiness are served.
# The readiness path returns dispatch_available=false; LocalPlanningPreflight::require_dispatch
# remains dead-code and fails closed. No production daemon caller of admit_step_attempt was found.
# Environment probes do not provision a Task Environment or produce an attestation; on Windows
# the provider reports no Task-capable LocalWorkspace class/lifetime, and a trusted Bubblewrap
# candidate on Linux is discovery evidence only. Attempt process-scope journaling is staged/dead
# code. Plan submission, Attempt admission, Effect dispatch, reconciliation and Environment
# provision/control routes are target-only. Do not mark execution edges INTEGRATED or QUALIFIED
# until the real provider and packaged write/recovery journey exist.
# Planner admission requires a Task-scoped read-only Environment attested to the exact TaskSpec
# and Resource set. Every execution/child/verifier Attempt receives a fresh ATTEMPT_PRIVATE
# Environment. Native agents never receive the attestation body or provider handle.

# Owner acceptance 2026-11-09 (docs/OWNER-ACCEPTANCE-REVIEW-PACKET.md): status ACCEPTED/LOCKED
# authorizes implementation of this target wiring. It does not make any edge SERVED, INTEGRATED
# or QUALIFIED. Every execution edge above remains TARGET until TASKS.md evidence exists. The env node is
# the Linux bubblewrap provider first; on the Windows row the env edges stay unavailable until
# B-35 (PROPOSED, pending owner) is accepted and qualified. Plan/Attempt/effect/reconcile/verify
# nodes and transactions are TARGET and not yet integrated in source.
#
# A-87/A-88/A-90 owner direction: exact write bytes are a managed ResourceRevision pinned
# by a typed Effect.target_json; Attempt admission precedes a separate mediated dispatch
# that atomically revalidates the live lease and commits Trust, Effect STARTED and
# ApprovalUse. FileWriteScopeRequest is untrusted; Trust alone issues the grant. The
# revision remains IN_REVIEW pending cross-owner review. Environment attestation remains
# in Runtime-private incarnation-scoped state and never enters a public request, event,
# aggregate snapshot, backup or Agent packet. VerificationRun start uses the canonical
# verification.started.v1 event; terminal settlement uses the applicable event.
# The database gate still prevents any production Task flow: this CODE-level store
# transaction is covered by direct admission tests, but there is no Task Runtime caller,
# proposal producer or file provider call. Keep the user-facing path unavailable until
# the T08 caller and its full denial/replay/recovery coverage are implemented. This
# target wiring alone does not make dispatch SERVED, INTEGRATED or QUALIFIED.
#
# The ACP Client fs/write_text_file callback is not the Task candidate capture path. The
# Runtime collects the accepted-Step output over a bounded provider-private channel after
# quiescence; Trust verifies Resource.provenance.created_by_attempt against the live
# Attempt before grant issue. Capture stores data only and confers no write authority.
# Source check 2026-11-19: lower-level scope-gate runner, fixed-path reader, Bubblewrap
# --cap-drop ALL argument, bounded LCOW frame writer/parser, and a separate held-runner
# readiness/one-shot post-receipt signal protocol have CODE coverage. The held runner does
# not itself attest policy or resolve the receipt. A daemon-private
# mapper validates a ready Attempt-private Environment against current Task/Attempt/Runtime
# identity and exact prepared Resource pins, then builds the supported Bubblewrap launch
# request. Its five focused tests pass on WSL. A Runtime-private capture session can start
# that mapped scope, preserve native agent stdin/stdout, drain the separate frame channel,
# retain the same scope after a quiescence timeout, and return bytes only after positive
# recursive quiescence plus launcher reap. Its three tests use a fake scope. The helper has
# no production Task Runtime caller and creates no attestation, admission or Resource; no
# TARGET wiring edge is upgraded to SERVED, INTEGRATED or QUALIFIED by this code.
# A separate RuntimeLocalPreparationJournal storage primitive now has CODE tests, but there
# is no provider/startup caller. Its pending-entry scan and concurrent phase transitions
# need further validation/serialization before integration. Same-scope probes and exact
# receipt lookup are still absent; the held protocol remains a lower-level launch-order
# primitive and no TARGET wiring edge is promoted by this evidence.
# A WSL-only Bubblewrap probe runs the production command builder directly, reads back its fixed 1 MiB cap, and observes
# ENOSPC across output and `/tmp` writes sharing one scratch tmpfs; this does not exercise EnvironmentConfig mapping, ManagedScope,
# systemd/cgroup supervision, or any attestation/admission edge.
