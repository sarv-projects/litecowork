[package]
name = "operator-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bytes = "1.10"
http-body = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["io-util", "net", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
hex = "0.4"
rustix = { version = "1.1", features = ["process"] }
sha2 = "0.10"

[lints]
workspace = true
