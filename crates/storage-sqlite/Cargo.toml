[package]
name = "storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["sqlite-bundled", "sqlite-rusqlite-defaults"]
sqlite-bundled = ["rusqlite/bundled"]
sqlite-rusqlite-defaults = ["rusqlite/cache", "rusqlite/ffi-sqlite-wasm-rs"]

[dependencies]
chacha20poly1305 = "0.10.1"
getrandom = "0.3"
hex = "0.4"
rusqlite = { version = "0.40.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
storage-core = { path = "../storage-core" }
tempfile = "3.20"
zeroize = "1.8"

[dev-dependencies]
domain-workspace = { path = "../domain-workspace" }
tempfile = "3.20"

[lints]
workspace = true
