    put:
      tags: [resources]
      operationId: uploadResourceChunk
      description: Content-Range uses inclusive HTTP byte offsets. For fixed chunk_size_bytes, chunkIndex n covers [n*chunk_size_bytes, min((n+1)*chunk_size_bytes, size)-1]. Overlap or a different replay for an accepted chunk index is rejected.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - name: uploadId
        in: path
        required: true
        schema: {type: string}
      - name: chunkIndex
        in: path
        required: true
        schema: {type: integer, minimum: 0}
      - name: Content-Range
        in: header
        required: true
        schema: {type: string, pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'}
      - name: X-Chunk-SHA256
        in: header
        required: true
        schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '204': {description: Idempotent content chunk accepted; conflicting replay returns UPLOAD_OFFSET_CONFLICT}
        default: {$ref: '#/components/responses/Error'}
