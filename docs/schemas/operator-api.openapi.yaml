openapi: 3.1.0
info: {title: LiteCowork Operator API, version: 1.0.0, description: 'User-facing commands and projections. Local IPC maps to these logical contracts; this document does not define Mesh, Agent, Environment, or LiteSPM APIs.'}
servers: [{url: 'https://localhost/v1'}]
security: [{operatorAuth: [], workspaceContext: []}]
tags:
- {name: workspaces}
- {name: conversations}
- {name: tasks}
- {name: approvals}
- {name: artifacts}
- {name: automations}
- {name: routines}
- {name: runtime-lifecycle}
- {name: environments}
- {name: needs-you}
- {name: runtimes}
- {name: agents}
- {name: delegation}
- {name: coworkers}
- {name: goals}
- {name: suggestions}
- {name: demonstrations}
- {name: connections}
- {name: channels}
- {name: discover}
- {name: resources}
- {name: recovery}
- {name: notifications}
paths:
  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      security: [{operatorAuth: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Workspaces owned by the authenticated principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspacePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [workspaces]
      operationId: createWorkspace
      security: [{operatorAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}:
    get:
      tags: [workspaces]
      operationId: getWorkspace
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200':
          description: Workspace owned by the authenticated principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [workspaces]
      operationId: updateWorkspacePolicy
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspacePolicyRequest'}
      responses:
        '200':
          description: Policy update applies to future replication transfers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/backups:
    get:
      tags: [workspaces]
      operationId: listWorkspaceBackups
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Integrity-verified immutable Workspace backup manifests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceBackupPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [workspaces]
      operationId: createWorkspaceBackup
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201':
          description: Complete backup verified and immutable manifest published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceBackupManifest'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/backups/{backupId}:
    get:
      tags: [workspaces]
      operationId: getWorkspaceBackup
      parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - name: backupId
        in: path
        required: true
        schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Integrity-verified immutable backup manifest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceBackupManifest'}
        default: {$ref: '#/components/responses/Error'}
  /recovery/backups/{backupId}/restore:
    post:
      tags: [recovery]
      operationId: restoreWorkspaceBackup
      security: [{operatorAuth: []}]
      parameters:
      - name: backupId
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestoreWorkspaceBackupRequest'}
      responses:
        '200':
          description: Backup restored into an empty installation and a new Runtime identity registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RestoreReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/default-agent-binding:
    patch:
      tags: [workspaces]
      operationId: setWorkspaceDefaultAgentBinding
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetWorkspaceDefaultAgentBindingRequest'}
      responses:
        '200':
          description: Default used for newly admitted work
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/archive:
    post:
      tags: [workspaces]
      operationId: archiveWorkspace
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200':
          description: Quiescent Workspace archived and made read-only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
  /conversations:
    post:
      tags: [conversations]
      operationId: createConversation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversationRequest'}
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}:
    get:
      tags: [conversations]
      operationId: getConversation
      parameters: [{$ref: '#/components/parameters/ConversationId'}]
      responses:
        '200':
          description: Conversation projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/messages:
    get:
      tags: [conversations]
      operationId: listConversationMessages
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Ordered message page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [conversations]
      operationId: appendConversationMessage
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppendMessageRequest'}
      responses:
        '201':
          description: Message appended
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationMessage'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/tasks:
    get:
      tags: [conversations]
      operationId: listConversationTasks
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Tasks associated with the Conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/turns:
    post:
      tags: [conversations]
      operationId: submitConversationTurn
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitConversationTurnRequest'}
      responses:
        '202':
          description: Durable user turn accepted; agent reply is streamed separately
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationTurnReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/turns/{turnId}/retry:
    post:
      tags: [conversations]
      operationId: retryConversationTurn
      parameters:
      - {$ref: '#/components/parameters/ConversationId'}
      - name: turnId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '202':
          description: Failed turn retried in a new Conversation AgentSession
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationTurnReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/turns/{turnId}/cancel:
    post:
      tags: [conversations]
      operationId: cancelConversationTurn
      parameters:
      - {$ref: '#/components/parameters/ConversationId'}
      - name: turnId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '202':
          description: Turn cancellation requested; response confirms after stop or a racing terminal outcome
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationTurnReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      parameters:
      - name: status
        in: query
        schema: {type: string}
      - name: conversation_id
        in: query
        schema: {type: string}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Task summary page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [tasks]
      operationId: createTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaskRequest'}
      responses:
        '201':
          description: Task and initial TaskSpecRevision committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}:
    get:
      tags: [tasks]
      operationId: getTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Current Task projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/progress:
    get:
      tags: [tasks]
      operationId: getTaskProgress
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Rebuildable factual progress projection; no synthetic percentage or ETA
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskProgressProjection'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/steps/{stepId}/execution-dependencies:
    get:
      tags: [tasks]
      operationId: getStepExecutionDependencies
      parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - name: stepId
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Short-lived placement and prerequisite preview; starts no workers or providers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionDependencyPlan'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/steer:
    post:
      tags: [tasks]
      operationId: steerTask
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SteerTaskRequest'}
      responses:
        '202':
          description: Steering accepted for Task Runtime processing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/lead-agent:
    post:
      tags: [tasks]
      operationId: changeTaskLeadAgent
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeLeadAgentRequest'}
      responses:
        '202':
          description: Lead replacement accepted; active Attempts drain under lease and Effect rules
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '202':
          description: Cancellation requested; Task may remain stopping while Attempts, provider Invocations, VerificationRuns, pending Task-scoped UserRequests/Approvals, and Effects settle. Cancellation is valid from PAUSED and supersedes PAUSE_REQUESTED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/pause:
    post:
      tags: [tasks]
      operationId: pauseTask
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PauseTaskRequest'}
      responses:
        '202':
          description: Pause coordination accepted; Task remains PAUSE_REQUESTED until checkpoint, provider Invocation and VerificationRun settlement, Effect reconciliation, and lease settlement finish
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/resume:
    post:
      tags: [tasks]
      operationId: resumeTask
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '202':
          description: Resume accepted after input, policy, and Effect revalidation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/steps/{stepId}/recover:
    post:
      tags: [tasks]
      operationId: recoverTaskStep
      parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - name: stepId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoverStepRequest'}
      responses:
        '202':
          description: Step recovery accepted after budget and Effect checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/spec-revisions:
    get:
      tags: [tasks]
      operationId: listTaskSpecRevisions
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Immutable TaskSpecRevision history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaskSpecRevision'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [tasks]
      operationId: reviseTaskSpec
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviseTaskSpecRequest'}
      responses:
        '201':
          description: New immutable TaskSpecRevision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSpecRevision'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/plan-revisions:
    get:
      tags: [tasks]
      operationId: listPlanRevisions
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Immutable PlanRevision history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanRevision'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/steps:
    get:
      tags: [tasks]
      operationId: listTaskSteps
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Task Steps
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Step'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/attempts:
    get:
      tags: [tasks]
      operationId: listTaskAttempts
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Task Attempts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Attempt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/timeline:
    get:
      tags: [tasks]
      operationId: getTaskTimeline
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Projected Task timeline
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimelinePage'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/artifacts:
    get:
      tags: [artifacts]
      operationId: listTaskArtifacts
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Artifact summaries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/effects:
    get:
      tags: [tasks]
      operationId: listTaskEffects
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Effect summaries with evidence level
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Effect'}
        default: {$ref: '#/components/responses/Error'}
  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      parameters:
      - name: status
        in: query
        schema: {type: string, enum: [PENDING, APPROVED, DENIED, EXPIRED, CANCELLED]}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Approval page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalPage'}
        default: {$ref: '#/components/responses/Error'}
  /approvals/{approvalId}:
    get:
      tags: [approvals]
      operationId: getApproval
      parameters:
      - name: approvalId
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Approval bound to an exact target and action digest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        default: {$ref: '#/components/responses/Error'}
  /approvals/{approvalId}/resolve:
    post:
      tags: [approvals]
      operationId: resolveApproval
      parameters:
      - name: approvalId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveApprovalRequest'}
      responses:
        '200':
          description: Approval decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        default: {$ref: '#/components/responses/Error'}
  /artifacts:
    get:
      tags: [artifacts]
      operationId: listArtifacts
      parameters:
      - name: library_status
        in: query
        required: false
        schema: {type: string, enum: [TRANSIENT, SAVED, ARCHIVED]}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Authorized Artifacts filtered by Library status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactPage'}
        default: {$ref: '#/components/responses/Error'}
  /artifacts/{artifactId}:
    get:
      tags: [artifacts]
      operationId: getArtifact
      parameters:
      - name: artifactId
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /artifacts/{artifactId}/versions/{version}:
    get:
      tags: [artifacts]
      operationId: getArtifactVersion
      parameters:
      - name: artifactId
        in: path
        required: true
        schema: {type: string}
      - name: version
        in: path
        required: true
        schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Immutable artifact version metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactVersion'}
        default: {$ref: '#/components/responses/Error'}
  /artifacts/{artifactId}/versions/{version}/content:
    get:
      tags: [artifacts]
      operationId: downloadArtifactVersion
      parameters:
      - name: artifactId
        in: path
        required: true
        schema: {type: string}
      - name: version
        in: path
        required: true
        schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Immutable artifact bytes; Content-Type is the stored media type
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
  /artifacts/{artifactId}/promote:
    post:
      tags: [artifacts]
      operationId: promoteArtifact
      parameters:
      - name: artifactId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200':
          description: Artifact promoted into the user Library
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /artifacts/{artifactId}/archive:
    post:
      tags: [artifacts]
      operationId: archiveArtifact
      parameters:
      - name: artifactId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200':
          description: Saved Artifact archived and removed from the default Library projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
        default: {$ref: '#/components/responses/Error'}
  /library:
    get:
      tags: [artifacts]
      operationId: listLibrary
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Library page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactPage'}
        default: {$ref: '#/components/responses/Error'}
  /routines:
    get:
      tags: [routines]
      operationId: listRoutines
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
