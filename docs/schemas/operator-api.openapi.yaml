        current_revision: {type: integer, minimum: 1}
        last_run_at: {type: [string, 'null'], format: date-time}
        last_success_at: {type: [string, 'null'], format: date-time}
        recent_success_rate: {type: [number, 'null'], minimum: 0, maximum: 1}
        sample_size: {type: integer, minimum: 0}
        average_duration_ms: {type: [integer, 'null'], minimum: 0}
        observed_costs: {type: array, items: {$ref: '#/components/schemas/UsageQuantity'}}
        required_dependency_health: {type: array, items: {$ref: '#/components/schemas/DependencyHealth'}}
        drift_state: {type: string, enum: [HEALTHY, WARNING, DRIFTED, UNKNOWN]}
        drift_evidence_refs: {type: array, items: {type: string}}
    RoutineRevision:
      type: object
      required: [routine_id, revision, objective_template, instructions, input_schema, constraints, non_goals, required_outputs, acceptance_criteria, approvals_required, input_bindings, required_capabilities, placement_preference, verification_policy, authored_by, created_at]
      properties:
        routine_id: {type: string}
        revision: {type: integer, minimum: 1}
        objective_template: {type: string, minLength: 1}
        instructions: {type: string, minLength: 1}
        input_schema: {type: object, additionalProperties: true}
        constraints: {type: array, items: {type: string}}
        non_goals: {type: array, items: {type: string}}
        required_outputs: {type: array, items: {$ref: '#/components/schemas/OutputRequirement'}}
        acceptance_criteria: {type: array, items: {$ref: '#/components/schemas/AcceptanceCriterion'}}
        approvals_required: {type: array, items: {$ref: '#/components/schemas/ApprovalRequirement'}}
        input_bindings: {type: array, items: {$ref: '#/components/schemas/TaskInputBinding'}}
        required_capabilities: {type: array, items: {$ref: '#/components/schemas/CapabilityRequirement'}}
        preferred_agent_binding_id: {type: [string, 'null']}
        placement_preference: {$ref: '#/components/schemas/PlacementPreference'}
        budget_ceiling: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        verification_policy: {type: object, additionalProperties: true}
        authored_by: {$ref: '#/components/schemas/PrincipalRef'}
        created_at: {type: string, format: date-time}
    RoutineRevisionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RoutineRevision'}}
        next_cursor: {type: [string, 'null']}
    CreateRoutineRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, name, revision]
      properties:
        workspace_id: {type: string}
        name: {type: string, minLength: 1}
        revision: {$ref: '#/components/schemas/RoutineRevisionInput'}
    CreateRoutineRevisionRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {$ref: '#/components/schemas/RoutineRevisionInput'}
    RoutineRevisionInput:
      type: object
      additionalProperties: false
      required: [objective_template, instructions, input_schema, constraints, non_goals, required_outputs, acceptance_criteria, approvals_required, input_bindings, required_capabilities, placement_preference, verification_policy]
      properties:
        objective_template: {type: string, minLength: 1}
        instructions: {type: string, minLength: 1}
        input_schema: {type: object, additionalProperties: true}
        constraints: {type: array, items: {type: string}}
        non_goals: {type: array, items: {type: string}}
        required_outputs: {type: array, items: {$ref: '#/components/schemas/OutputRequirement'}}
        acceptance_criteria: {type: array, items: {$ref: '#/components/schemas/AcceptanceCriterion'}}
        approvals_required: {type: array, items: {$ref: '#/components/schemas/ApprovalRequirement'}}
        input_bindings: {type: array, items: {$ref: '#/components/schemas/TaskInputBinding'}}
        required_capabilities: {type: array, items: {$ref: '#/components/schemas/CapabilityRequirement'}}
        preferred_agent_binding_id: {type: [string, 'null']}
        placement_preference: {$ref: '#/components/schemas/PlacementPreference'}
        budget_ceiling: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        verification_policy: {type: object, additionalProperties: true}
    RunRoutineRequest:
      type: object
      additionalProperties: false
      required: [routine_revision, inputs]
      properties:
        routine_revision: {type: integer, minimum: 1}
        inputs: {type: object, maxProperties: 64, additionalProperties: true}
        conversation_id: {type: [string, 'null']}
    TriggerSpec:
      type: object
      additionalProperties: false
      required: [trigger_id, placement, trigger]
      properties:
        trigger_id: {type: string, minLength: 1}
        placement: {type: string, enum: [HUB, SPECIFIC_RUNTIME, AUTO]}
        runtime_id: {type: [string, 'null']}
        trigger: {$ref: '#/components/schemas/TriggerDefinition'}
      allOf:
      - if:
          properties:
            placement: {const: SPECIFIC_RUNTIME}
          required: [placement]
        then:
          required: [runtime_id]
          properties:
            runtime_id: {type: string, minLength: 1}
        else:
          properties:
            runtime_id: {type: 'null'}
    TriggerDefinition:
      oneOf:
      - {$ref: '#/components/schemas/ScheduleTrigger'}
      - {$ref: '#/components/schemas/OneShotTrigger'}
      - {$ref: '#/components/schemas/WebhookTrigger'}
      - {$ref: '#/components/schemas/ConnectorEventTrigger'}
      - {$ref: '#/components/schemas/ChannelEventTrigger'}
      - {$ref: '#/components/schemas/ResourceEventTrigger'}
      - {$ref: '#/components/schemas/TaskEventTrigger'}
      - {$ref: '#/components/schemas/RuntimeEventTrigger'}
      - {$ref: '#/components/schemas/ProcessExitTrigger'}
      - {$ref: '#/components/schemas/CommandExitTrigger'}
      - {$ref: '#/components/schemas/ConditionWatchTrigger'}
      - {$ref: '#/components/schemas/ManualTrigger'}
      discriminator: {propertyName: kind}
    MisfirePolicy:
      oneOf:
      - {type: object, additionalProperties: false, required: [kind], properties: {kind: {const: SKIP}}}
      - {type: object, additionalProperties: false, required: [kind], properties: {kind: {const: RUN_ONCE_WHEN_AVAILABLE}}}
      - {type: object, additionalProperties: false, required: [kind, max_occurrences], properties: {kind: {const: CATCH_UP_BOUNDED}, max_occurrences: {type: integer, minimum: 1}}}
      discriminator: {propertyName: kind}
    ScheduleTrigger:
      type: object
      additionalProperties: false
      required: [kind, timezone, recurrence_format, recurrence_semantics_version, rrule_or_cron, misfire_policy, ambiguous_local_time, nonexistent_local_time]
      properties:
        kind: {const: SCHEDULE}
        timezone: {type: string, description: IANA time-zone identifier}
        recurrence_format: {type: string, enum: [CRON_5, RFC5545_RRULE]}
        recurrence_semantics_version: {type: integer, minimum: 1}
        rrule_or_cron: {type: string, minLength: 1}
        start_at: {type: [string, 'null'], format: date-time}
        end_at: {type: [string, 'null'], format: date-time}
        misfire_policy: {$ref: '#/components/schemas/MisfirePolicy'}
        ambiguous_local_time: {type: string, enum: [EARLIER, LATER]}
        nonexistent_local_time: {type: string, enum: [SKIP, NEXT_VALID]}
    OneShotTrigger:
      type: object
      additionalProperties: false
      required: [kind, scheduled_at, misfire_policy]
      properties:
        kind: {const: ONE_SHOT}
        scheduled_at: {type: string, format: date-time}
        misfire_policy: {$ref: '#/components/schemas/MisfirePolicy'}
    WebhookTrigger:
      type: object
      additionalProperties: false
      required: [kind, source_identity, auth_profile_ref, authentication_mode, replay_window_ms, max_payload_bytes]
      properties:
        kind: {const: WEBHOOK}
        source_identity: {type: string, minLength: 1}
        auth_profile_ref: {type: string}
        authentication_mode: {type: string, enum: [SIGNATURE, BEARER_SECRET, MUTUAL_TLS]}
        replay_window_ms: {type: integer, minimum: 1}
        max_payload_bytes: {type: integer, minimum: 1}
        delivery_id_field: {type: [string, 'null']}
    ConnectorEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, connection_id, provider_event_type]
      properties:
        kind: {const: CONNECTOR_EVENT}
        connection_id: {type: string}
        provider_event_type: {type: string, minLength: 1}
        filter_expression: {type: [object, 'null'], additionalProperties: true}
    ChannelEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, channel_binding_id, provider_event_type]
      properties:
        kind: {const: CHANNEL_EVENT}
        channel_binding_id: {type: string}
        provider_event_type: {type: string}
        filter_expression: {type: [object, 'null'], additionalProperties: true}
    ResourceEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, event_kinds, debounce_ms]
      properties:
        kind: {const: RESOURCE_EVENT}
        workspace_root_id: {type: [string, 'null']}
        resource_id: {type: [string, 'null']}
        event_kinds: {type: array, minItems: 1, items: {type: string}}
        debounce_ms: {type: integer, minimum: 0}
      oneOf:
      - required: [workspace_root_id]
        properties:
          workspace_root_id: {type: string, minLength: 1}
          resource_id: {type: 'null'}
      - required: [resource_id]
        properties:
          resource_id: {type: string, minLength: 1}
          workspace_root_id: {type: 'null'}
    TaskEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, event_kinds]
      properties:
        kind: {const: TASK_EVENT}
        event_kinds: {type: array, minItems: 1, items: {type: string}}
        task_filter: {type: [object, 'null'], additionalProperties: true}
        ignore_origin_automation_id: {type: [string, 'null']}
    RuntimeEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, event_kinds, debounce_ms]
      properties:
        kind: {const: RUNTIME_EVENT}
        runtime_id: {type: [string, 'null']}
        event_kinds: {type: array, minItems: 1, items: {type: string}}
        debounce_ms: {type: integer, minimum: 0}
    ProcessExitTrigger:
      type: object
      additionalProperties: false
      required: [kind, runtime_id, managed_process_ref]
      properties:
        kind: {const: PROCESS_EXIT}
        runtime_id: {type: string}
        managed_process_ref: {type: string}
        exit_filter: {type: [object, 'null'], additionalProperties: true}
    CommandExitTrigger:
      type: object
      additionalProperties: false
      required: [kind, runtime_id, managed_execution_ref]
      properties:
        kind: {const: COMMAND_EXIT}
        runtime_id: {type: string}
        managed_execution_ref: {type: string}
        exit_filter: {type: [object, 'null'], additionalProperties: true}
    ConditionWatchTrigger:
      type: object
      additionalProperties: false
      required: [kind, provider_ref, source_ref, poll_interval_ms, condition_digest]
      properties:
        kind: {const: CONDITION_WATCH}
        provider_ref: {type: string}
        source_ref: {oneOf: [{$ref: '#/components/schemas/ResourceRef'}, {$ref: '#/components/schemas/CapabilityRef'}]}
        poll_interval_ms: {type: integer, minimum: 1000}
        condition_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        end_condition: {type: [object, 'null'], additionalProperties: true}
    ManualTrigger:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {const: MANUAL}
    AutomationExecutionPolicy:
      type: object
      additionalProperties: false
      required: [placement_preference, max_concurrent_occurrences, overlap_policy, retry_policy, notification_policy, wake_policy]
      properties:
        placement_preference: {$ref: '#/components/schemas/PlacementPreference'}
        max_concurrent_occurrences: {type: integer, minimum: 1, default: 1}
        overlap_policy: {type: string, enum: [SKIP, QUEUE, CANCEL_OLD, ALLOW]}
        retry_policy: {$ref: '#/components/schemas/RetryPolicy'}
        budget_ceiling: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        notification_policy: {type: string, enum: [ALWAYS, ON_SUCCESS, ON_FAILURE, ON_CONDITION, SILENT]}
        wake_policy: {type: string, enum: [NEVER, TRY_WAKE, REQUIRE_RUNTIME_AWAKE]}
    ManualAutomationRunRequest:
      type: object
      additionalProperties: false
      required: [automation_revision, inputs]
      properties:
        automation_revision: {type: integer, minimum: 1}
        inputs: {type: object, additionalProperties: true, description: Bounded values validated against the exact pinned Routine input schema and bindings.}
    ManualAutomationRunResponse:
      type: object
      additionalProperties: false
      required: [automation_id, automation_revision, trigger_id, occurrence_id, occurrence_version, occurrence_status, task]
      properties:
        automation_id: {type: string}
        automation_revision: {type: integer, minimum: 1}
        trigger_id: {type: string}
        occurrence_id: {type: string}
        occurrence_version: {type: integer, const: 3}
        occurrence_status: {type: string, const: STARTED}
        task: {$ref: '#/components/schemas/TaskView'}
    CreateAutomationRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, name, routine_id, routine_revision, triggers, execution_policy, coworker_ref]
      properties:
        workspace_id: {type: string}
        name: {type: string, minLength: 1}
        routine_id: {type: string}
        routine_revision: {type: integer, minimum: 1}
        triggers: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TriggerSpec'}}
        execution_policy: {$ref: '#/components/schemas/AutomationExecutionPolicy'}
        coworker_ref: {oneOf: [{$ref: '#/components/schemas/CoworkerRevisionRef'}, {type: 'null'}]}
    UpdateAutomationRequest:
      type: object
      additionalProperties: false
      required: [name, routine_id, routine_revision, triggers, execution_policy, coworker_ref]
      properties:
        name: {type: string, minLength: 1}
        routine_id: {type: string}
        routine_revision: {type: integer, minimum: 1}
        triggers: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TriggerSpec'}}
        execution_policy: {$ref: '#/components/schemas/AutomationExecutionPolicy'}
        coworker_ref: {oneOf: [{$ref: '#/components/schemas/CoworkerRevisionRef'}, {type: 'null'}]}
    Automation:
      type: object
      required: [automation_id, workspace_id, name, current_revision, status, version, created_at, updated_at]
      properties:
        automation_id: {type: string}
        workspace_id: {type: string}
        name: {type: string}
        current_revision: {type: integer, minimum: 1}
        status: {type: string, enum: [ENABLED, PAUSED, DISABLED]}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AutomationRevision:
      type: object
      required: [automation_id, revision, routine_id, routine_revision, triggers, execution_policy, coworker_ref, authored_by, created_at]
      properties:
        automation_id: {type: string}
        revision: {type: integer, minimum: 1}
        routine_id: {type: string}
        routine_revision: {type: integer, minimum: 1}
        triggers: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TriggerSpec'}}
        execution_policy: {$ref: '#/components/schemas/AutomationExecutionPolicy'}
        coworker_ref: {oneOf: [{$ref: '#/components/schemas/CoworkerRevisionRef'}, {type: 'null'}]}
        authored_by: {$ref: '#/components/schemas/PrincipalRef'}
        created_at: {type: string, format: date-time}
    AutomationOccurrence:
      type: object
      required: [occurrence_id, automation_id, automation_revision, routine_id, routine_revision, trigger_id, occurrence_key, trigger_host_runtime_id, version, claim_epoch, status, blockers, created_at, updated_at]
      properties:
        occurrence_id: {type: string}
        automation_id: {type: string}
        automation_revision: {type: integer, minimum: 1}
        routine_id: {type: string}
        routine_revision: {type: integer, minimum: 1}
        trigger_id: {type: string}
        trigger_host_runtime_id: {type: string}
        occurrence_key: {type: string, pattern: '^[a-f0-9]{64}$'}
        version: {type: integer, minimum: 1, description: Monotonic occurrence aggregate revision; event and snapshot entity_revision.}
        claim_epoch: {type: integer, minimum: 0}
        claim_expires_at: {type: [string, 'null'], format: date-time}
        scheduled_for: {type: [string, 'null'], format: date-time}
        covered_misfire_range:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [from, to, count]
            properties:
              from: {type: string, format: date-time}
              to: {type: string, format: date-time}
              count: {type: integer, minimum: 1}
        trigger_input_ref: {oneOf: [{$ref: '#/components/schemas/ResourceRef'}, {type: 'null'}]}
        trigger_payload_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        task_id: {type: [string, 'null']}
        blockers: {type: array, items: {$ref: '#/components/schemas/Blocker'}}
        status: {type: string, enum: [PENDING, CLAIMED, WAITING_DEPENDENCY, STARTED, COMPLETED, SKIPPED, FAILED]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BlobRef:
      type: object
      required: [digest, size_bytes, media_type]
      properties:
        digest: {type: string, minLength: 1, pattern: '^sha256:[a-f0-9]{64}$'}
        size_bytes: {type: integer, minimum: 0}
        media_type: {type: string}
    ContextOwnerRef:
      oneOf:
      - type: object
        additionalProperties: false
        required: [kind, principal_id]
        properties:
          kind: {const: USER}
          principal_id: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [kind, workspace_id]
        properties:
          kind: {const: WORKSPACE}
          workspace_id: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [kind, workspace_id, coworker_id]
        properties:
          kind: {const: COWORKER}
          workspace_id: {type: string, minLength: 1}
          coworker_id: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [kind, workspace_id, goal_id]
        properties:
          kind: {const: GOAL}
          workspace_id: {type: string, minLength: 1}
          goal_id: {type: string, minLength: 1}
    ContextDocumentMetadata:
      type: object
      additionalProperties: false
      required: [kind, owner_ref, status]
      properties:
        kind: {type: string, enum: [PERSONAL_PROFILE, COWORKER_NOTES, WORKSPACE_NOTES, GOAL_NOTES]}
        owner_ref: {$ref: '#/components/schemas/ContextOwnerRef'}
        status: {type: string, enum: [ACTIVE, REVOKED, DELETION_PENDING, DELETED], description: Only Core may set DELETED after all owned content/index replicas acknowledge purge.}
        purge_manifest_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        purge_target_count: {type: integer, minimum: 0}
      allOf:
      - if:
          properties: {status: {enum: [DELETION_PENDING, DELETED]}}
          required: [status]
        then:
          required: [purge_manifest_digest, purge_target_count]
      - if:
          properties: {status: {enum: [ACTIVE, REVOKED]}}
          required: [status]
        then:
          not:
            anyOf:
            - required: [purge_manifest_digest]
            - required: [purge_target_count]
    ContextDocumentCreateMetadata:
      type: object
      additionalProperties: false
      required: [kind, owner_ref]
      properties:
        kind: {type: string, enum: [PERSONAL_PROFILE, COWORKER_NOTES, WORKSPACE_NOTES, GOAL_NOTES]}
        owner_ref: {$ref: '#/components/schemas/ContextOwnerRef'}
    CoworkerRevisionRef:
      type: object
      additionalProperties: false
      required: [coworker_id, revision]
      properties:
        coworker_id: {type: string, minLength: 1}
        revision: {type: integer, minimum: 1}
    ResourceRef:
      type: object
      additionalProperties: false
      required: [workspace_id, resource_id]
      properties:
        workspace_id: {type: string, minLength: 1}
        resource_id: {type: string, minLength: 1}
        revision_id: {type: [string, 'null']}
    PinnedResourceRef:
      allOf:
      - {$ref: '#/components/schemas/ResourceRef'}
      - type: object
        required: [revision_id]
        properties:
          revision_id: {type: string, minLength: 1}
    ResourceInput:
      type: object
      additionalProperties: false
      required: [resource_ref]
      properties:
        resource_ref: {$ref: '#/components/schemas/PinnedResourceRef'}
        observed_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    CommittedResource:
      type: object
      additionalProperties: false
      required: [resource, revision, resource_ref]
      properties:
        resource: {$ref: '#/components/schemas/Resource'}
        revision: {$ref: '#/components/schemas/ResourceRevision'}
        resource_ref: {$ref: '#/components/schemas/ResourceRef'}
    Resource:
      type: object
      required: [resource_id, workspace_id, kind, provider_identity, display_name, sensitivity, context_document, provenance, created_at, updated_at, version]
      allOf:
      - if:
          properties:
            provider_identity:
              properties:
                identity_confidence: {const: WEAK}
          required: [provider_identity]
        then:
          properties:
            identity_digest: {type: 'null'}
      - if:
          properties:
            provider_identity:
              properties:
                identity_confidence: {enum: [STRONG, PROVIDER_SCOPED]}
          required: [provider_identity]
        then:
          required: [identity_digest]
          properties:
            identity_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      properties:
        resource_id: {type: string}
        workspace_id: {type: string}
        kind: {type: string, enum: [FILE, FOLDER, ARTIFACT, CONNECTOR_OBJECT, WEB_RESOURCE, OTHER]}
        provider_identity: {$ref: '#/components/schemas/ProviderIdentity'}
        identity_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        display_name: {type: string}
        current_revision_id: {type: [string, 'null']}
        sensitivity: {type: string, enum: [PUBLIC, PERSONAL, CONFIDENTIAL, RESTRICTED]}
        context_document: {oneOf: [{$ref: '#/components/schemas/ContextDocumentMetadata'}, {type: 'null'}]}
        provenance: {$ref: '#/components/schemas/ProvenanceRecord'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    ResourceFreshness: {type: string, enum: [CURRENT, STALE, CONFLICTED, UNKNOWN, UNAVAILABLE]}
    ResourceLocationFreshness: {type: string, enum: [CURRENT, STALE, UNKNOWN, UNAVAILABLE]}
    DependencyFreshness: {type: string, enum: [CURRENT, STALE, CONFLICTED, UNKNOWN]}
    ResourceRevision:
      type: object
      required: [resource_revision_id, resource_id, parent_revision_ids, observed_at, created_by]
      properties:
        resource_revision_id: {type: string}
        resource_id: {type: string}
        parent_revision_ids:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        provider_revision: {type: [string, 'null']}
        content_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        size_bytes: {type: [integer, 'null'], minimum: 0}
        media_type: {type: [string, 'null']}
        observed_at: {type: string, format: date-time}
        created_by:
          oneOf: [{$ref: '#/components/schemas/PrincipalRef'}, {$ref: '#/components/schemas/ServiceRef'}]
    ProviderIdentity:
      type: object
      additionalProperties: false
      required: [provider_instance_id, stable_object_id, identity_confidence]
      properties:
        provider_instance_id: {type: string, minLength: 1}
        stable_object_id: {type: string, minLength: 1}
        identity_confidence: {type: string, enum: [STRONG, PROVIDER_SCOPED, WEAK]}
        file_identity:
          oneOf: [{$ref: '#/components/schemas/FileIdentity'}, {type: 'null'}]
    FileIdentity:
      type: object
      additionalProperties: false
      required: [filesystem_instance_id, file_id, platform_kind]
      properties:
        filesystem_instance_id: {type: string, minLength: 1}
        volume_id: {type: [string, 'null']}
        file_id: {type: string, minLength: 1}
        generation: {type: [string, 'null']}
        platform_kind: {type: string, minLength: 1}
    ResourceLocationView:
      type: object
      required: [location_id, resource_id, availability, writable, observed_at, freshness]
      properties:
        location_id: {type: string}
        resource_id: {type: string}
        runtime_id: {type: [string, 'null']}
        environment_id: {type: [string, 'null']}
        connection_id: {type: [string, 'null']}
        availability: {type: string, enum: [AVAILABLE, OFFLINE, PLACEHOLDER, REVOKED, UNKNOWN, UNAVAILABLE]}
        writable: {type: boolean}
        observed_revision_id: {type: [string, 'null']}
        observed_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        observed_at: {type: string, format: date-time}
        last_checked_at: {type: [string, 'null'], format: date-time}
        freshness: {$ref: '#/components/schemas/ResourceLocationFreshness'}
    WorkspaceRoot:
      type: object
      required: [workspace_root_id, workspace_id, resource_id, location_id, display_name, watch_policy, replication_policy, status, added_by, created_at, updated_at, version]
      properties:
        workspace_root_id: {type: string}
        workspace_id: {type: string}
        resource_id: {type: string}
        location_id: {type: string}
        display_name: {type: string}
        watch_policy: {type: string, enum: [METADATA, CONTENT_DIGESTS, SELECTED_TEXT_EXTRACTION]}
        replication_policy: {type: string, enum: [NONE, ACTIVE_TASKS, SELECTED_WORKSPACE_POLICY]}
        status: {type: string, enum: [ACTIVE, PAUSED, REVOKED, UNAVAILABLE]}
        added_by: {$ref: '#/components/schemas/PrincipalRef'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    AddWorkspaceRootRequest:
      type: object
      additionalProperties: false
      required: [resource_ref, location_id, watch_policy, replication_policy]
      properties:
        resource_ref: {$ref: '#/components/schemas/ResourceRef'}
        location_id: {type: string}
        watch_policy: {type: string, enum: [METADATA, CONTENT_DIGESTS, SELECTED_TEXT_EXTRACTION]}
        replication_policy: {type: string, enum: [NONE, ACTIVE_TASKS, SELECTED_WORKSPACE_POLICY]}
    UpdateWorkspaceRootRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        watch_policy: {type: string, enum: [METADATA, CONTENT_DIGESTS, SELECTED_TEXT_EXTRACTION]}
        replication_policy: {type: string, enum: [NONE, ACTIVE_TASKS, SELECTED_WORKSPACE_POLICY]}
    WorkspaceRootPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/WorkspaceRootListItem'}
        next_cursor: {type: [string, 'null']}
    WorkspaceRootListItem:
      allOf:
      - {$ref: '#/components/schemas/WorkspaceRoot'}
      - type: object
        required: [location_availability]
        properties:
          location_availability:
            type: string
            description: Last committed ResourceLocation observation; not a live Runtime probe.
            enum: [AVAILABLE, OFFLINE, PLACEHOLDER, REVOKED, UNKNOWN, UNAVAILABLE]
    ResourceSearchResult:
      type: object
      required: [resource_ref, source_content_digest, source_matches, display_name, locations, freshness, match_reasons]
      properties:
        resource_ref: {$ref: '#/components/schemas/PinnedResourceRef'}
        source_content_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$', description: Digest of the exact immutable ResourceRevision named by resource_ref.revision_id; source_matches offsets are valid only against these bytes.}
        source_matches:
          type: array
          maxItems: 32
          description: Empty unless an INDEXED_CONTENT result has source-grounded lexical matches. In INDEXED_CONTENT, contains one first-occurrence span per distinct normalized query term, all into the exact pinned ResourceRevision bytes named by resource_ref and source_content_digest.
          items: {$ref: '#/components/schemas/ResourceTextMatchSpan'}
        display_name: {type: string}
        locations:
          type: array
          items: {$ref: '#/components/schemas/ResourceLocationView'}
        freshness: {$ref: '#/components/schemas/ResourceFreshness'}
        match_reasons:
          type: array
          items: {type: string, enum: [NAME, MEDIA_TYPE, CONTENT_ON_DEMAND, CONTENT_INDEXED]}
        snippet: {type: [string, 'null'], maxLength: 320, description: Bounded plain-text excerpt from a memory scan or digest-verified encrypted local index. It is never rendered as HTML.}
    ResourceTextMatchSpan:
      type: object
      additionalProperties: false
      required: [term, start_utf8_byte, end_utf8_byte_exclusive]
      description: A lexical token match in the original UTF-8 bytes of the containing ResourceSearchResult's pinned ResourceRevision. Offsets are zero-based and half-open; consumers must verify the containing source_content_digest and never apply offsets to a newer Resource head.
      properties:
        term: {type: string, minLength: 1, maxLength: 128, description: Normalized Unicode alphanumeric query term.}
        start_utf8_byte: {type: integer, minimum: 0, maximum: 1048576}
        end_utf8_byte_exclusive: {type: integer, minimum: 1, maximum: 1048576}
    ResourceSearchPage:
      type: object
      required: [items, mode, content_scan]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ResourceSearchResult'}
        next_cursor: {type: [string, 'null']}
        mode: {type: string, enum: [METADATA, ON_DEMAND_CONTENT, INDEXED_CONTENT]}
        content_scan: {$ref: '#/components/schemas/ResourceContentScan'}
    RebuildResourceTextIndexRequest:
      type: object
      additionalProperties: false
      required: [resource_revision_id, content_digest]
      properties:
        resource_revision_id: {type: string, minLength: 1, maxLength: 160}
        content_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    ResourceTextIndexRebuildResult:
      type: object
      additionalProperties: false
      required: [requestId, correlationId, workspaceId, resourceId, resourceRevisionId, contentDigest, outcome, reason]
      properties:
        requestId: {type: string, minLength: 1, maxLength: 128}
        correlationId: {type: string, minLength: 1, maxLength: 128}
        workspaceId: {type: string, minLength: 1}
        resourceId: {type: string, minLength: 1, maxLength: 160}
        resourceRevisionId: {type: string, minLength: 1, maxLength: 160}
        contentDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        outcome: {type: string, enum: [INDEXED, NOT_INDEXABLE]}
        reason:
          type: [string, 'null']
          enum: [UNSUPPORTED_TYPE, OVER_SIZE_LIMIT, INVALID_UTF8, CONTROL_CHARACTERS, TERM_LIMIT_EXCEEDED, null]
          description: Required for NOT_INDEXABLE and null for INDEXED.
    ResourceContentScan:
      type: [object, 'null']
      required: [candidates_scanned, text_resources_checked, skipped_unsupported_type, skipped_over_file_limit, skipped_revision_changed, byte_budget_exhausted, candidate_budget_exhausted, max_candidates, max_file_bytes, max_total_bytes]
      properties:
        candidates_scanned: {type: integer, minimum: 0}
        text_resources_checked: {type: integer, minimum: 0}
        skipped_unsupported_type: {type: integer, minimum: 0}
        skipped_over_file_limit: {type: integer, minimum: 0}
        skipped_revision_changed: {type: integer, minimum: 0}
        byte_budget_exhausted: {type: boolean}
        candidate_budget_exhausted: {type: boolean}
        max_candidates: {type: integer, const: 20}
        max_file_bytes: {type: integer, const: 1048576}
        max_total_bytes: {type: integer, const: 8388608}
    ResourceRevisionView:
      allOf:
      - {$ref: '#/components/schemas/ResourceRevision'}
      - type: object
        required: [is_head]
        properties:
          is_head: {type: boolean}
    ResourceRevisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ResourceRevisionView'}
        next_cursor: {type: [string, 'null']}
    UserRequest:
      type: object
      oneOf:
      - required: [conversation_id, conversation_turn_id]
        properties:
          conversation_id: {type: string}
          conversation_turn_id: {type: string}
          task_id: {type: 'null'}
          attempt_id: {type: 'null'}
      - required: [task_id]
        properties:
          conversation_id: {type: 'null'}
          conversation_turn_id: {type: 'null'}
          task_id: {type: string}
          attempt_id: {type: 'null'}
      - required: [task_id, attempt_id]
        properties:
          conversation_id: {type: 'null'}
          conversation_turn_id: {type: 'null'}
          task_id: {type: string}
          attempt_id: {type: string}
      required: [request_id, workspace_id, agent_session_id, kind, interaction_mode, prompt, choices, status, created_at, version]
      properties:
        request_id: {type: string}
        workspace_id: {type: string}
        conversation_id: {type: [string, 'null']}
        conversation_turn_id: {type: [string, 'null']}
        task_id: {type: [string, 'null']}
        attempt_id: {type: [string, 'null']}
        agent_session_id: {type: string}
        invocation_id: {type: [string, 'null']}
        kind: {type: string, enum: [QUESTION, DECISION, RESOURCE_SELECTION, EXTERNAL_AUTHORIZATION]}
        interaction_mode: {type: string, enum: [FORM, EXTERNAL_URL]}
        prompt: {type: string}
        response_schema:
          oneOf: [{$ref: '#/components/schemas/JsonSchema'}, {type: 'null'}]
        choices:
          type: array
          items: {$ref: '#/components/schemas/Choice'}
        status: {type: string, enum: [PENDING, ANSWERED, DISMISSED, EXPIRED, CANCELLED]}
        expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        resolved_by:
          oneOf: [{$ref: '#/components/schemas/PrincipalRef'}, {type: 'null'}]
        response_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        version: {type: integer, minimum: 1}
      allOf:
      - if:
          properties: {interaction_mode: {const: EXTERNAL_URL}}
          required: [interaction_mode]
        then:
          properties:
            kind: {const: EXTERNAL_AUTHORIZATION}
            response_schema: {type: 'null'}
            choices: {maxItems: 0}
      - if:
          properties: {kind: {const: EXTERNAL_AUTHORIZATION}}
          required: [kind]
        then:
          properties: {interaction_mode: {const: EXTERNAL_URL}}
    UserRequestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/UserRequest'}
        next_cursor: {type: [string, 'null']}
    UserRequestResponseInput:
      type: object
      additionalProperties: false
      required: [response]
      properties:
        response:
          description: >-
            Non-secret form data for FORM requests, or exactly {action: accept|decline|cancel}
            for EXTERNAL_URL requests. The server enforces the request's interaction mode.
          $ref: '#/components/schemas/JsonValue'
    UserRequestResponse:
      type: object
      required: [request_id, response_digest, responded_by, responded_at]
      properties:
        request_id: {type: string}
        response_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        responded_by: {$ref: '#/components/schemas/PrincipalRef'}
        response_channel_ref:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [channel_binding_id, provider_event_id]
            properties:
              channel_binding_id: {type: string}
              provider_event_id: {type: string, minLength: 1}
        responded_at: {type: string, format: date-time}
    ExternalAuthHandoff:
      type: object
      additionalProperties: false
      required: [url, display_origin]
      properties:
        url:
          type: string
          format: uri
          description: Confidential Runtime-private URL; clients must open externally and not persist or log it.
        display_origin: {type: string, format: uri, description: Parsed destination origin; TLS identity is confirmed by the system browser.}
    EnvironmentControlLeaseView:
      type: object
      additionalProperties: false
      required: [control_lease_id, environment_id, task_id, attempt_id, runtime_id, runtime_incarnation_id, owner_kind, owner_ref, epoch, state, acquired_at, expires_at, version]
      properties:
        control_lease_id: {type: string}
        environment_id: {type: string}
        task_id: {type: string}
        attempt_id: {type: string}
        runtime_id: {type: string}
        runtime_incarnation_id: {type: string}
        owner_kind: {type: string, enum: [AGENT, HUMAN]}
        owner_ref:
          oneOf: [{type: string}, {$ref: '#/components/schemas/PrincipalRef'}]
        epoch: {type: integer, minimum: 1}
        state: {type: string, enum: [ACTIVE, RELEASING, RELEASED, EXPIRED, REVOKED]}
        acquired_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    TakeEnvironmentControlRequest:
      type: object
      additionalProperties: false
      required: [expected_control_epoch]
      properties:
        expected_control_epoch: {type: integer, minimum: 1}
        reason: {type: [string, 'null'], maxLength: 500}
    ReturnEnvironmentControlRequest:
      type: object
      additionalProperties: false
      required: [expected_control_epoch]
      properties:
        expected_control_epoch: {type: integer, minimum: 1}
        reconcile_observation_ref:
          oneOf: [{$ref: '#/components/schemas/ResourceRef'}, {type: 'null'}]
    WorkspaceInstructionRevision:
      description: Immutable user-authored Workspace instructions; the pinned text Resource is UTF-8 and at most 64 KiB.
      type: object
      required: [workspace_id, revision, parent_revisions, content_ref, content_digest, authored_by, created_at]
      properties:
        workspace_id: {type: string}
        revision: {type: integer, minimum: 1}
        parent_revisions:
          type: array
          items: {type: integer, minimum: 1}
        content_ref: {$ref: '#/components/schemas/ResourceRef'}
        content_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        authored_by: {$ref: '#/components/schemas/PrincipalRef'}
        created_at: {type: string, format: date-time}
    WorkspaceInstructionRevisionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/WorkspaceInstructionRevision'}
        next_cursor: {type: [string, 'null']}
    CreateWorkspaceInstructionRevisionRequest:
      description: Creates instructions from a pinned, same-Workspace UTF-8 text Resource no larger than 64 KiB.
      type: object
      additionalProperties: false
      required: [parent_revisions, content_ref, content_digest]
      properties:
        parent_revisions:
          type: array
          items: {type: integer, minimum: 1}
        content_ref: {$ref: '#/components/schemas/ResourceRef'}
        content_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    CapabilityInvocation:
      type: object
      required:
      - invocation_id
      - workspace_id
      - scope
      - agent_session_id
      - capability_grant_id
      - activation_id
      - capability_ref
      - operation
      - request_digest
      - execution_method
      - action_batch
      - status
      - partial_result_refs
      - result_refs
      - created_at
      - updated_at
      - version
      properties:
        invocation_id: {type: string}
        workspace_id: {type: string}
        scope:
          oneOf: [{$ref: '#/components/schemas/ConversationInvocationScope'}, {$ref: '#/components/schemas/PlanningInvocationScope'}, {$ref: '#/components/schemas/AttemptInvocationScope'}]
        agent_session_id: {type: string}
        capability_grant_id: {type: string}
        activation_id: {type: string}
        capability_ref: {$ref: '#/components/schemas/CapabilityRef'}
        operation: {type: string}
        request_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        execution_method: {type: string, enum: [STRUCTURED_API, STRUCTURED_BROWSER, ACCESSIBILITY_BROWSER, SCREEN_COMPUTER_USE, DETERMINISTIC_LOCAL, NATIVE_AGENT_TOOL, UNKNOWN], description: Selected by the adapter before admission and immutable; UNKNOWN only when the exact route cannot be proven. Never accepted from the agent as evidence.}
        action_batch: {oneOf: [{$ref: '#/components/schemas/ActionBatchMemberRef'}, {type: 'null'}]}
        idempotency_key: {type: [string, 'null']}
        status: {type: string, enum: [CREATED, DISPATCHED, WAITING, INPUT_REQUIRED, CANCEL_REQUESTED, SUCCEEDED, FAILED, CANCELLED, AMBIGUOUS]}
        provider_task_status: {type: [string, 'null'], enum: [WORKING, INPUT_REQUIRED, COMPLETED, FAILED, CANCELLED, UNKNOWN, null]}
        provider_task_created_at: {type: [string, 'null'], format: date-time}
        provider_task_expires_at: {type: [string, 'null'], format: date-time}
        provider_task_ttl_ms: {type: [integer, 'null'], minimum: 0}
        provider_poll_after_ms: {type: [integer, 'null'], minimum: 0}
        provider_updated_at: {type: [string, 'null'], format: date-time}
        partial_result_refs:
          type: array
          items: {$ref: '#/components/schemas/ResourceRef'}
        result_refs:
          type: array
          items: {$ref: '#/components/schemas/ResourceRef'}
        effect_id: {type: [string, 'null']}
        failure:
          oneOf: [{$ref: '#/components/schemas/FailureRecord'}, {type: 'null'}]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    ActionBatchMemberRef:
      type: object
      additionalProperties: false
      required: [action_batch_id, ordinal, operation_count, batch_digest]
      properties:
        action_batch_id: {type: string, minLength: 1}
        ordinal: {type: integer, minimum: 0, maximum: 63, description: Zero-based; must be less than operation_count.}
        operation_count: {type: integer, minimum: 1, maximum: 64}
        batch_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    ConversationInvocationScope:
      type: object
      additionalProperties: false
      required: [kind, conversation_id]
      properties:
        kind: {const: CONVERSATION}
        conversation_id: {type: string}
    PlanningInvocationScope:
      type: object
      additionalProperties: false
      required: [kind, task_id]
      properties:
        kind: {const: TASK_PLANNING}
        task_id: {type: string}
    AttemptInvocationScope:
      type: object
      additionalProperties: false
      required: [kind, task_id, attempt_id]
      properties:
        kind: {const: ATTEMPT_EXECUTION}
        task_id: {type: string}
        attempt_id: {type: string}
    CapabilityInvocationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CapabilityInvocation'}
        next_cursor: {type: [string, 'null']}
    UsageObservation:
      type: object
      required: [usage_observation_id, workspace_id, source, metric, quantity, unit, confidence, observed_at]
      properties:
        usage_observation_id: {type: string}
        workspace_id: {type: string}
        task_id: {type: [string, 'null']}
        environment_id: {type: [string, 'null']}
        attempt_id: {type: [string, 'null']}
        invocation_id: {type: [string, 'null']}
        agent_session_id: {type: [string, 'null']}
        source: {type: string, enum: [AGENT_REPORTED, PROVIDER_REPORTED, HOST_MEASURED]}
        metric: {type: string, enum: [TOKEN_INPUT, TOKEN_OUTPUT, WALL_TIME, COST, BYTES_READ, BYTES_WRITTEN, CALL_COUNT]}
        quantity: {type: [number, 'null']}
        unit: {type: string}
        currency: {type: [string, 'null']}
        confidence: {type: string, enum: [EXACT, ESTIMATED, UNKNOWN]}
        observed_at: {type: string, format: date-time}
        source_ref: {type: [string, 'null']}
      allOf:
      - if: {properties: {confidence: {const: UNKNOWN}}, required: [confidence]}
        then: {properties: {quantity: {type: 'null'}}}
        else: {properties: {quantity: {type: number}}}
      - if: {properties: {metric: {const: COST}, confidence: {enum: [EXACT, ESTIMATED]}}, required: [metric, confidence]}
        then: {required: [currency]}
      - if: {properties: {metric: {not: {const: COST}}}, required: [metric]}
        then: {properties: {currency: {type: 'null'}}}
