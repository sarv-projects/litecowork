        native_delegation_policy: {type: string, enum: [INHERIT, ALLOW, DENY_IF_SUPPORTED]}
        warm_policy: {$ref: '#/components/schemas/WarmPolicy'}
      allOf:
      - if:
          properties: {session_options: {minProperties: 1}}
          required: [session_options]
        then:
          properties: {session_options_descriptor_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}}
      - if:
          properties: {session_options: {maxProperties: 0}}
          required: [session_options]
