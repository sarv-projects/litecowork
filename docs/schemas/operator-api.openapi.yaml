    DelegationProfileRevisionInput:
      type: object
      additionalProperties: false
      required: [name, routing_description, session_options, session_options_descriptor_digest, required_features, preferred_features, enforced_policy, optimization_preference, max_concurrency, max_host_delegation_depth, latency_class, environment_policy, native_delegation_policy, warm_policy]
      properties:
        name: {type: string, minLength: 1, maxLength: 120, description: Trimmed and NFC-normalized; compared by Unicode case-folding within the AgentBinding.}
        routing_description: {type: string, minLength: 1, maxLength: 240}
        instructions: {type: [string, 'null'], maxLength: 12000}
        session_options: {type: object, maxProperties: 64, additionalProperties: true, description: Adapter-negotiated non-secret values only; canonical JSON is at most 64 KiB.}
        session_options_descriptor_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$', description: Required when session_options is nonempty; pins its adapter-negotiated schema.}
        required_features: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/AgentFeature'}}
        preferred_features: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/AgentFeature'}}
        enforced_policy: {$ref: '#/components/schemas/DelegatedWorkerPolicy'}
        optimization_preference: {type: string, enum: [QUALITY_FIRST, BALANCED, COST_FIRST, LATENCY_FIRST]}
        quality_floor: {type: [array, 'null'], items: {$ref: '#/components/schemas/AcceptanceCriterion'}}
        max_concurrency: {type: integer, minimum: 1, maximum: 8}
        max_host_delegation_depth: {type: integer, minimum: 0, maximum: 2}
        budget_ceiling: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        latency_class: {type: string, enum: [STANDARD, INTERACTIVE, DEADLINE_SENSITIVE]}
        environment_policy: {$ref: '#/components/schemas/DelegatedEnvironmentPolicy'}
        native_delegation_policy: {type: string, enum: [INHERIT, ALLOW, DENY_IF_SUPPORTED]}
        warm_policy: {$ref: '#/components/schemas/WarmPolicy'}
      allOf:
      - if:
          properties: {session_options: {minProperties: 1}}
          required: [session_options]
        then:
          properties: {session_options_descriptor_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}}
      - if:
          properties: {session_options: {maxProperties: 0}}
          required: [session_options]
        then:
          properties: {session_options_descriptor_digest: {type: 'null'}}
