    AutomationOccurrencePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AutomationOccurrence'}
        next_cursor: {type: [string, 'null']}
    ArtifactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Artifact'}
        next_cursor: {type: [string, 'null']}
    Routine:
      type: object
      required: [routine_id, workspace_id, name, current_revision, status, version, created_at, updated_at]
      properties:
        routine_id: {type: string}
        workspace_id: {type: string}
