openapi: 3.1.0
info:
  title: LiteCowork Operator API
  version: 1.0.0
  description: >-
    User-facing commands and projections. Local IPC maps to these logical contracts;
    this document does not define Mesh, Agent, Environment, or LitePSM APIs.
servers:
  - url: https://localhost/v1
security:
  - operatorAuth: []
    workspaceContext: []
tags:
  - name: workspaces
  - name: conversations
  - name: tasks
  - name: approvals
  - name: artifacts
  - name: automations
  - name: runtimes
  - name: agents
  - name: connections
  - name: channels
  - name: discover
  - name: resources
paths:
  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      security:
        - operatorAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workspaces owned by the authenticated principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [workspaces]
      operationId: createWorkspace
      security:
        - operatorAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }
  /workspaces/{workspaceId}:
    get:
      tags: [workspaces]
      operationId: getWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace owned by the authenticated principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [workspaces]
      operationId: updateWorkspacePolicy
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspacePolicyRequest' }
      responses:
        '200':
          description: Policy update applies to future replication transfers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }
  /workspaces/{workspaceId}/archive:
    post:
      tags: [workspaces]
      operationId: archiveWorkspace
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Quiescent Workspace archived and made read-only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }
  /conversations:
    post:
      tags: [conversations]
      operationId: createConversation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        default: { $ref: '#/components/responses/Error' }
  /conversations/{conversationId}:
    get:
      tags: [conversations]
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Conversation projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        default: { $ref: '#/components/responses/Error' }
  /conversations/{conversationId}/messages:
    get:
      tags: [conversations]
      operationId: listConversationMessages
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ordered message page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [conversations]
      operationId: appendConversationMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendMessageRequest' }
      responses:
        '201':
          description: Message appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessage' }
        default: { $ref: '#/components/responses/Error' }
  /conversations/{conversationId}/tasks:
    get:
      tags: [conversations]
      operationId: listConversationTasks
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Tasks associated with the Conversation', content: { application/json: { schema: { $ref: '#/components/schemas/TaskPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: conversation_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Task summary page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [tasks]
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Task and initial TaskSpecRevision committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}:
    get:
      tags: [tasks]
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Current Task projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/steer:
    post:
      tags: [tasks]
      operationId: steerTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SteerTaskRequest' }
      responses:
        '202': { description: Steering accepted for Task Runtime processing, content: { application/json: { schema: { $ref: '#/components/schemas/CommandReceipt' } } } }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/lead-agent:
    post:
      tags: [tasks]
      operationId: changeTaskLeadAgent
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeLeadAgentRequest' }
      responses:
        '202': { description: Lead replacement accepted; active Attempts drain under lease and Effect rules, content: { application/json: { schema: { $ref: '#/components/schemas/CommandReceipt' } } } }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202': { description: Cancellation requested; Task may remain stopping while Effects settle, content: { application/json: { schema: { $ref: '#/components/schemas/CommandReceipt' } } } }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/retry:
    post:
      tags: [tasks]
      operationId: requestTaskRecovery
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryRequest' }
      responses:
        '202': { description: Recovery request accepted if legal for current state, content: { application/json: { schema: { $ref: '#/components/schemas/CommandReceipt' } } } }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/spec-revisions:
    get:
      tags: [tasks]
      operationId: listTaskSpecRevisions
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Immutable TaskSpecRevision history
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TaskSpecRevision' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [tasks]
      operationId: reviseTaskSpec
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviseTaskSpecRequest' }
      responses:
        '201':
          description: New immutable TaskSpecRevision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSpecRevision' }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/plan-revisions:
    get:
      tags: [tasks]
      operationId: listPlanRevisions
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Immutable PlanRevision history
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlanRevision' } }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/steps:
    get:
      tags: [tasks]
      operationId: listTaskSteps
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { description: 'Task Steps', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Step' } } } } }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/attempts:
    get:
      tags: [tasks]
      operationId: listTaskAttempts
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { description: 'Task Attempts', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Attempt' } } } } }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/timeline:
    get:
      tags: [tasks]
      operationId: getTaskTimeline
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Projected Task timeline', content: { application/json: { schema: { $ref: '#/components/schemas/TimelinePage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/artifacts:
    get:
      tags: [artifacts]
      operationId: listTaskArtifacts
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { description: 'Artifact summaries', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Artifact' } } } } }
        default: { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/effects:
    get:
      tags: [tasks]
      operationId: listTaskEffects
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { description: 'Effect summaries with evidence level', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Effect' } } } } }
        default: { $ref: '#/components/responses/Error' }
  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, DENIED, EXPIRED, CANCELLED] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Approval page', content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /approvals/{approvalId}:
    get:
      tags: [approvals]
      operationId: getApproval
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Approval bound to an exact target and action digest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        default: { $ref: '#/components/responses/Error' }
  /approvals/{approvalId}/resolve:
    post:
      tags: [approvals]
      operationId: resolveApproval
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveApprovalRequest' }
      responses:
        '200': { description: Approval decision recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
        default: { $ref: '#/components/responses/Error' }
  /artifacts:
    get:
      tags: [artifacts]
      operationId: listArtifacts
      parameters:
        - name: library_status
          in: query
          required: false
          schema: { type: string, enum: [TRANSIENT, SAVED, ARCHIVED] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Authorized Artifacts filtered by Library status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPage' }
        default: { $ref: '#/components/responses/Error' }
  /artifacts/{artifactId}:
    get:
      tags: [artifacts]
      operationId: getArtifact
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Artifact metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        default: { $ref: '#/components/responses/Error' }
  /artifacts/{artifactId}/versions/{version}:
    get:
      tags: [artifacts]
      operationId: getArtifactVersion
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Immutable artifact version metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactVersion' }
        default: { $ref: '#/components/responses/Error' }
  /artifacts/{artifactId}/versions/{version}/content:
    get:
      tags: [artifacts]
      operationId: downloadArtifactVersion
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Immutable artifact bytes; Content-Type is the stored media type
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /artifacts/{artifactId}/promote:
    post:
      tags: [artifacts]
      operationId: promoteArtifact
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Artifact promoted into the user Library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        default: { $ref: '#/components/responses/Error' }
  /artifacts/{artifactId}/archive:
    post:
      tags: [artifacts]
      operationId: archiveArtifact
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Saved Artifact archived and removed from the default Library projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        default: { $ref: '#/components/responses/Error' }
  /library:
    get:
      tags: [artifacts]
      operationId: listLibrary
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Library page', content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /automations:
    get:
      tags: [automations]
      operationId: listAutomations
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Automation page', content: { application/json: { schema: { $ref: '#/components/schemas/AutomationPage' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [automations]
      operationId: createAutomation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAutomationRequest' }
      responses:
        '201':
          description: Automation and immutable revision 1 created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Automation' }
        default: { $ref: '#/components/responses/Error' }
  /automations/{automationId}:
    get:
      tags: [automations]
      operationId: getAutomation
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Automation definition, content: { application/json: { schema: { $ref: '#/components/schemas/Automation' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [automations]
      operationId: updateAutomation
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAutomationRequest' }
      responses:
        '200': { description: Automation updated, content: { application/json: { schema: { $ref: '#/components/schemas/Automation' } } } }
        default: { $ref: '#/components/responses/Error' }
  /automations/{automationId}/run:
    post:
      tags: [automations]
      operationId: runAutomationNow
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualAutomationRunRequest' }
      responses:
        '202':
          description: Manual occurrence accepted and pinned to the current revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationOccurrence' }
        default: { $ref: '#/components/responses/Error' }
  /automations/{automationId}/revisions:
    get:
      tags: [automations]
      operationId: listAutomationRevisions
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Immutable AutomationRevision history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationRevisionPage' }
        default: { $ref: '#/components/responses/Error' }
  /automations/{automationId}/occurrences:
    get:
      tags: [automations]
      operationId: listAutomationOccurrences
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Logical occurrences pinned to immutable AutomationRevisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationOccurrencePage' }
        default: { $ref: '#/components/responses/Error' }
  /automations/{automationId}/pause:
    post:
      tags: [automations]
      operationId: pauseAutomation
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Automation paused, content: { application/json: { schema: { $ref: '#/components/schemas/Automation' } } } }
        default: { $ref: '#/components/responses/Error' }
  /automations/{automationId}/resume:
    post:
      tags: [automations]
      operationId: resumeAutomation
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Automation resumed, content: { application/json: { schema: { $ref: '#/components/schemas/Automation' } } } }
        default: { $ref: '#/components/responses/Error' }
  /automations/{automationId}/disable:
    post:
      tags: [automations]
      operationId: disableAutomation
      parameters:
        - name: automationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Automation disabled permanently, content: { application/json: { schema: { $ref: '#/components/schemas/Automation' } } } }
        default: { $ref: '#/components/responses/Error' }
  /runtimes:
    get:
      tags: [runtimes]
      operationId: listRuntimes
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Runtime descriptors; secrets and private keys are omitted, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimePage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /runtimes/pair-token:
    post:
      tags: [runtimes]
      operationId: createRuntimePairToken
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePairingTokenRequest' }
      responses:
        '201': { description: Single-use short-lived pairing token; returned once, content: { application/json: { schema: { $ref: '#/components/schemas/PairingToken' } } } }
        default: { $ref: '#/components/responses/Error' }
  /runtimes/{runtimeId}/revoke:
    post:
      tags: [runtimes]
      operationId: revokeRuntime
      parameters:
        - name: runtimeId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Runtime authority revoked, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeDescriptor' } } } }
        default: { $ref: '#/components/responses/Error' }
  /runtimes/{runtimeId}/offers:
    get:
      tags: [runtimes]
      operationId: getRuntimeOffers
      parameters:
        - name: runtimeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Runtime offers with expiry and compatibility evidence, content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeOfferPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /agent-profiles:
    get:
      tags: [agents]
      operationId: listAgentProfiles
      parameters:
        - name: runtime_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Runtime-discovered profiles with unexpired offer observations; inventory becomes stale when a Runtime is offline, content: { application/json: { schema: { $ref: '#/components/schemas/AgentProfilePage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /agent-bindings:
    get:
      tags: [agents]
      operationId: listAgentBindings
      parameters:
        - name: runtime_id
          in: query
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Workspace AgentBindings, content: { application/json: { schema: { $ref: '#/components/schemas/AgentBindingPage' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [agents]
      operationId: createAgentBinding
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentBindingRequest' }
      responses:
        '201': { description: Disabled AgentBinding created from a currently discovered profile, content: { application/json: { schema: { $ref: '#/components/schemas/AgentBinding' } } } }
        default: { $ref: '#/components/responses/Error' }
  /agent-bindings/{agentBindingId}:
    get:
      tags: [agents]
      operationId: getAgentBinding
      parameters:
        - name: agentBindingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: AgentBinding view; auth is represented by SecretRef only, content: { application/json: { schema: { $ref: '#/components/schemas/AgentBinding' } } } }
        default: { $ref: '#/components/responses/Error' }
  /agent-bindings/{agentBindingId}/enable:
    post:
      tags: [agents]
      operationId: enableAgentBinding
      parameters:
        - name: agentBindingId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Binding enabled for new planning/Attempt admission, content: { application/json: { schema: { $ref: '#/components/schemas/AgentBinding' } } } }
        default: { $ref: '#/components/responses/Error' }
  /agent-bindings/{agentBindingId}/disable:
    post:
      tags: [agents]
      operationId: disableAgentBinding
      parameters:
        - name: agentBindingId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Binding disabled for new admission; already admitted sessions remain pinned and settle safely, content: { application/json: { schema: { $ref: '#/components/schemas/AgentBinding' } } } }
        default: { $ref: '#/components/responses/Error' }
  /connections:
    get:
      tags: [connections]
      operationId: listConnections
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [CONNECTING, CONNECTED, DEGRADED, REAUTH_REQUIRED, DISCONNECTED] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Normalized connection metadata, without credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /connections/{connectionId}:
    get:
      tags: [connections]
      operationId: getConnection
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Normalized connection metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        default: { $ref: '#/components/responses/Error' }
  /connections/{connectionId}/disconnect:
    post:
      tags: [connections]
      operationId: disconnectConnection
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Connection use stopped; provider account and historical records are preserved, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        default: { $ref: '#/components/responses/Error' }
  /channel-bindings:
    get:
      tags: [channels]
      operationId: listChannelBindings
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, DEGRADED, REVOKED] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Channel identity bindings and their current authority, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelBindingPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /channel-bindings/{channelBindingId}:
    get:
      tags: [channels]
      operationId: getChannelBinding
      parameters:
        - name: channelBindingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Channel binding projection, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelBinding' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [channels]
      operationId: updateChannelBindingActions
      parameters:
        - name: channelBindingId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChannelBindingActionsRequest' }
      responses:
        '200': { description: Allowed channel actions updated after TrustService authorization, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelBinding' } } } }
        default: { $ref: '#/components/responses/Error' }
  /channel-bindings/{channelBindingId}/revoke:
    post:
      tags: [channels]
      operationId: revokeChannelBinding
      parameters:
        - name: channelBindingId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Binding revoked; inbound commands are rejected and history is preserved, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelBinding' } } } }
        default: { $ref: '#/components/responses/Error' }
  /discover/search:
    get:
      tags: [discover]
      operationId: searchDiscover
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: kind
          in: query
          schema: { type: string, enum: [APP, CAPABILITY, SKILL, AGENT] }
      responses:
        '200': { description: Bounded user-facing candidates; package details remain LitePSM-owned, content: { application/json: { schema: { $ref: '#/components/schemas/DiscoverItemPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /discover/items/{itemId}:
    get:
      tags: [discover]
      operationId: describeDiscoverItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Normalized user-facing capability/agent description, content: { application/json: { schema: { $ref: '#/components/schemas/DiscoverItem' } } } }
        default: { $ref: '#/components/responses/Error' }
  /capabilities/{capabilityId}/connect-or-install:
    post:
      tags: [discover]
      operationId: connectOrInstallCapability
      parameters:
        - name: capabilityId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectCapabilityRequest' }
      responses:
        '202': { description: Capability resolution/connection accepted; approval or runtime activation may still be required, content: { application/json: { schema: { $ref: '#/components/schemas/CapabilitySetupReceipt' } } } }
        default: { $ref: '#/components/responses/Error' }
  /capabilities/{capabilityId}/test:
    post:
      tags: [discover]
      operationId: testCapabilityConnection
      parameters:
        - name: capabilityId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCapabilityRequest' }
      responses:
        '200': { description: Bounded connection health result; no package-manager internals are returned, content: { application/json: { schema: { $ref: '#/components/schemas/CapabilityHealthResult' } } } }
        default: { $ref: '#/components/responses/Error' }
  /resources/uploads:
    post:
      tags: [resources]
      operationId: createResourceUpload
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResourceUploadRequest' }
      responses:
        '201': { description: Bounded temporary upload session, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceUploadSession' } } } }
        default: { $ref: '#/components/responses/Error' }
  /resources/uploads/{uploadId}/content:
    put:
      tags: [resources]
      operationId: uploadResourceContent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: uploadId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204': { description: Content chunk accepted }
        default: { $ref: '#/components/responses/Error' }
  /resources/uploads/{uploadId}/commit:
    post:
      tags: [resources]
      operationId: commitResourceUpload
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: Digest-verified immutable blob ResourceRef, content: { application/json: { schema: { $ref: '#/components/schemas/CommittedResourceRef' } } } }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    workspaceContext:
      type: apiKey
      in: header
      name: X-Workspace-ID
      description: Required Workspace scope for all operations except listing/creating Workspaces; for path/body Workspace IDs, values must match.
    operatorAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected aggregate version for optimistic concurrency.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Safe typed error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        replication_policy:
          type: string
          description: Defaults to LOCAL_ONLY. Cloud replication requires an explicit user-selected policy.
          default: LOCAL_ONLY
          enum: [LOCAL_ONLY, METADATA_ONLY, ACTIVE_TASK_INPUTS, SELECTED_FOLDERS, FULL_WORKSPACE]
        replication_scope_refs:
          type: array
          default: []
          description: Required and revision-pinned when replication_policy is SELECTED_FOLDERS.
          items: { $ref: '#/components/schemas/ResourceRef' }
    UpdateWorkspacePolicyRequest:
      type: object
      additionalProperties: false
      required: [replication_policy]
      properties:
        replication_policy:
          type: string
          enum: [LOCAL_ONLY, METADATA_ONLY, ACTIVE_TASK_INPUTS, SELECTED_FOLDERS, FULL_WORKSPACE]
        replication_scope_refs:
          type: array
          items: { $ref: '#/components/schemas/ResourceRef' }
    Workspace:
      type: object
      required: [workspace_id, name, owner_principal_id, replication_policy, replication_scope_refs, status, version, created_at, updated_at]
      properties:
        workspace_id: { type: string }
        name: { type: string }
        owner_principal_id: { type: string }
        replication_policy:
          type: string
          enum: [LOCAL_ONLY, METADATA_ONLY, ACTIVE_TASK_INPUTS, SELECTED_FOLDERS, FULL_WORKSPACE]
        replication_scope_refs:
          type: array
          items: { $ref: '#/components/schemas/ResourceRef' }
        hub_runtime_id: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkspacePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Workspace' } }
        next_cursor: { type: [string, 'null'] }
    Connection:
      type: object
      required: [connection_id, workspace_id, external_provider_ref, status, created_at, updated_at, version]
      properties:
        connection_id: { type: string }
        workspace_id: { type: string }
        external_provider_ref: { type: string }
        account_ref: { type: [string, 'null'] }
        status: { type: string, enum: [CONNECTING, CONNECTED, DEGRADED, REAUTH_REQUIRED, DISCONNECTED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    ConnectionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        next_cursor: { type: [string, 'null'] }
    ChannelBinding:
      type: object
      required: [channel_binding_id, workspace_id, connection_id, provider_ref, external_account_ref, identity_ref, assurance_level, allowed_actions, status, created_at, updated_at, version]
      properties:
        channel_binding_id: { type: string }
        workspace_id: { type: string }
        connection_id: { type: [string, 'null'] }
        provider_ref: { type: string }
        external_account_ref: { type: string }
        identity_ref: { $ref: '#/components/schemas/PrincipalRef' }
        assurance_level: { type: string, enum: [VIEW_ONLY, STEER_SAFE, APPROVE_SAFE, APPROVE_SENSITIVE, LOCAL_STRONG] }
        allowed_actions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [VIEW, STEER, APPROVE_SAFE, APPROVE_SENSITIVE] }
        status: { type: string, enum: [ACTIVE, DEGRADED, REVOKED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    ChannelBindingPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ChannelBinding' } }
        next_cursor: { type: [string, 'null'] }
    UpdateChannelBindingActionsRequest:
      type: object
      additionalProperties: false
      required: [allowed_actions]
      properties:
        allowed_actions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [VIEW, STEER, APPROVE_SAFE, APPROVE_SENSITIVE] }
    JsonObject:
      type: object
      additionalProperties: true
    PlacementPreference:
      oneOf:
        - type: string
          enum: [AUTO, LOCAL_ONLY, CLOUD_PREFERRED, CLOUD_ONLY]
        - type: object
          additionalProperties: false
          required: [runtime_id]
          properties:
            runtime_id: { type: string }
    SecretRef:
      type: object
      required: [secret_ref_id, provider_ref, placement]
      properties:
        secret_ref_id: { type: string }
        provider_ref: { type: string }
        placement: { type: string, enum: [LOCAL_ONLY, CLOUD_AVAILABLE, RUNTIME_BOUND, EXTERNAL_AGENT_OWNED] }
    RetryPolicy:
      type: object
      additionalProperties: false
      required: [max_attempts, initial_backoff_ms, max_backoff_ms, multiplier, jitter, retryable_error_codes]
      properties:
        max_attempts: { type: integer, minimum: 0 }
        initial_backoff_ms: { type: integer, minimum: 0 }
        max_backoff_ms: { type: integer, minimum: 0 }
        multiplier: { type: number, exclusiveMinimum: 0 }
        jitter: { type: boolean }
        retryable_error_codes: { type: array, items: { type: string } }
    TaskInputBinding:
      type: object
      additionalProperties: false
      required: [source_pointer, template_variable, value_kind, required]
      properties:
        source_pointer: { type: string, minLength: 1 }
        template_variable: { type: string, minLength: 1 }
        value_kind: { type: string, enum: [TEXT, RESOURCE_REF] }
        required: { type: boolean }
        max_bytes: { type: [integer, 'null'], minimum: 1 }
    AgentCapabilities:
      type: object
      required: [protocol, session, input, extension, reporting, environment, limits]
      properties:
        protocol: { type: string }
        protocol_version: { type: [string, 'null'] }
        session:
          type: object
          required: [resume, steer, interrupt, cancel, fork]
          properties:
            resume: { type: boolean }
            steer: { type: boolean }
            interrupt: { type: boolean }
            cancel: { type: boolean }
            fork: { type: boolean }
        input:
          type: object
          required: [text, image, file, resources]
          properties:
            text: { type: boolean }
            image: { type: boolean }
            file: { type: boolean }
            resources: { type: boolean }
        extension:
          type: object
          required: [mcp_stdio, mcp_http, skills, plugins, dynamic_attach]
          properties:
            mcp_stdio: { type: boolean }
            mcp_http: { type: boolean }
            skills: { type: boolean }
            plugins: { type: boolean }
            dynamic_attach: { type: boolean }
        reporting:
          type: object
          required: [tool_calls, plan, usage, native_subagents, approvals]
          properties:
            tool_calls: { type: boolean }
            plan: { type: boolean }
            usage: { type: boolean }
            native_subagents: { type: boolean }
            approvals: { type: boolean }
        environment:
          type: object
          required: [cwd, extra_directories]
          properties:
            cwd: { type: boolean }
            extra_directories: { type: boolean }
        limits:
          type: object
          properties:
            max_context_hint: { type: [integer, 'null'], minimum: 0 }
            max_concurrent_sessions: { type: [integer, 'null'], minimum: 1 }
    AgentProfile:
      type: object
      required: [agent_profile_id, provider_key, display_name, adapter_kind, capabilities, discovered_at]
      properties:
        agent_profile_id: { type: string }
        provider_key: { type: string }
        display_name: { type: string }
        adapter_kind: { type: string, enum: [ACP, A2A, SDK, CLI, TERMINAL] }
        capabilities: { $ref: '#/components/schemas/AgentCapabilities' }
        discovered_at: { type: string, format: date-time }
    AgentProfilePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AgentProfileView' } }
        next_cursor: { type: [string, 'null'] }
    AgentProfileView:
      allOf:
        - $ref: '#/components/schemas/AgentProfile'
        - type: object
          required: [observations]
          properties:
            observations:
              type: array
              items: { $ref: '#/components/schemas/AgentProfileObservation' }
    AgentProfileObservation:
      type: object
      additionalProperties: false
      required: [runtime_id, offer_expires_at]
      properties:
        runtime_id: { type: string }
        offer_expires_at: { type: string, format: date-time }
    AgentBinding:
      type: object
      required: [agent_binding_id, workspace_id, agent_profile_id, runtime_id, auth_ref, configuration, enabled, created_at, version]
      properties:
        agent_binding_id: { type: string }
        workspace_id: { type: string }
        agent_profile_id: { type: string }
        runtime_id: { type: [string, 'null'] }
        auth_ref:
          oneOf:
            - $ref: '#/components/schemas/SecretRef'
            - type: 'null'
        configuration: { $ref: '#/components/schemas/JsonObject' }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    AgentBindingPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AgentBinding' } }
        next_cursor: { type: [string, 'null'] }
    CreateAgentBindingRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, agent_profile_id]
      properties:
        workspace_id: { type: string }
        agent_profile_id: { type: string }
        runtime_id: { type: [string, 'null'] }
        auth_ref:
          oneOf:
            - $ref: '#/components/schemas/SecretRef'
            - type: 'null'
        configuration: { $ref: '#/components/schemas/JsonObject' }
    PrincipalRef:
      type: object
      additionalProperties: false
      required: [principal_id, kind]
      properties:
        principal_id: { type: string }
        kind: { type: string, enum: [USER, SERVICE, RUNTIME, AGENT, CHANNEL_IDENTITY] }
    MessageContentBlock:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, text]
          properties:
            kind: { const: TEXT }
            text: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, resource_ref]
          properties:
            kind: { const: RESOURCE }
            resource_ref: { $ref: '#/components/schemas/ResourceRef' }
            display_name: { type: [string, 'null'] }
    ApprovalRequirement:
      type: object
      additionalProperties: false
      required: [requirement_id, action_class, required_assurance, mandatory]
      properties:
        requirement_id: { type: string }
        action_class: { type: string }
        required_assurance: { type: string, enum: [VIEW_ONLY, STEER_SAFE, APPROVE_SAFE, APPROVE_SENSITIVE, LOCAL_STRONG] }
        mandatory: { type: boolean }
    AcceptanceCriterion:
      type: object
      additionalProperties: false
      required: [criterion_id, description, required_evidence, mandatory]
      properties:
        criterion_id: { type: string }
        description: { type: string }
        subject_refs: { type: array, items: { $ref: '#/components/schemas/ResourceRef' } }
        required_evidence: { type: string, enum: [REPORTED, OBSERVED, VERIFIED] }
        verifier_hint: { type: [string, 'null'] }
        mandatory: { type: boolean }
    OutputRequirement:
      type: object
      additionalProperties: false
      required: [output_id, description, mandatory]
      properties:
        output_id: { type: string }
        description: { type: string }
        kind: { type: [string, 'null'] }
        media_type: { type: [string, 'null'] }
        destination:
          oneOf:
            - $ref: '#/components/schemas/ResourceRef'
            - type: 'null'
        mandatory: { type: boolean }
    BudgetSpec:
      type: object
      additionalProperties: false
      properties:
        max_wall_time_ms: { type: [integer, 'null'], minimum: 0 }
        max_cost_minor_units: { type: [integer, 'null'], minimum: 0 }
        currency: { type: [string, 'null'], minLength: 3, maxLength: 3 }
