        source: {type: string, minLength: 1}
        observed_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        state: {type: string, enum: [NORMAL, LOW, EXHAUSTED, UNKNOWN]}
        remaining_hint: {oneOf: [{$ref: '#/components/schemas/UsageQuantity'}, {type: 'null'}]}
        reset_at: {type: [string, 'null'], format: date-time}
    DelegationBudgetPolicy:
      type: object
      additionalProperties: false
      required: [on_threshold]
      properties:
        max_concurrent_children: {type: [integer, 'null'], minimum: 1, maximum: 8}
        max_host_delegation_depth: {type: [integer, 'null'], minimum: 0, maximum: 2}
        max_per_attempt: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        max_per_task: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        max_per_profile: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        on_threshold: {type: string, enum: [WARN, REDUCE_CONCURRENCY, PREFER_CHEAPER, REQUIRE_APPROVAL, STOP_NEW_DELEGATION]}
    LeadFailoverPolicy:
      type: object
      additionalProperties: false
      required: [mode, triggers, fallback_agent_binding_ids, max_lead_changes]
      properties:
        mode: {type: string, enum: [DISABLED, ASK, ALLOW_LISTED]}
        triggers: {type: array, uniqueItems: true, items: {type: string, enum: [AGENT_UNAVAILABLE, QUOTA_EXHAUSTED, RUNTIME_UNAVAILABLE]}}
        fallback_agent_binding_ids: {type: array, uniqueItems: true, maxItems: 3, items: {type: string, minLength: 1}, description: Ordered same-Workspace lead-eligible bindings; revalidated on every use.}
        max_lead_changes: {type: integer, minimum: 0, maximum: 3}
      allOf:
      - if:
          properties: {mode: {const: DISABLED}}
          required: [mode]
        then:
          properties:
            triggers: {maxItems: 0}
            fallback_agent_binding_ids: {maxItems: 0}
            max_lead_changes: {const: 0}
      - if:
          properties: {mode: {const: ASK}}
          required: [mode]
        then:
          properties:
            triggers: {minItems: 1}
            max_lead_changes: {const: 0}
      - if:
          properties: {mode: {const: ALLOW_LISTED}}
          required: [mode]
        then:
          properties:
            triggers: {minItems: 1}
            fallback_agent_binding_ids: {minItems: 1}
            max_lead_changes: {minimum: 1}
    TaskSpecProposal:
      type: object
      additionalProperties: false
      required: [objective, constraints, input_refs, required_outputs, acceptance_criteria]
      properties:
        objective: {type: string, minLength: 1}
        task_category: {type: [string, 'null'], enum: [SOFTWARE_ENGINEERING, RESEARCH, WRITING, DATA_ANALYSIS, OFFICE, BROWSER, PERSONAL_ADMIN, OTHER, null]}
        constraints: {type: array, items: {type: string}}
        input_refs: {type: array, items: {$ref: '#/components/schemas/PinnedResourceRef'}}
        required_outputs: {type: array, items: {$ref: '#/components/schemas/OutputRequirement'}}
        acceptance_criteria: {type: array, items: {$ref: '#/components/schemas/AcceptanceCriterion'}}
        budget: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        delegation_budget_policy: {oneOf: [{$ref: '#/components/schemas/DelegationBudgetPolicy'}, {type: 'null'}]}
        deadline: {type: [string, 'null'], format: date-time}
    Suggestion:
      type: object
      additionalProperties: false
      required: [suggestion_id, workspace_id, coworker_id, dedupe_key, kind, reason, source_refs, goal_refs, proposed_action, proposed_by, proposed_task_spec, estimated_cost, latency_class_hint, status, created_at, expires_at, snoozed_until, resolved_at, resolved_by, resolution_reason, result_task_id, version]
      properties:
        suggestion_id: {type: string}
        workspace_id: {type: string}
        coworker_id: {type: [string, 'null']}
        dedupe_key: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        kind: {type: string, enum: [TASK_OPPORTUNITY, ROUTINE_OPPORTUNITY, AUTOMATION_OPPORTUNITY]}
        reason: {type: string}
        source_refs: {type: array, items: {$ref: '#/components/schemas/PinnedResourceRef'}}
        goal_refs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [goal_id, revision]
            properties:
              goal_id: {type: string}
              revision: {type: integer, minimum: 1}
        proposed_action: {type: string, enum: [TASK, OPEN_ROUTINE_EDITOR, OPEN_AUTOMATION_EDITOR]}
        proposed_by: {$ref: '#/components/schemas/ServiceRef'}
        proposed_task_spec: {oneOf: [{$ref: '#/components/schemas/TaskSpecProposal'}, {type: 'null'}]}
        estimated_cost: {oneOf: [{$ref: '#/components/schemas/UsageQuantity'}, {type: 'null'}]}
        latency_class_hint: {type: [string, 'null'], enum: [STANDARD, INTERACTIVE, DEADLINE_SENSITIVE, null], description: Execution urgency/latency class, not a duration or ETA.}
        status: {type: string, enum: [PROPOSED, ACCEPTED, DISMISSED, EXPIRED]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        snoozed_until: {type: [string, 'null'], format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        resolved_by: {oneOf: [{$ref: '#/components/schemas/PrincipalRef'}, {type: 'null'}]}
        resolution_reason: {type: [string, 'null'], enum: [ACCEPTED_BY_OWNER, DISMISSED_BY_OWNER, MUTED_KIND, SYSTEM_EXPIRY, null]}
        result_task_id: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
      allOf:
      - if:
          properties: {status: {const: PROPOSED}}
          required: [status]
        then:
          properties:
            resolved_at: {type: 'null'}
            resolved_by: {type: 'null'}
            resolution_reason: {type: 'null'}
            result_task_id: {type: 'null'}
      - if:
          properties: {status: {enum: [ACCEPTED, DISMISSED, EXPIRED]}}
          required: [status]
        then:
          properties:
            resolved_at: {type: string, format: date-time}
            resolved_by: {$ref: '#/components/schemas/PrincipalRef'}
            resolution_reason: {type: string, enum: [ACCEPTED_BY_OWNER, DISMISSED_BY_OWNER, MUTED_KIND, SYSTEM_EXPIRY]}
            snoozed_until: {type: 'null'}
      - if:
          properties:
            status: {const: ACCEPTED}
            proposed_action: {const: TASK}
          required: [status, proposed_action]
        then:
          properties: {result_task_id: {type: string, minLength: 1}}
    ResolveSuggestionRequest:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution: {type: string, enum: [ACCEPTED, DISMISSED]}
    SnoozeSuggestionRequest:
      type: object
      additionalProperties: false
      required: [snoozed_until]
      properties:
        snoozed_until: {type: [string, 'null'], format: date-time}
    SuggestionPreference:
      type: object
      additionalProperties: false
      required: [workspace_id, kind, muted, updated_at, version]
      properties:
        workspace_id: {type: string}
        kind: {type: string, enum: [TASK_OPPORTUNITY, ROUTINE_OPPORTUNITY, AUTOMATION_OPPORTUNITY]}
        muted: {type: boolean}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 0}
    SuggestionPreferencePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SuggestionPreference'}}
    SetSuggestionPreferenceRequest:
      type: object
      additionalProperties: false
      required: [muted]
      properties:
        muted: {type: boolean}
    SuggestionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Suggestion'}}
        next_cursor: {type: [string, 'null']}
    StartDemonstrationRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, environment_id, consent_semantic_capture, capture_policy]
      properties:
        workspace_id: {type: string}
        environment_id: {type: string}
        consent_semantic_capture: {const: true}
        capture_policy: {$ref: '#/components/schemas/DemonstrationCapturePolicy'}
    DemonstrationCapturePolicy:
      type: object
      additionalProperties: false
      required: [max_duration_ms, max_actions, max_trace_bytes, allowed_environment_class, sensitive_region_policy]
      properties:
        max_duration_ms: {type: integer, minimum: 1, maximum: 1800000}
        max_actions: {type: integer, minimum: 1, maximum: 1000}
        max_trace_bytes: {type: integer, minimum: 1, maximum: 5242880}
        allowed_environment_class: {type: string, enum: [BROWSER, DESKTOP]}
        sensitive_region_policy: {type: string, enum: [PAUSE_ON_DETECTION, OMIT_SENSITIVE_FIELDS]}
    DemonstrationSession:
      type: object
      additionalProperties: false
      required: [demonstration_session_id, workspace_id, environment_id, status, capture_policy, captured_action_count, captured_trace_bytes, started_at, completed_at, trace_resource_id, skill_proposal_id, version]
      properties:
        demonstration_session_id: {type: string}
        workspace_id: {type: string}
        environment_id: {type: string}
        status: {type: string, enum: [CREATED, CAPTURING, PAUSED, REVIEW, CONVERTED, ABORTED]}
        capture_policy: {$ref: '#/components/schemas/DemonstrationCapturePolicy'}
        captured_action_count: {type: integer, minimum: 0}
        captured_trace_bytes: {type: integer, minimum: 0}
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        trace_resource_id: {type: [string, 'null']}
        skill_proposal_id: {type: [string, 'null']}
        version: {type: integer, minimum: 1}
    ApiError:
      type: object
      required: [code, message, retryable, correlation_id]
      properties:
        code: {$ref: ./error-codes.schema.json}
        message: {type: string}
        retryable: {type: boolean}
        correlation_id: {type: string}
        details: {type: [object, 'null']}
