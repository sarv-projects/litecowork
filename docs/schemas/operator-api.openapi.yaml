      properties:
        runtime_id: {type: string}
        runtime_incarnation_id: {type: string}
        observed_at: {type: string, format: date-time}
        dependent_task_ids: {type: array, items: {type: string}}
        dependent_automation_ids: {type: array, items: {type: string}}
        workspace_root_ids: {type: array, items: {type: string}}
        shared_service_refs: {type: array, items: {type: string}}
        eligible_handoff_task_ids: {type: array, items: {type: string}}
        blockers: {type: array, items: {$ref: '#/components/schemas/Blocker'}}
    StopRuntimeRequest:
      type: object
      additionalProperties: false
      required: [drain_choice, expected_incarnation_id]
      properties:
        drain_choice: {type: string, enum: [CANCEL, HANDOFF_ELIGIBLE, STOP_ANYWAY]}
        expected_incarnation_id: {type: string, minLength: 1}
    RuntimeDrainReceipt:
      type: object
      required: [runtime_id, runtime_incarnation_id, accepted, affected_task_ids, affected_automation_ids, blockers]
      properties:
        runtime_id: {type: string}
        runtime_incarnation_id: {type: string}
        accepted: {type: boolean}
        affected_task_ids: {type: array, items: {type: string}}
        affected_automation_ids: {type: array, items: {type: string}}
        blockers: {type: array, items: {$ref: '#/components/schemas/Blocker'}}
    RuntimeDescriptor:
      type: object
      required:
      - runtime_id
      - workspace_id
      - device_identity
      - runtime_version
      - platform
      - architecture
      - roles
      - trust_zone
      - availability
      - offers
      - resource_capacity
      - last_seen
      - version
      properties:
        runtime_id: {type: string}
        workspace_id: {type: string}
        device_identity:
          type: object
          required: [device_id, public_key, key_version, issued_at]
          properties:
            device_id: {type: string}
            public_key: {type: string}
            key_version: {type: integer, minimum: 1}
            issued_at: {type: string, format: date-time}
            display_name: {type: [string, 'null']}
        runtime_version: {type: string}
        platform: {type: string}
        architecture: {type: string}
        roles:
          type: array
          uniqueItems: true
          items: {type: string, enum: [WORKSPACE_HUB, EXECUTOR, RESOURCE_NODE, CHANNEL_HOST, TRIGGER_HOST, OPERATOR_ENDPOINT]}
        trust_zone: {type: string}
        startup_policy: {type: string, enum: [MANUAL, LOGIN_BACKGROUND, ALWAYS_ON_SERVICE]}
        current_incarnation: {oneOf: [{$ref: '#/components/schemas/RuntimeIncarnation'}, {type: 'null'}]}
        availability: {type: string, enum: [PAIRING, STARTING, RECOVERING, ONLINE, DEGRADED, DRAINING, OFFLINE, REVOKED]}
        offers:
          type: array
          items: {$ref: '#/components/schemas/RuntimeOffer'}
        resource_capacity: {type: object, additionalProperties: true}
        last_seen: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    RuntimePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
