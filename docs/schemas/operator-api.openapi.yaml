        quality_floor: {type: [array, 'null'], items: {$ref: '#/components/schemas/AcceptanceCriterion'}}
        max_concurrency: {type: integer, minimum: 1, maximum: 8}
        max_host_delegation_depth: {type: integer, minimum: 0, maximum: 2}
        budget_ceiling: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        latency_class: {type: string, enum: [STANDARD, INTERACTIVE, DEADLINE_SENSITIVE]}
        environment_policy: {$ref: '#/components/schemas/DelegatedEnvironmentPolicy'}
        native_delegation_policy: {type: string, enum: [INHERIT, ALLOW, DENY_IF_SUPPORTED]}
        warm_policy: {$ref: '#/components/schemas/WarmPolicy'}
        authored_by: {$ref: '#/components/schemas/PrincipalRef'}
        created_at: {type: string, format: date-time}
      allOf:
      - if:
          properties: {session_options: {minProperties: 1}}
          required: [session_options]
        then:
          properties: {session_options_descriptor_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}}
      - if:
