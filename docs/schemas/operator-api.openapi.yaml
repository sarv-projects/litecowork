      required: [message, rich_presentation, linked_items]
      properties:
        message: {$ref: '#/components/schemas/ConversationMessage'}
        rich_presentation: {oneOf: [{$ref: '#/components/schemas/RichPresentationRef'}, {type: 'null'}]}
        linked_items:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/PresentationItem'}
    PresentationItem:
      type: object
      additionalProperties: false
      required: [item_key, kind, payload_version, source_refs, order_key, freshness, payload]
      properties:
        item_key: {type: string, minLength: 1}
        kind: {type: string, enum: [TEXT, ACTIVITY, TASK_CARD, USER_REQUEST, APPROVAL, ARTIFACT, CITATION, CODE, DIFF, TABLE, CHART, IMAGE, BROWSER, TERMINAL, MCP_APP, ERROR]}
        payload_version: {type: integer, minimum: 1}
        source_refs: {type: array, items: {type: object, additionalProperties: true}}
        occurred_at: {type: [string, 'null'], format: date-time}
        order_key: {type: string, minLength: 1}
        status: {type: [string, 'null'], enum: [IN_PROGRESS, WAITING, NEEDS_USER, COMPLETE, INCOMPLETE, FAILED, UNAVAILABLE, UNKNOWN, null]}
        label: {type: [string, 'null']}
        freshness: {type: string, enum: [CURRENT, STALE, UNKNOWN]}
        payload: {type: object}
    ConversationPresentationSnapshot:
      type: object
      additionalProperties: false
      required: [workspace_id, conversation_id, projection_revision, stream_cursor, items, active_turn]
      properties:
        workspace_id: {type: string, minLength: 1}
        conversation_id: {type: string, minLength: 1}
        projection_revision: {type: integer, minimum: 1}
        stream_cursor: {type: string, minLength: 1}
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ConversationPresentationMessage'}
        next_cursor: {type: [string, 'null']}
        active_turn: {oneOf: [{$ref: '#/components/schemas/ConversationTurnPresentation'}, {type: 'null'}]}
    ConversationTurnPresentation:
      type: object
      additionalProperties: false
      required: [turn_id, status, retry_ordinal, presentation_preference]
      properties:
        turn_id: {type: string, minLength: 1}
        status: {type: string, enum: [OPEN, RUNNING, WAITING_USER, WAITING_DEPENDENCY, CANCEL_REQUESTED]}
        retry_ordinal: {type: integer, minimum: 0}
        presentation_preference: {type: string, enum: [AUTO, SIMPLE, RICH]}
    RichPresentationDocumentResponse:
      type: object
      additionalProperties: false
      required: [workspace_id, conversation_id, message_id, presentation_id, schema_version, renderer_contract_version, semantic_content_digest, document_digest, document_size_bytes, document]
      properties:
        workspace_id: {type: string, minLength: 1}
        conversation_id: {type: string, minLength: 1}
        message_id: {type: string, minLength: 1}
        presentation_id: {type: string, minLength: 1}
        schema_version: {type: integer, const: 1}
        renderer_contract_version: {type: integer, minimum: 1}
        semantic_content_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        document_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        document_size_bytes: {type: integer, minimum: 1, maximum: 1048576}
        document: {type: object, description: 'Must validate against docs/schemas/rich-presentation.schema.json before rendering.'}
    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ConversationMessage'}
        next_cursor: {type: [string, 'null']}
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, objective]
      properties:
        workspace_id: {type: string}
        conversation_id: {type: [string, 'null']}
        source_message_refs:
          type: array
          items: {type: string}
        objective: {type: string, minLength: 1}
        task_category: {type: [string, 'null'], enum: [SOFTWARE_ENGINEERING, RESEARCH, WRITING, DATA_ANALYSIS, OFFICE, BROWSER, PERSONAL_ADMIN, OTHER, null]}
        constraints:
          type: array
          items: {type: string}
        non_goals:
          type: array
          items: {type: string}
        input_refs:
          type: array
          items: {$ref: '#/components/schemas/PinnedResourceRef'}
        required_outputs:
          type: array
          items: {$ref: '#/components/schemas/OutputRequirement'}
        acceptance_criteria:
          type: array
          items: {$ref: '#/components/schemas/AcceptanceCriterion'}
        approvals_required:
          type: array
          items: {$ref: '#/components/schemas/ApprovalRequirement'}
        budget:
          oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]
        delegation_budget_policy: {oneOf: [{$ref: '#/components/schemas/DelegationBudgetPolicy'}, {type: 'null'}]}
        lead_failover_policy: {$ref: '#/components/schemas/LeadFailoverPolicy', description: Optional on create; omission resolves Coworker default or explicit DISABLED. Null is not accepted.}
        deadline: {type: [string, 'null'], format: date-time}
        placement_preference: {$ref: '#/components/schemas/PlacementPreference'}
        preferred_lead_agent_binding_id: {type: [string, 'null']}
        coworker_id: {type: [string, 'null'], description: Explicit Task origin selection; if omitted, no Coworker origin is used. The Operator may prefill the Workspace primary Coworker ID.}
        expected_coworker_version: {type: [integer, 'null'], minimum: 1, description: Optional optimistic check for the selected Coworker head; the service pins its current revision.}
      allOf:
      - if:
          properties: {expected_coworker_version: {type: integer}}
          required: [expected_coworker_version]
        then: {properties: {coworker_id: {type: string, minLength: 1}}}
    ReviseTaskSpecRequest:
      type: object
      additionalProperties: false
      required: [parent_revisions, objective]
      properties:
        parent_revisions:
          type: array
          minItems: 0
          items: {type: integer, minimum: 1}
        objective: {type: string, minLength: 1}
        constraints:
          type: array
          items: {type: string}
        non_goals:
          type: array
          items: {type: string}
        input_refs:
          type: array
          items: {$ref: '#/components/schemas/PinnedResourceRef'}
        required_outputs:
          type: array
          items: {$ref: '#/components/schemas/OutputRequirement'}
        acceptance_criteria:
          type: array
          items: {$ref: '#/components/schemas/AcceptanceCriterion'}
        approvals_required:
          type: array
          items: {$ref: '#/components/schemas/ApprovalRequirement'}
        placement_preference: {$ref: '#/components/schemas/PlacementPreference'}
        preferred_lead_agent_binding_id: {type: [string, 'null']}
        lead_failover_policy: {$ref: '#/components/schemas/LeadFailoverPolicy', description: Optional; omission inherits the current TaskSpec policy.}
    TaskSpecRevision:
      type: object
      required:
      - task_id
      - revision
      - parent_revisions
      - objective
      - constraints
      - non_goals
      - required_outputs
      - acceptance_criteria
      - approvals_required
      - input_refs
      - placement_preference
      - lead_failover_policy
      - authored_by
      - created_at
      properties:
        task_id: {type: string}
        revision: {type: integer, minimum: 1}
        parent_revisions:
          type: array
          items: {type: integer, minimum: 1}
        objective: {type: string}
        task_category: {type: [string, 'null'], enum: [SOFTWARE_ENGINEERING, RESEARCH, WRITING, DATA_ANALYSIS, OFFICE, BROWSER, PERSONAL_ADMIN, OTHER, null]}
        constraints:
          type: array
          items: {type: string}
        non_goals:
          type: array
          items: {type: string}
        required_outputs:
          type: array
          items: {$ref: '#/components/schemas/OutputRequirement'}
        acceptance_criteria:
          type: array
          items: {$ref: '#/components/schemas/AcceptanceCriterion'}
        approvals_required:
          type: array
          items: {$ref: '#/components/schemas/ApprovalRequirement'}
        input_refs:
          type: array
          items: {$ref: '#/components/schemas/PinnedResourceRef'}
        workspace_instruction_revision: {type: [integer, 'null'], minimum: 1}
        budget:
          oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]
        delegation_budget_policy: {oneOf: [{$ref: '#/components/schemas/DelegationBudgetPolicy'}, {type: 'null'}]}
        deadline: {type: [string, 'null'], format: date-time}
        source_message_refs:
          type: array
          items: {type: string}
        placement_preference: {$ref: '#/components/schemas/PlacementPreference'}
        preferred_lead_agent_binding_id: {type: [string, 'null']}
        lead_failover_policy: {$ref: '#/components/schemas/LeadFailoverPolicy'}
        authored_by: {$ref: '#/components/schemas/PrincipalRef'}
        created_at: {type: string, format: date-time}
    Task:
      type: object
      required: [task_id, workspace_id, origin_coworker_id, origin_coworker_revision, lead_agent_binding_id, blocking_conditions, priority, created_by, current_spec_revision, status, version, created_at, updated_at]
      properties:
        task_id: {type: string}
        workspace_id: {type: string}
        conversation_id: {type: [string, 'null']}
        routine_id: {type: [string, 'null']}
        routine_revision: {type: [integer, 'null'], minimum: 1}
        automation_id: {type: [string, 'null']}
        automation_occurrence_id: {type: [string, 'null']}
        origin_coworker_id: {type: [string, 'null']}
        origin_coworker_revision: {type: [integer, 'null'], minimum: 1}
        lead_agent_binding_id: {type: string, minLength: 1}
        blocking_conditions:
          type: array
          items: {$ref: '#/components/schemas/Blocker'}
        priority: {type: string, enum: [LOW, NORMAL, HIGH]}
        created_by: {$ref: '#/components/schemas/PrincipalRef'}
        current_spec_revision: {type: integer, minimum: 1}
        current_plan_revision: {type: [integer, 'null'], minimum: 1}
        resume_status: {type: [string, 'null'], enum: [READY, RUNNING, WAITING_USER, BLOCKED, VERIFYING, null]}
        status:
          type: string
          enum:
          - READY
          - RUNNING
          - WAITING_USER
          - BLOCKED
          - VERIFYING
          - NEEDS_USER
          - INCOMPLETE
          - PAUSE_REQUESTED
          - PAUSED
          - COMPLETED
          - FAILED
          - CANCEL_REQUESTED
          - CANCELLED
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
      allOf:
      - if:
          properties: {origin_coworker_id: {type: string}}
          required: [origin_coworker_id]
        then: {properties: {origin_coworker_revision: {type: integer, minimum: 1}}}
      - if:
          properties: {origin_coworker_revision: {type: integer}}
          required: [origin_coworker_revision]
        then: {properties: {origin_coworker_id: {type: string, minLength: 1}}}
      - if:
          properties: {routine_id: {type: string}}
          required: [routine_id]
        then: {properties: {routine_revision: {type: integer, minimum: 1}}}
      - if:
          properties: {routine_revision: {type: integer}}
          required: [routine_revision]
        then: {properties: {routine_id: {type: string, minLength: 1}}}
    TaskView:
      type: object
      additionalProperties: false
      required: [task, current_spec_revision]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        current_spec_revision: {$ref: '#/components/schemas/TaskSpecRevision'}
    TaskPlanningReadiness:
      type: object
      additionalProperties: false
      required: [task_id, task_version, task_spec_revision, task_status, observed_at, dispatch_available, planning_started, agent_session_started, plan_created, blockers]
      properties:
        task_id: {type: string, minLength: 1}
        task_version: {type: integer, minimum: 1}
        task_spec_revision: {type: integer, minimum: 1}
        task_status: {type: string, enum: [READY, RUNNING, WAITING_USER, BLOCKED, VERIFYING, NEEDS_USER, INCOMPLETE, PAUSE_REQUESTED, PAUSED, COMPLETED, FAILED, CANCEL_REQUESTED, CANCELLED]}
        observed_at: {type: string, format: date-time}
        dispatch_available: {type: boolean, const: false}
        planning_started: {type: boolean, const: false}
        agent_session_started: {type: boolean, const: false}
        plan_created: {type: boolean, const: false}
        blockers:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            enum: [TASK_STATE_NOT_ELIGIBLE, PLAN_ALREADY_ACCEPTED, CURRENT_LEAD_OR_ENDPOINT_UNAVAILABLE, TASK_ISOLATION_UNAVAILABLE, NATIVE_CAPABILITIES_UNMEDIATED, PROTOCOL_UNQUALIFIED, PROCESS_CONTAINMENT_UNQUALIFIED, PLANNING_CONTEXT_RESOURCE_UNAVAILABLE, SESSION_SETTLEMENT_UNAVAILABLE, PROVIDER_UNSUPPORTED]
    TaskPresentationSnapshot:
      type: object
      additionalProperties: false
      required: [workspace_id, task_id, computed_at, freshness, items]
      properties:
        workspace_id: {type: string, minLength: 1}
        task_id: {type: string, minLength: 1}
        computed_at: {type: string, format: date-time}
        freshness: {type: string, enum: [CURRENT, STALE, UNKNOWN]}
        items:
          type: array
          maxItems: 301
          items: {$ref: '#/components/schemas/TaskPresentationItem'}
    TaskPresentationItem:
      type: object
      additionalProperties: false
      required: [item_key, kind, payload_version, source_refs, order_key, status, payload, freshness]
      properties:
        item_key: {type: string, minLength: 1, maxLength: 256}
        kind: {type: string, enum: [TASK_CARD, ACTIVITY, ARTIFACT]}
        payload_version: {type: integer, const: 1}
        source_refs:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [kind, id]
            properties:
              kind: {type: string, enum: [TASK, STEP, ARTIFACT_VERSION, RESOURCE_REVISION]}
              id: {type: string, minLength: 1, maxLength: 256}
              revision: {type: string, maxLength: 128}
        occurred_at: {type: [string, 'null'], format: date-time}
        order_key: {type: string, minLength: 1, maxLength: 512}
        status: {type: string, enum: [IN_PROGRESS, WAITING, NEEDS_USER, COMPLETE, INCOMPLETE, FAILED, UNAVAILABLE, UNKNOWN]}
        label: {type: [string, 'null'], maxLength: 512}
        payload:
          oneOf:
          - type: object
            additionalProperties: false
            required: [task_id, objective, status]
            properties:
              task_id: {type: string, minLength: 1}
              objective: {type: string, maxLength: 32768}
              status: {type: string, maxLength: 64}
              step_summary: {type: string, maxLength: 2048}
          - type: object
            additionalProperties: false
            required: [summary]
            properties:
              summary: {type: string, maxLength: 2048}
              detail: {type: string, maxLength: 8192}
          - type: object
            additionalProperties: false
            required: [artifact_id, version, display_name, artifact_kind]
            properties:
              artifact_id: {type: string, minLength: 1}
              version: {type: integer, minimum: 1}
              display_name: {type: string, maxLength: 512}
              artifact_kind: {type: string, maxLength: 128}
              verification_status: {type: string, maxLength: 64}
        freshness: {type: string, enum: [CURRENT, STALE, UNKNOWN]}
    TaskSummary:
      type: object
      additionalProperties: false
      required: [task_id, status, objective, created_at, updated_at]
      properties:
        task_id: {type: string, minLength: 1}
        status: {type: string, enum: [READY, RUNNING, WAITING_USER, BLOCKED, VERIFYING, NEEDS_USER, INCOMPLETE, PAUSE_REQUESTED, PAUSED, COMPLETED, FAILED, CANCEL_REQUESTED, CANCELLED]}
        objective: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TaskWorkstreamProjection:
      type: object
      additionalProperties: false
      required: [step_id, title, step_status, active_attempt_ids, worker_labels, last_activity_at]
      properties:
        step_id: {type: string}
        title: {type: string}
        step_status: {type: string, enum: [PENDING, READY, RUNNING, WAITING_USER, BLOCKED, VERIFYING, COMPLETED, FAILED, CANCEL_REQUESTED, CANCELLED, SUPERSEDED]}
        active_attempt_ids: {type: array, uniqueItems: true, items: {type: string}}
        worker_labels: {type: array, items: {type: string}}
        last_activity_at: {type: [string, 'null'], format: date-time}
    TaskProgressProjection:
      type: object
      additionalProperties: false
      required: [task_id, computed_at, last_activity_at, last_activity_source, last_evidence_at, activity_summary, active_workstreams, blockers, newest_artifact]
      properties:
        task_id: {type: string}
        computed_at: {type: string, format: date-time}
        last_activity_at: {type: [string, 'null'], format: date-time}
        last_activity_source: {type: [string, 'null'], enum: [TASK_EVENT, STEP_EVENT, ATTEMPT_EVENT, CAPABILITY_INVOCATION, PROVIDER_PROGRESS, ENVIRONMENT_OBSERVATION, null]}
        last_evidence_at: {type: [string, 'null'], format: date-time}
        activity_summary: {type: [string, 'null'], maxLength: 500}
        active_workstreams: {type: array, items: {$ref: '#/components/schemas/TaskWorkstreamProjection'}}
        blockers: {type: array, items: {$ref: '#/components/schemas/Blocker'}}
        newest_artifact: {oneOf: [{$ref: '#/components/schemas/ArtifactVersionRef'}, {type: 'null'}]}
    TaskPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TaskSummary'}
        next_cursor: {type: [string, 'null']}
    Blocker:
      type: object
      additionalProperties: false
      required: [blocker_id, code, safe_message, resolution_hint, created_at]
      properties:
        blocker_id: {type: string, minLength: 1}
        code: {$ref: '#/components/schemas/ErrorCode'}
        safe_message: {type: string, minLength: 1}
        subject_ref:
          oneOf: [{$ref: '#/components/schemas/ResourceRef'}, {$ref: '#/components/schemas/ServiceRef'}, {type: 'null'}]
        resolution_hint: {type: string, minLength: 1}
        user_request_id: {type: [string, 'null']}
        approval_id: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    SteerTaskRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: {type: string, minLength: 1}
        classification: {type: string, enum: [CHAT_ONLY, TASK_SPEC_CHANGE, PLAN_HINT, URGENT_INTERRUPT, CANCEL]}
    ChangeLeadAgentRequest:
      type: object
      additionalProperties: false
      required: [agent_binding_id]
      properties:
        agent_binding_id: {type: string, minLength: 1}
    PauseTaskRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: [string, 'null']}
    RecoverStepRequest:
      type: object
      additionalProperties: false
      required: [expected_step_version, recovery_reason]
      properties:
        expected_step_version: {type: integer, minimum: 1}
        recovery_reason: {type: string, minLength: 1}
        placement_override:
          oneOf:
          - type: object
            additionalProperties: false
            required: [candidate_id, plan_digest]
            properties:
              candidate_id: {type: string, minLength: 1}
              plan_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
          - type: 'null'
    SubmitConversationTurnRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/MessageContentBlock'}
        resource_refs:
          type: array
          items: {$ref: '#/components/schemas/ResourceRef'}
        agent_binding_id: {type: [string, 'null']}
        presentation_preference: {type: string, enum: [AUTO, SIMPLE, RICH], default: AUTO}
    ConversationTurnReceipt:
      type: object
      required: [turn_id, conversation_id, user_message_id, status, accepted_at, correlation_id, presentation_preference]
      properties:
        turn_id: {type: string}
        conversation_id: {type: string}
        user_message_id: {type: string}
        status: {type: string, enum: [OPEN, RUNNING, WAITING_USER, WAITING_DEPENDENCY, COMPLETED, FAILED, CANCEL_REQUESTED, CANCELLED]}
        accepted_at: {type: string, format: date-time}
        correlation_id: {type: string}
        presentation_preference: {type: string, enum: [AUTO, SIMPLE, RICH]}
    TimelinePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TimelineEntry'}
        next_cursor: {type: [string, 'null']}
    ResolveApprovalRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [APPROVE, DENY]}
        confirmation_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
    Approval:
      type: object
      required: [approval_id, task_id, kind, action_summary, target_ref, scope_digest, action_digest, risk, required_assurance, status, requested_at, version]
      properties:
        approval_id: {type: string}
        task_id: {type: string}
        requested_by_attempt: {type: [string, 'null']}
        kind: {type: string}
        action_summary: {type: string}
        target_ref: {$ref: '#/components/schemas/ResourceRef'}
        scope_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        action_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        risk: {type: string, enum: [SAFE, SENSITIVE, HIGH_IMPACT]}
        required_assurance: {type: string}
        status: {type: string, enum: [PENDING, APPROVED, DENIED, EXPIRED, CANCELLED]}
        requested_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        resolved_by:
          oneOf: [{$ref: '#/components/schemas/PrincipalRef'}, {type: 'null'}]
        resolved_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    Artifact:
      type: object
      required: [artifact_id, workspace_id, resource_id, kind, display_name, current_version, library_status, created_at, version]
      properties:
        artifact_id: {type: string}
        workspace_id: {type: string}
        resource_id: {type: string}
        task_id: {type: [string, 'null']}
        kind: {type: string}
        display_name: {type: string}
        current_version: {type: integer, minimum: 1}
        library_status: {type: string, enum: [TRANSIENT, SAVED, ARCHIVED]}
        created_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    ArtifactVersion:
      type: object
      required: [artifact_id, version, resource_revision_id, input_refs, content, provenance, created_at]
      properties:
        artifact_id: {type: string}
        version: {type: integer, minimum: 1}
        resource_revision_id: {type: string}
        created_by_attempt: {type: [string, 'null']}
        input_refs:
          type: array
          items: {$ref: '#/components/schemas/PinnedResourceRef'}
        content: {$ref: '#/components/schemas/ArtifactContent'}
        provenance: {$ref: '#/components/schemas/ProvenanceRecord'}
        verification_refs:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
    ArtifactVersionRef:
      type: object
      additionalProperties: false
      required: [workspace_id, artifact_id, version]
      properties:
        workspace_id: {type: string, minLength: 1}
        artifact_id: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
    ArtifactContent:
      oneOf: [{$ref: '#/components/schemas/ManagedBlobContent'}, {$ref: '#/components/schemas/ExternalResourceContent'}]
    ManagedBlobContent:
      type: object
      additionalProperties: false
      required: [kind, storage_ref, content_digest, media_type, size_bytes]
      properties:
        kind: {const: MANAGED_BLOB}
        storage_ref: {$ref: '#/components/schemas/BlobRef'}
        content_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        media_type: {type: string}
        size_bytes: {type: integer, minimum: 0}
