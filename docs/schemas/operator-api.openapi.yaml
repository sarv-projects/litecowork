        next_cursor: {type: [string, 'null']}
    AutomationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Automation'}
        next_cursor: {type: [string, 'null']}
    AutomationRevisionPage:
      type: object
