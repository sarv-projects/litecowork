openapi: 3.1.0
info: {title: LiteCowork Operator API, version: 1.0.0, description: 'User-facing commands and projections. Local IPC maps to these logical contracts; this document does not define Mesh, Agent, Environment, or LiteSPM APIs.'}
servers: [{url: 'https://localhost/v1'}]
security: [{operatorAuth: [], workspaceContext: []}]
tags:
- {name: workspaces}
- {name: conversations}
- {name: tasks}
- {name: approvals}
- {name: artifacts}
- {name: automations}
- {name: routines}
- {name: runtime-lifecycle}
- {name: environments}
- {name: needs-you}
- {name: runtimes}
- {name: agents}
- {name: delegation}
- {name: coworkers}
- {name: goals}
- {name: suggestions}
- {name: demonstrations}
- {name: connections}
- {name: channels}
- {name: discover}
- {name: resources}
- {name: recovery}
- {name: notifications}
paths:
  /agent-installations:
    get:
      tags: [agents]
      operationId: listLocalAgentInstallations
      security: [{operatorAuth: []}]
      responses:
        '200':
          description: Authenticated runtime-local executable inventory; not negotiated readiness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentInstallationPage'}
        default: {$ref: '#/components/responses/Error'}
  /agent-registry:
    get:
      tags: [agents]
      operationId: listAgentRegistry
      security: [{operatorAuth: []}]
      parameters:
      - {name: q, in: query, required: false, schema: {type: string, maxLength: 128}}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Bounded cached ACP/distribution registry metadata. Listing is not installation, authentication, capability, readiness, or Workspace authority.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRegistryPage'}
        default: {$ref: '#/components/responses/Error'}
  /agent-registry/refresh:
    post:
      tags: [agents]
      operationId: refreshAgentRegistry
      security: [{operatorAuth: []}]
      responses:
        '200':
          description: Refresh the bounded registry cache. Untrusted registry metadata never defines executable install/auth commands.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRegistrySnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /agent-registry/{registryAgentId}/install:
    post:
      tags: [agents]
      operationId: installRegistryAgent
      security: [{operatorAuth: []}]
      parameters:
      - {name: registryAgentId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallAgentRequest'}
      responses:
        '202':
          description: Explicit local owner install operation accepted; creates no AgentBinding or work session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentLifecycleOperation'}
        default: {$ref: '#/components/responses/Error'}
  /agent-registry/{registryAgentId}/update:
    post:
      tags: [agents]
      operationId: updateRegistryAgent
      security: [{operatorAuth: []}]
      parameters:
      - {name: registryAgentId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentRequest'}
      responses:
        '202':
          description: Explicit local owner update operation accepted; active sessions remain pinned to their admitted descriptors until they settle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentLifecycleOperation'}
        default: {$ref: '#/components/responses/Error'}
  /operator/readiness:
    get:
      tags: [runtime-lifecycle]
      operationId: getLocalOperatorReadiness
      security: [{operatorAuth: []}]
      responses:
        '200':
          description: Authenticated local API-serving handshake; does not indicate Runtime execution readiness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LocalOperatorReadiness'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      security: [{operatorAuth: []}]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Workspaces owned by the authenticated principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspacePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [workspaces]
      operationId: createWorkspace
      security: [{operatorAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201':
          description: Workspace created
          headers:
            X-Correlation-ID:
              required: true
              schema: {type: string, minLength: 1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}:
    get:
      tags: [workspaces]
      operationId: getWorkspace
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200':
          description: Workspace owned by the authenticated principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [workspaces]
      operationId: updateWorkspacePolicy
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspacePolicyRequest'}
      responses:
        '200':
          description: Policy update applies to future replication transfers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/backups:
    get:
      tags: [workspaces]
      operationId: listWorkspaceBackups
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Integrity-verified immutable Workspace backup manifests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceBackupPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [workspaces]
      operationId: createWorkspaceBackup
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201':
          description: Complete backup verified and immutable manifest published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceBackupManifest'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/backups/{backupId}:
    get:
      tags: [workspaces]
      operationId: getWorkspaceBackup
      parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - name: backupId
        in: path
        required: true
        schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Integrity-verified immutable backup manifest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceBackupManifest'}
        default: {$ref: '#/components/responses/Error'}
  /recovery/backups/{backupId}/restore:
    post:
      tags: [recovery]
      operationId: restoreWorkspaceBackup
      security: [{operatorAuth: []}]
      parameters:
      - name: backupId
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestoreWorkspaceBackupRequest'}
      responses:
        '200':
          description: Backup restored into an empty installation and a new Runtime identity registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RestoreReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/default-agent-binding:
    patch:
      tags: [workspaces]
      operationId: setWorkspaceDefaultAgentBinding
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetWorkspaceDefaultAgentBindingRequest'}
      responses:
        '200':
          description: Default used for newly admitted work
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/archive:
    post:
      tags: [workspaces]
      operationId: archiveWorkspace
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200':
          description: Quiescent Workspace archived and made read-only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/runtime-bindings:
    get:
      tags: [workspaces, runtimes]
      operationId: listWorkspaceRuntimeBindings
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Runtime installations authorized for the selected Workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeWorkspaceBindingPage'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/runtime-bindings/current-local:
    get:
      tags: [workspaces, runtimes]
      operationId: getCurrentLocalRuntimeWorkspaceBinding
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200':
          description: Zero or one active enrollment for the exact current local Runtime incarnation. This endpoint is desktop-local and is not the complete Workspace Runtime-binding inventory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeWorkspaceBindingPage'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/runtime-bindings/local-enrollment:
    post:
      tags: [workspaces, runtimes]
      operationId: enrollLocalRuntimeInWorkspace
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '201':
          description: Local-only RuntimeWorkspaceBinding created; no Mesh pairing implied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeWorkspaceBinding'}
        default: {$ref: '#/components/responses/Error'}
  /workspaces/{workspaceId}/runtime-bindings/{bindingId}/revoke:
    post:
      tags: [workspaces, runtimes]
      operationId: revokeWorkspaceRuntimeBinding
      parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - name: bindingId
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200':
          description: This Runtime's access to this Workspace was revoked. RuntimeMesh first drains/fences its channel hosts; if no eligible replacement exists, it atomically clears the released assignment, and the affected ChannelBinding remains DEGRADED with host_assignment null. Re-fetch affected bindings to observe their new projections; assignment history remains in versioned events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeWorkspaceBinding'}
        default: {$ref: '#/components/responses/Error'}
  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Newest-first owner-scoped Conversation page for the selected Workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationListPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [conversations]
      operationId: createConversation
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversationRequest'}
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}:
    get:
      tags: [conversations]
      operationId: getConversation
      parameters: [{$ref: '#/components/parameters/ConversationId'}]
      responses:
        '200':
          description: Conversation projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/presentation:
    get:
      tags: [conversations, presentation]
      operationId: getConversationPresentation
      parameters:
      - {$ref: '#/components/parameters/ConversationId'}
      - {$ref: '#/components/parameters/Cursor'}
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Bounded authenticated semantic-message snapshot with optional rich-presentation refs and stream cursor
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPresentationSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /rich-presentations/{presentationId}:
    get:
      tags: [conversations, presentation]
      operationId: getRichPresentation
      parameters:
      - name: presentationId
        in: path
        required: true
        schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Exact authorized immutable RichPresentation document; verify digest and message binding before render
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RichPresentationDocumentResponse'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/messages:
    get:
      tags: [conversations]
      operationId: listConversationMessages
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Ordered message page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [conversations]
      operationId: appendConversationMessage
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppendMessageRequest'}
      responses:
        '201':
          description: Message appended
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationMessage'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/tasks:
    get:
      tags: [conversations]
      operationId: listConversationTasks
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Tasks associated with the Conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/turns:
    post:
      tags: [conversations]
      operationId: submitConversationTurn
      parameters: [{$ref: '#/components/parameters/ConversationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitConversationTurnRequest'}
      responses:
        '202':
          description: Durable user turn accepted; agent reply is streamed separately
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationTurnReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/turns/{turnId}/retry:
    post:
      tags: [conversations]
      operationId: retryConversationTurn
      parameters:
      - {$ref: '#/components/parameters/ConversationId'}
      - name: turnId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '202':
          description: Failed turn retried in a new Conversation AgentSession
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationTurnReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{conversationId}/turns/{turnId}/cancel:
    post:
      tags: [conversations]
      operationId: cancelConversationTurn
      parameters:
      - {$ref: '#/components/parameters/ConversationId'}
      - name: turnId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '202':
          description: Turn cancellation requested; response confirms after stop or a racing terminal outcome
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationTurnReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [READY, RUNNING, WAITING_USER, BLOCKED, VERIFYING, NEEDS_USER, INCOMPLETE, PAUSE_REQUESTED, PAUSED, COMPLETED, FAILED, CANCEL_REQUESTED, CANCELLED]
      - name: conversation_id
        in: query
        schema: {type: string}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Task summary page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [tasks]
      operationId: createTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaskRequest'}
      responses:
        '201':
          description: Task and initial TaskSpecRevision committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskView'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}:
    get:
      tags: [tasks]
      operationId: getTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Current Task projection and pinned current TaskSpecRevision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskView'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/planning-readiness:
    get:
      tags: [tasks]
      operationId: getTaskPlanningReadiness
      description: Read-only local preflight projection. It does not start planning, create a session/plan/Step/Attempt/lease, invoke a provider, or mutate Task state. The response never contains a planning packet, objective text, provider handles, or endpoint identifiers.
      parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200':
          description: Sanitized readiness blockers observed for this Task version; dispatch remains unavailable in this desktop slice
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPlanningReadiness'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/presentation:
    get:
      tags: [tasks, presentation]
      operationId: getTaskPresentation
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Bounded read-only snapshot of committed Task/current spec, current-plan Steps, Task Artifacts, and resolvable current ArtifactVersions read in one SQLite transaction. Caps are 100 Steps and 200 Artifacts; over-cap sources return an error without a partial snapshot. CURRENT freshness means only one consistent SQLite snapshot, not worker liveness, progress, verification, or external-provider freshness. Unresolvable ArtifactVersions are omitted.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskPresentationSnapshot'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/progress:
    get:
      tags: [tasks]
      operationId: getTaskProgress
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200':
          description: Rebuildable factual progress projection; no synthetic percentage or ETA
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskProgressProjection'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/steps/{stepId}/execution-dependencies:
    get:
      tags: [tasks]
      operationId: getStepExecutionDependencies
      parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - name: stepId
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Short-lived placement and prerequisite preview; starts no workers or providers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionDependencyPlan'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/steer:
    post:
      tags: [tasks]
      operationId: steerTask
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SteerTaskRequest'}
      responses:
        '202':
          description: Steering accepted for Task Runtime processing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/lead-agent:
    post:
      tags: [tasks]
      operationId: changeTaskLeadAgent
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeLeadAgentRequest'}
      responses:
        '202':
          description: Lead replacement accepted; active Attempts drain under lease and Effect rules
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '202':
          description: Cancellation requested; Task may remain stopping while Attempts, provider Invocations, VerificationRuns, pending Task-scoped UserRequests/Approvals, and Effects settle. Cancellation is valid from PAUSED and supersedes PAUSE_REQUESTED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/pause:
    post:
      tags: [tasks]
      operationId: pauseTask
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PauseTaskRequest'}
      responses:
        '202':
          description: Pause coordination accepted; Task remains PAUSE_REQUESTED until checkpoint, provider Invocation and VerificationRun settlement, Effect reconciliation, and lease settlement finish
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/resume:
    post:
      tags: [tasks]
      operationId: resumeTask
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '202':
          description: Resume accepted after input, policy, and Effect revalidation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/steps/{stepId}/recover:
    post:
      tags: [tasks]
      operationId: recoverTaskStep
      parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - name: stepId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
