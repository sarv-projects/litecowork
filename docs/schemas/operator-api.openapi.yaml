      required: [subject_ref, state, observed_at, reason_code]
      properties:
        subject_ref:
          oneOf: [{$ref: '#/components/schemas/ResourceRef'}, {$ref: '#/components/schemas/CapabilityRef'}]
        state: {type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN]}
        observed_at: {type: [string, 'null'], format: date-time}
        reason_code: {type: [string, 'null']}
    RoutineHealth:
      type: object
      additionalProperties: false
      required: [routine_id, current_revision, last_run_at, last_success_at, recent_success_rate, sample_size, average_duration_ms, observed_costs, required_dependency_health, drift_state, drift_evidence_refs]
      properties:
        routine_id: {type: string}
        current_revision: {type: integer, minimum: 1}
        last_run_at: {type: [string, 'null'], format: date-time}
        last_success_at: {type: [string, 'null'], format: date-time}
        recent_success_rate: {type: [number, 'null'], minimum: 0, maximum: 1}
        sample_size: {type: integer, minimum: 0}
        average_duration_ms: {type: [integer, 'null'], minimum: 0}
        observed_costs: {type: array, items: {$ref: '#/components/schemas/UsageQuantity'}}
        required_dependency_health: {type: array, items: {$ref: '#/components/schemas/DependencyHealth'}}
        drift_state: {type: string, enum: [HEALTHY, WARNING, DRIFTED, UNKNOWN]}
        drift_evidence_refs: {type: array, items: {type: string}}
    RoutineRevision:
      type: object
      required: [routine_id, revision, objective_template, instructions, input_schema, constraints, non_goals, required_outputs, acceptance_criteria, approvals_required, input_bindings, required_capabilities, placement_preference, verification_policy, authored_by, created_at]
      properties:
        routine_id: {type: string}
        revision: {type: integer, minimum: 1}
        objective_template: {type: string, minLength: 1}
        instructions: {type: string}
        input_schema: {type: object, additionalProperties: true}
        constraints: {type: array, items: {type: string}}
        non_goals: {type: array, items: {type: string}}
        required_outputs: {type: array, items: {$ref: '#/components/schemas/OutputRequirement'}}
        acceptance_criteria: {type: array, items: {$ref: '#/components/schemas/AcceptanceCriterion'}}
        approvals_required: {type: array, items: {$ref: '#/components/schemas/ApprovalRequirement'}}
        input_bindings: {type: array, items: {$ref: '#/components/schemas/TaskInputBinding'}}
        required_capabilities: {type: array, items: {$ref: '#/components/schemas/CapabilityRequirement'}}
        preferred_agent_binding_id: {type: [string, 'null']}
        placement_preference: {$ref: '#/components/schemas/PlacementPreference'}
        budget_ceiling: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        verification_policy: {type: object, additionalProperties: true}
        authored_by: {$ref: '#/components/schemas/PrincipalRef'}
        created_at: {type: string, format: date-time}
    RoutineRevisionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RoutineRevision'}}
        next_cursor: {type: [string, 'null']}
    CreateRoutineRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, name, revision]
      properties:
        workspace_id: {type: string}
        name: {type: string, minLength: 1}
        revision: {$ref: '#/components/schemas/RoutineRevisionInput'}
    CreateRoutineRevisionRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {$ref: '#/components/schemas/RoutineRevisionInput'}
    RoutineRevisionInput:
      type: object
      additionalProperties: false
      required: [objective_template, instructions, input_schema, constraints, non_goals, required_outputs, acceptance_criteria, approvals_required, input_bindings, required_capabilities, placement_preference, verification_policy]
      properties:
        objective_template: {type: string, minLength: 1}
        instructions: {type: string}
        input_schema: {type: object, additionalProperties: true}
        constraints: {type: array, items: {type: string}}
        non_goals: {type: array, items: {type: string}}
        required_outputs: {type: array, items: {$ref: '#/components/schemas/OutputRequirement'}}
        acceptance_criteria: {type: array, items: {$ref: '#/components/schemas/AcceptanceCriterion'}}
        approvals_required: {type: array, items: {$ref: '#/components/schemas/ApprovalRequirement'}}
        input_bindings: {type: array, items: {$ref: '#/components/schemas/TaskInputBinding'}}
        required_capabilities: {type: array, items: {$ref: '#/components/schemas/CapabilityRequirement'}}
        preferred_agent_binding_id: {type: [string, 'null']}
        placement_preference: {$ref: '#/components/schemas/PlacementPreference'}
        budget_ceiling: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        verification_policy: {type: object, additionalProperties: true}
    RunRoutineRequest:
      type: object
      additionalProperties: false
      required: [routine_revision, inputs]
      properties:
        routine_revision: {type: integer, minimum: 1}
        inputs: {type: object, additionalProperties: true}
        conversation_id: {type: [string, 'null']}
    TriggerSpec:
      type: object
      additionalProperties: false
      required: [trigger_id, placement, trigger]
      properties:
        trigger_id: {type: string, minLength: 1}
        placement: {type: string, enum: [HUB, SPECIFIC_RUNTIME, AUTO]}
        runtime_id: {type: [string, 'null']}
        trigger: {$ref: '#/components/schemas/TriggerDefinition'}
      allOf:
      - if:
          properties:
            placement: {const: SPECIFIC_RUNTIME}
          required: [placement]
        then:
          required: [runtime_id]
          properties:
            runtime_id: {type: string, minLength: 1}
        else:
          properties:
            runtime_id: {type: 'null'}
    TriggerDefinition:
      oneOf:
      - {$ref: '#/components/schemas/ScheduleTrigger'}
      - {$ref: '#/components/schemas/OneShotTrigger'}
      - {$ref: '#/components/schemas/WebhookTrigger'}
      - {$ref: '#/components/schemas/ConnectorEventTrigger'}
      - {$ref: '#/components/schemas/ChannelEventTrigger'}
      - {$ref: '#/components/schemas/ResourceEventTrigger'}
      - {$ref: '#/components/schemas/TaskEventTrigger'}
      - {$ref: '#/components/schemas/RuntimeEventTrigger'}
      - {$ref: '#/components/schemas/ProcessExitTrigger'}
      - {$ref: '#/components/schemas/CommandExitTrigger'}
      - {$ref: '#/components/schemas/ConditionWatchTrigger'}
      - {$ref: '#/components/schemas/ManualTrigger'}
      discriminator: {propertyName: kind}
    MisfirePolicy:
      oneOf:
      - {type: object, additionalProperties: false, required: [kind], properties: {kind: {const: SKIP}}}
      - {type: object, additionalProperties: false, required: [kind], properties: {kind: {const: RUN_ONCE_WHEN_AVAILABLE}}}
      - {type: object, additionalProperties: false, required: [kind, max_occurrences], properties: {kind: {const: CATCH_UP_BOUNDED}, max_occurrences: {type: integer, minimum: 1}}}
      discriminator: {propertyName: kind}
    ScheduleTrigger:
      type: object
      additionalProperties: false
      required: [kind, timezone, recurrence_format, recurrence_semantics_version, rrule_or_cron, misfire_policy, ambiguous_local_time, nonexistent_local_time]
      properties:
        kind: {const: SCHEDULE}
        timezone: {type: string, description: IANA time-zone identifier}
        recurrence_format: {type: string, enum: [CRON_5, RFC5545_RRULE]}
        recurrence_semantics_version: {type: integer, minimum: 1}
        rrule_or_cron: {type: string, minLength: 1}
        start_at: {type: [string, 'null'], format: date-time}
        end_at: {type: [string, 'null'], format: date-time}
        misfire_policy: {$ref: '#/components/schemas/MisfirePolicy'}
        ambiguous_local_time: {type: string, enum: [EARLIER, LATER]}
        nonexistent_local_time: {type: string, enum: [SKIP, NEXT_VALID]}
    OneShotTrigger:
      type: object
      additionalProperties: false
      required: [kind, scheduled_at, misfire_policy]
      properties:
        kind: {const: ONE_SHOT}
        scheduled_at: {type: string, format: date-time}
        misfire_policy: {$ref: '#/components/schemas/MisfirePolicy'}
    WebhookTrigger:
      type: object
      additionalProperties: false
      required: [kind, source_identity, auth_profile_ref, authentication_mode, replay_window_ms, max_payload_bytes]
      properties:
        kind: {const: WEBHOOK}
        source_identity: {type: string, minLength: 1}
        auth_profile_ref: {type: string}
        authentication_mode: {type: string, enum: [SIGNATURE, BEARER_SECRET, MUTUAL_TLS]}
        replay_window_ms: {type: integer, minimum: 1}
        max_payload_bytes: {type: integer, minimum: 1}
        delivery_id_field: {type: [string, 'null']}
    ConnectorEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, connection_id, provider_event_type]
      properties:
        kind: {const: CONNECTOR_EVENT}
        connection_id: {type: string}
        provider_event_type: {type: string, minLength: 1}
        filter_expression: {type: [object, 'null'], additionalProperties: true}
    ChannelEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, channel_binding_id, provider_event_type]
      properties:
        kind: {const: CHANNEL_EVENT}
        channel_binding_id: {type: string}
        provider_event_type: {type: string}
        filter_expression: {type: [object, 'null'], additionalProperties: true}
    ResourceEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, event_kinds, debounce_ms]
      properties:
        kind: {const: RESOURCE_EVENT}
        workspace_root_id: {type: [string, 'null']}
        resource_id: {type: [string, 'null']}
        event_kinds: {type: array, minItems: 1, items: {type: string}}
        debounce_ms: {type: integer, minimum: 0}
      oneOf:
      - required: [workspace_root_id]
        properties:
          workspace_root_id: {type: string, minLength: 1}
          resource_id: {type: 'null'}
      - required: [resource_id]
        properties:
          resource_id: {type: string, minLength: 1}
          workspace_root_id: {type: 'null'}
    TaskEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, event_kinds]
      properties:
        kind: {const: TASK_EVENT}
        event_kinds: {type: array, minItems: 1, items: {type: string}}
        task_filter: {type: [object, 'null'], additionalProperties: true}
        ignore_origin_automation_id: {type: [string, 'null']}
    RuntimeEventTrigger:
      type: object
      additionalProperties: false
      required: [kind, event_kinds, debounce_ms]
      properties:
        kind: {const: RUNTIME_EVENT}
        runtime_id: {type: [string, 'null']}
        event_kinds: {type: array, minItems: 1, items: {type: string}}
        debounce_ms: {type: integer, minimum: 0}
    ProcessExitTrigger:
      type: object
      additionalProperties: false
      required: [kind, runtime_id, managed_process_ref]
      properties:
        kind: {const: PROCESS_EXIT}
        runtime_id: {type: string}
        managed_process_ref: {type: string}
        exit_filter: {type: [object, 'null'], additionalProperties: true}
    CommandExitTrigger:
      type: object
      additionalProperties: false
      required: [kind, runtime_id, managed_execution_ref]
      properties:
        kind: {const: COMMAND_EXIT}
        runtime_id: {type: string}
        managed_execution_ref: {type: string}
        exit_filter: {type: [object, 'null'], additionalProperties: true}
    ConditionWatchTrigger:
      type: object
      additionalProperties: false
      required: [kind, provider_ref, source_ref, poll_interval_ms, condition_digest]
      properties:
        kind: {const: CONDITION_WATCH}
        provider_ref: {type: string}
        source_ref: {oneOf: [{$ref: '#/components/schemas/ResourceRef'}, {$ref: '#/components/schemas/CapabilityRef'}]}
        poll_interval_ms: {type: integer, minimum: 1000}
        condition_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        end_condition: {type: [object, 'null'], additionalProperties: true}
    ManualTrigger:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {const: MANUAL}
    AutomationExecutionPolicy:
      type: object
      additionalProperties: false
      required: [placement_preference, max_concurrent_occurrences, overlap_policy, retry_policy, notification_policy, wake_policy]
      properties:
        placement_preference: {$ref: '#/components/schemas/PlacementPreference'}
        max_concurrent_occurrences: {type: integer, minimum: 1, default: 1}
        overlap_policy: {type: string, enum: [SKIP, QUEUE, CANCEL_OLD, ALLOW]}
        retry_policy: {$ref: '#/components/schemas/RetryPolicy'}
        budget_ceiling: {oneOf: [{$ref: '#/components/schemas/BudgetSpec'}, {type: 'null'}]}
        notification_policy: {type: string, enum: [ALWAYS, ON_SUCCESS, ON_FAILURE, ON_CONDITION, SILENT]}
        wake_policy: {type: string, enum: [NEVER, TRY_WAKE, REQUIRE_RUNTIME_AWAKE]}
    ManualAutomationRunRequest:
      type: object
      additionalProperties: false
      properties:
        trigger_values: {type: object, additionalProperties: true}
    CreateAutomationRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, name, routine_id, routine_revision, triggers, execution_policy]
      properties:
        workspace_id: {type: string}
        name: {type: string, minLength: 1}
        routine_id: {type: string}
        routine_revision: {type: integer, minimum: 1}
        triggers: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TriggerSpec'}}
        execution_policy: {$ref: '#/components/schemas/AutomationExecutionPolicy'}
    UpdateAutomationRequest:
      type: object
      additionalProperties: false
      required: [name, routine_id, routine_revision, triggers, execution_policy]
      properties:
        name: {type: string, minLength: 1}
        routine_id: {type: string}
        routine_revision: {type: integer, minimum: 1}
        triggers: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TriggerSpec'}}
        execution_policy: {$ref: '#/components/schemas/AutomationExecutionPolicy'}
    Automation:
      type: object
      required: [automation_id, workspace_id, name, current_revision, status, version, created_at, updated_at]
      properties:
        automation_id: {type: string}
        workspace_id: {type: string}
        name: {type: string}
        current_revision: {type: integer, minimum: 1}
        status: {type: string, enum: [ENABLED, PAUSED, DISABLED]}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AutomationRevision:
      type: object
      required: [automation_id, revision, routine_id, routine_revision, triggers, execution_policy, coworker_ref, authored_by, created_at]
      properties:
        automation_id: {type: string}
        revision: {type: integer, minimum: 1}
        routine_id: {type: string}
        routine_revision: {type: integer, minimum: 1}
        triggers: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TriggerSpec'}}
        execution_policy: {$ref: '#/components/schemas/AutomationExecutionPolicy'}
        coworker_ref: {oneOf: [{$ref: '#/components/schemas/CoworkerRevisionRef'}, {type: 'null'}]}
        authored_by: {$ref: '#/components/schemas/PrincipalRef'}
        created_at: {type: string, format: date-time}
    AutomationOccurrence:
      type: object
      required: [occurrence_id, automation_id, automation_revision, routine_id, routine_revision, trigger_id, occurrence_key, trigger_host_runtime_id, claim_epoch, status, blockers, created_at, updated_at]
      properties:
        occurrence_id: {type: string}
        automation_id: {type: string}
        automation_revision: {type: integer, minimum: 1}
        routine_id: {type: string}
        routine_revision: {type: integer, minimum: 1}
        trigger_id: {type: string}
        trigger_host_runtime_id: {type: string}
        occurrence_key: {type: string, pattern: '^[a-f0-9]{64}$'}
        claim_epoch: {type: integer, minimum: 0}
        claim_expires_at: {type: [string, 'null'], format: date-time}
        scheduled_for: {type: [string, 'null'], format: date-time}
        covered_misfire_range:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required: [from, to, count]
            properties:
              from: {type: string, format: date-time}
              to: {type: string, format: date-time}
              count: {type: integer, minimum: 1}
        trigger_input_ref: {oneOf: [{$ref: '#/components/schemas/ResourceRef'}, {type: 'null'}]}
        trigger_payload_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        task_id: {type: [string, 'null']}
        blockers: {type: array, items: {$ref: '#/components/schemas/Blocker'}}
        status: {type: string, enum: [PENDING, CLAIMED, WAITING_DEPENDENCY, STARTED, COMPLETED, SKIPPED, FAILED]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BlobRef:
      type: object
      required: [digest, size_bytes, media_type]
      properties:
        digest: {type: string, minLength: 1, pattern: '^sha256:[a-f0-9]{64}$'}
        size_bytes: {type: integer, minimum: 0}
        media_type: {type: string}
    ContextOwnerRef:
      oneOf:
      - type: object
        additionalProperties: false
        required: [kind, principal_id]
        properties:
          kind: {const: USER}
          principal_id: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [kind, workspace_id]
        properties:
          kind: {const: WORKSPACE}
          workspace_id: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [kind, workspace_id, coworker_id]
        properties:
          kind: {const: COWORKER}
          workspace_id: {type: string, minLength: 1}
          coworker_id: {type: string, minLength: 1}
      - type: object
        additionalProperties: false
        required: [kind, workspace_id, goal_id]
        properties:
          kind: {const: GOAL}
          workspace_id: {type: string, minLength: 1}
          goal_id: {type: string, minLength: 1}
    ContextDocumentMetadata:
      type: object
      additionalProperties: false
      required: [kind, owner_ref, status]
      properties:
        kind: {type: string, enum: [PERSONAL_PROFILE, COWORKER_NOTES, WORKSPACE_NOTES, GOAL_NOTES]}
        owner_ref: {$ref: '#/components/schemas/ContextOwnerRef'}
        status: {type: string, enum: [ACTIVE, REVOKED, DELETION_PENDING, DELETED], description: Only Core may set DELETED after all owned content/index replicas acknowledge purge.}
        purge_manifest_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        purge_target_count: {type: integer, minimum: 0}
      allOf:
      - if:
          properties: {status: {enum: [DELETION_PENDING, DELETED]}}
          required: [status]
        then:
          required: [purge_manifest_digest, purge_target_count]
      - if:
          properties: {status: {enum: [ACTIVE, REVOKED]}}
          required: [status]
        then:
          not:
            anyOf:
            - required: [purge_manifest_digest]
            - required: [purge_target_count]
    ContextDocumentCreateMetadata:
      type: object
      additionalProperties: false
      required: [kind, owner_ref]
      properties:
        kind: {type: string, enum: [PERSONAL_PROFILE, COWORKER_NOTES, WORKSPACE_NOTES, GOAL_NOTES]}
        owner_ref: {$ref: '#/components/schemas/ContextOwnerRef'}
    CoworkerRevisionRef:
      type: object
      additionalProperties: false
      required: [coworker_id, revision]
      properties:
        coworker_id: {type: string, minLength: 1}
        revision: {type: integer, minimum: 1}
    ResourceRef:
      type: object
      additionalProperties: false
      required: [workspace_id, resource_id]
      properties:
        workspace_id: {type: string, minLength: 1}
        resource_id: {type: string, minLength: 1}
        revision_id: {type: [string, 'null']}
    PinnedResourceRef:
      allOf:
      - {$ref: '#/components/schemas/ResourceRef'}
      - type: object
        required: [revision_id]
        properties:
          revision_id: {type: string, minLength: 1}
    ResourceInput:
      type: object
      additionalProperties: false
      required: [resource_ref]
      properties:
        resource_ref: {$ref: '#/components/schemas/PinnedResourceRef'}
        observed_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    CommittedResource:
      type: object
      additionalProperties: false
      required: [resource, revision, resource_ref]
      properties:
        resource: {$ref: '#/components/schemas/Resource'}
        revision: {$ref: '#/components/schemas/ResourceRevision'}
        resource_ref: {$ref: '#/components/schemas/ResourceRef'}
    Resource:
      type: object
      required: [resource_id, workspace_id, kind, provider_identity, display_name, sensitivity, context_document, provenance, created_at, updated_at, version]
      allOf:
      - if:
          properties:
            provider_identity:
              properties:
                identity_confidence: {const: WEAK}
          required: [provider_identity]
        then:
          properties:
            identity_digest: {type: 'null'}
      - if:
          properties:
            provider_identity:
              properties:
                identity_confidence: {enum: [STRONG, PROVIDER_SCOPED]}
          required: [provider_identity]
        then:
          required: [identity_digest]
          properties:
            identity_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      properties:
        resource_id: {type: string}
        workspace_id: {type: string}
        kind: {type: string, enum: [FILE, FOLDER, ARTIFACT, CONNECTOR_OBJECT, WEB_RESOURCE, OTHER]}
        provider_identity: {$ref: '#/components/schemas/ProviderIdentity'}
        identity_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        display_name: {type: string}
        current_revision_id: {type: [string, 'null']}
        sensitivity: {type: string, enum: [PUBLIC, PERSONAL, CONFIDENTIAL, RESTRICTED]}
        context_document: {oneOf: [{$ref: '#/components/schemas/ContextDocumentMetadata'}, {type: 'null'}]}
        provenance: {$ref: '#/components/schemas/ProvenanceRecord'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    ResourceFreshness: {type: string, enum: [CURRENT, STALE, CONFLICTED, UNKNOWN, UNAVAILABLE]}
    ResourceLocationFreshness: {type: string, enum: [CURRENT, STALE, UNKNOWN, UNAVAILABLE]}
    DependencyFreshness: {type: string, enum: [CURRENT, STALE, CONFLICTED, UNKNOWN]}
    ResourceRevision:
      type: object
      required: [resource_revision_id, resource_id, parent_revision_ids, observed_at, created_by]
      properties:
        resource_revision_id: {type: string}
        resource_id: {type: string}
        parent_revision_ids:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1}
        provider_revision: {type: [string, 'null']}
        content_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        size_bytes: {type: [integer, 'null'], minimum: 0}
        media_type: {type: [string, 'null']}
        observed_at: {type: string, format: date-time}
        created_by:
          oneOf: [{$ref: '#/components/schemas/PrincipalRef'}, {$ref: '#/components/schemas/ServiceRef'}]
    ProviderIdentity:
      type: object
      additionalProperties: false
      required: [provider_instance_id, stable_object_id, identity_confidence]
      properties:
        provider_instance_id: {type: string, minLength: 1}
        stable_object_id: {type: string, minLength: 1}
        identity_confidence: {type: string, enum: [STRONG, PROVIDER_SCOPED, WEAK]}
        file_identity:
          oneOf: [{$ref: '#/components/schemas/FileIdentity'}, {type: 'null'}]
    FileIdentity:
      type: object
      additionalProperties: false
      required: [filesystem_instance_id, file_id, platform_kind]
      properties:
        filesystem_instance_id: {type: string, minLength: 1}
        volume_id: {type: [string, 'null']}
        file_id: {type: string, minLength: 1}
        generation: {type: [string, 'null']}
        platform_kind: {type: string, minLength: 1}
    ResourceLocationView:
      type: object
