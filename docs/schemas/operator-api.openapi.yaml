      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Exact input dependencies, dependent freshness, and invalidation history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceDependencyPage'}
        default: {$ref: '#/components/responses/Error'}
  /dependency-edges/{dependencyEdgeId}/invalidations:
    get:
      tags: [resources]
      operationId: listDependencyInvalidations
      parameters:
      - name: dependencyEdgeId
        in: path
        required: true
        schema: {type: string}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Paginated immutable invalidation history for this exact dependency edge
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvalidationPage'}
        default: {$ref: '#/components/responses/Error'}
  /tasks/{taskId}/verification-runs:
    get:
      tags: [tasks]
      operationId: listTaskVerificationRuns
      parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Verification runs pinned to criteria and input digests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerificationRunPage'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    workspaceContext: {type: apiKey, in: header, name: X-Workspace-ID, description: 'Required Workspace scope for all operations except listing/creating Workspaces; for path/body Workspace IDs, values must match.'}
    operatorAuth: {type: http, scheme: bearer, bearerFormat: opaque}
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected aggregate version for optimistic concurrency.
      schema: {type: string}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: {type: string}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Safe typed error
      headers:
        X-Correlation-ID:
          description: Same identifier as the correlation_id field in the ApiError body.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ErrorCode: {$ref: ./error-codes.schema.json}
    ResourceLimits:
      type: object
      additionalProperties: false
      required: [cpu_millis, memory_bytes, storage_bytes]
      properties:
        cpu_millis: {type: integer, minimum: 100}
        memory_bytes: {type: integer, minimum: 134217728}
        storage_bytes: {type: integer, minimum: 0}
        max_processes: {type: integer, minimum: 1}
        max_lifetime_seconds: {type: integer, minimum: 60}
    NetworkPolicy:
      type: object
      additionalProperties: false
      required: [mode, allowed_domains, max_response_bytes, max_download_bytes, deny_private_networks]
      properties:
        mode: {type: string, enum: [NONE, RESTRICTED]}
        allowed_domains:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1, description: Exact normalized DNS domain; wildcard entries are not accepted.}
        max_response_bytes: {type: integer, minimum: 0}
        max_download_bytes: {type: integer, minimum: 0}
        deny_private_networks: {const: true}
    EnvironmentProvisionPreviewRequest:
      type: object
      additionalProperties: false
      required: [name, environment_class, runtime_preference, source_resources, resource_limits, network_policy, retention_policy, budget_ceiling, budget_enforcement_policy, sharing_scope, owner_coworker_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        environment_class: {type: string, enum: [CONTAINER, VM, CLOUD_SANDBOX, REMOTE_MACHINE]}
        runtime_preference: {$ref: '#/components/schemas/PlacementPreference'}
        source_resources:
          type: array
          items: {$ref: '#/components/schemas/PinnedResourceRef'}
        resource_limits: {$ref: '#/components/schemas/ResourceLimits'}
        network_policy: {$ref: '#/components/schemas/NetworkPolicy'}
        retention_policy:
          type: object
          additionalProperties: false
          required: [expires_at]
          properties:
            expires_at: {type: [string, 'null'], format: date-time}
        backup_policy: {type: string, enum: [EXCLUDED, INCLUDE_CHECKPOINTS], default: EXCLUDED}
        budget_ceiling:
          allOf:
          - {$ref: '#/components/schemas/BudgetSpec'}
          - anyOf:
            - required: [max_wall_time_ms]
              properties:
                max_wall_time_ms: {type: integer, minimum: 1}
            - required: [max_cost_minor_units, currency]
              properties:
                max_cost_minor_units: {type: integer, minimum: 1}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
        budget_enforcement_policy: {type: string, enum: [REQUIRE_PROVIDER_ENFORCED, ALLOW_HOST_MONITORED]}
        sharing_scope: {type: string, enum: [COWORKER_PRIVATE, WORKSPACE_SHARED]}
        owner_coworker_id: {type: [string, 'null'], description: Required for COWORKER_PRIVATE; null for WORKSPACE_SHARED.}
      allOf:
      - if:
          properties: {sharing_scope: {const: COWORKER_PRIVATE}}
          required: [sharing_scope]
        then:
          properties: {owner_coworker_id: {type: string, minLength: 1}}
        else:
          properties: {owner_coworker_id: {type: 'null'}}
    CreatePersistentEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [name, environment_class, runtime_preference, source_resources, resource_limits, network_policy, retention_policy, budget_ceiling, budget_enforcement_policy, sharing_scope, owner_coworker_id, preview_digest]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        environment_class: {type: string, enum: [CONTAINER, VM, CLOUD_SANDBOX, REMOTE_MACHINE]}
        runtime_preference: {$ref: '#/components/schemas/PlacementPreference'}
        source_resources:
          type: array
          items: {$ref: '#/components/schemas/PinnedResourceRef'}
        resource_limits: {$ref: '#/components/schemas/ResourceLimits'}
        network_policy: {$ref: '#/components/schemas/NetworkPolicy'}
        retention_policy:
          type: object
          additionalProperties: false
          required: [expires_at]
          properties:
            expires_at: {type: [string, 'null'], format: date-time}
        backup_policy: {type: string, enum: [EXCLUDED, INCLUDE_CHECKPOINTS], default: EXCLUDED}
        budget_ceiling:
          allOf:
          - {$ref: '#/components/schemas/BudgetSpec'}
          - anyOf:
            - required: [max_wall_time_ms]
              properties:
                max_wall_time_ms: {type: integer, minimum: 1}
            - required: [max_cost_minor_units, currency]
              properties:
                max_cost_minor_units: {type: integer, minimum: 1}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
        budget_enforcement_policy: {type: string, enum: [REQUIRE_PROVIDER_ENFORCED, ALLOW_HOST_MONITORED]}
        sharing_scope: {type: string, enum: [COWORKER_PRIVATE, WORKSPACE_SHARED]}
        owner_coworker_id: {type: [string, 'null'], description: Required for COWORKER_PRIVATE; null for WORKSPACE_SHARED.}
        preview_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      allOf:
      - if:
          properties: {sharing_scope: {const: COWORKER_PRIVATE}}
          required: [sharing_scope]
        then:
          properties: {owner_coworker_id: {type: string, minLength: 1}}
        else:
          properties: {owner_coworker_id: {type: 'null'}}
    DestroyEnvironmentRequest:
      type: object
      additionalProperties: false
      required: [confirm_destroy]
      properties:
        confirm_destroy: {const: true}
    ChangeEnvironmentSharingScopeRequest:
      type: object
      additionalProperties: false
      required: [sharing_scope, owner_coworker_id, confirm_no_active_use]
      properties:
        sharing_scope: {type: string, enum: [COWORKER_PRIVATE, WORKSPACE_SHARED]}
        owner_coworker_id: {type: [string, 'null']}
        confirm_no_active_use: {const: true}
      allOf:
      - if:
          properties: {sharing_scope: {const: COWORKER_PRIVATE}}
          required: [sharing_scope]
        then:
          properties: {owner_coworker_id: {type: string, minLength: 1}}
        else:
          properties: {owner_coworker_id: {type: 'null'}}
    EnvironmentView:
      type: object
      additionalProperties: false
      required: [environment_id, workspace_id, name, runtime_id, environment_class, lifetime, sharing_scope, owner_task_id, owner_attempt_id, owner_coworker_id, owner_principal_id, status, health, source_resources, resource_limits, network_policy, active_attempt_count, retention_policy, backup_policy, budget_ceiling, budget_enforcement_policy, budget_enforcement, budget_usage, provision_preview_digest, version, created_at, updated_at, blockers]
      properties:
        environment_id: {type: string}
        workspace_id: {type: string}
        name: {type: string}
        runtime_id: {type: string}
        environment_class: {type: string, enum: [LOCAL_WORKSPACE, GIT_WORKTREE, CONTAINER, VM, CLOUD_SANDBOX, REMOTE_MACHINE, BROWSER, DESKTOP]}
        lifetime: {const: WORKSPACE_PERSISTENT}
        sharing_scope: {type: string, enum: [ATTEMPT_PRIVATE, TASK_SHARED, COWORKER_PRIVATE, WORKSPACE_SHARED, USER_SHARED], description: USER_SHARED is reserved and cannot be provisioned or admitted in v1.}
        owner_task_id: {type: [string, 'null']}
        owner_attempt_id: {type: [string, 'null']}
        owner_coworker_id: {type: [string, 'null']}
        owner_principal_id: {type: [string, 'null']}
        status: {type: string, enum: [NEW, PROVISIONING, READY, BUSY, CHECKPOINTING, SUSPENDED, FAILED, DESTROYING, DESTROYED]}
        health: {type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN]}
        source_resources: {type: array, items: {$ref: '#/components/schemas/PinnedResourceRef'}}
        resource_limits: {$ref: '#/components/schemas/ResourceLimits'}
        network_policy: {$ref: '#/components/schemas/NetworkPolicy'}
        active_attempt_count: {type: integer, minimum: 0}
        retention_policy:
          type: object
          additionalProperties: false
          required: [expires_at]
          properties:
            expires_at: {type: [string, 'null'], format: date-time}
        backup_policy: {type: string, enum: [EXCLUDED, INCLUDE_CHECKPOINTS]}
        budget_ceiling: {$ref: '#/components/schemas/BudgetSpec'}
        budget_enforcement_policy: {type: string, enum: [REQUIRE_PROVIDER_ENFORCED, ALLOW_HOST_MONITORED]}
        budget_enforcement: {type: string, enum: [PROVIDER_ENFORCED, HOST_MONITORED, UNAVAILABLE]}
        budget_usage: {$ref: '#/components/schemas/EnvironmentBudgetUsage'}
        provision_preview_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        version: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        blockers: {type: array, items: {$ref: '#/components/schemas/Blocker'}}
    EnvironmentProvisionPreview:
      type: object
      additionalProperties: false
      required: [workspace_id, environment_class, eligible_runtime_ids, selected_runtime_id, dependencies, estimated_cost, budget_enforcement, preview_digest, expires_at, blockers]
      properties:
        workspace_id: {type: string}
        environment_class: {type: string, enum: [CONTAINER, VM, CLOUD_SANDBOX, REMOTE_MACHINE]}
        eligible_runtime_ids: {type: array, items: {type: string}}
        selected_runtime_id: {type: [string, 'null']}
        dependencies: {type: array, items: {$ref: '#/components/schemas/Blocker'}}
        estimated_cost:
          type: object
          additionalProperties: false
          required: [amount_minor_units, currency, confidence, period_seconds]
          properties:
            amount_minor_units: {type: [integer, 'null'], minimum: 0}
            currency: {type: [string, 'null'], pattern: '^[A-Z]{3}$'}
            confidence: {type: string, enum: [QUOTED, ESTIMATED, UNAVAILABLE]}
            period_seconds: {type: [integer, 'null'], minimum: 1}
        budget_enforcement: {type: string, enum: [PROVIDER_ENFORCED, HOST_MONITORED, UNAVAILABLE]}
        preview_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$', description: Opaque, short-lived digest binding the exact normalized request, authenticated preview principal, selected Runtime incarnation, pinned input revisions, provider offer and policy/quote basis.}
        expires_at: {type: string, format: date-time}
        blockers: {type: array, items: {$ref: '#/components/schemas/Blocker'}}
    EnvironmentPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EnvironmentView'}}
        next_cursor: {type: [string, 'null']}
    NeedsYouItem:
      type: object
      additionalProperties: false
      required: [item_id, kind, status, approval_id, user_request_id, task_id, blocker_id, title, safe_summary, created_at, resolved_at]
      properties:
        item_id: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        kind: {type: string, enum: [APPROVAL, USER_REQUEST, TASK_BLOCKER]}
        status: {type: string, enum: [OPEN, RESOLVED]}
        approval_id: {type: [string, 'null']}
        user_request_id: {type: [string, 'null']}
        task_id: {type: [string, 'null']}
        blocker_id: {type: [string, 'null']}
        title: {type: string, minLength: 1}
        safe_summary: {type: string}
        created_at: {type: string, format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
      allOf:
      - if:
          properties: {kind: {const: APPROVAL}}
          required: [kind]
        then:
          properties:
            approval_id: {type: string, minLength: 1}
            user_request_id: {type: 'null'}
            blocker_id: {type: 'null'}
      - if:
          properties: {kind: {const: USER_REQUEST}}
          required: [kind]
        then:
          properties:
            approval_id: {type: 'null'}
            user_request_id: {type: string, minLength: 1}
            blocker_id: {type: 'null'}
      - if:
          properties: {kind: {const: TASK_BLOCKER}}
          required: [kind]
        then:
          required: [task_id, blocker_id]
          properties:
            approval_id: {type: 'null'}
            user_request_id: {type: 'null'}
            task_id: {type: string, minLength: 1}
            blocker_id: {type: string, minLength: 1}
    NeedsYouPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/NeedsYouItem'}}
        next_cursor: {type: [string, 'null']}
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        replication_policy: {type: string, description: Defaults to LOCAL_ONLY. SELECTED_FOLDERS is set after WorkspaceRoots have been created., default: LOCAL_ONLY, enum: [LOCAL_ONLY, METADATA_ONLY, ACTIVE_TASK_INPUTS, FULL_WORKSPACE]}
    JsonValue:
      oneOf:
      - {type: 'null'}
      - {type: boolean}
      - {type: number}
      - {type: string}
      - type: array
        items: {$ref: '#/components/schemas/JsonValue'}
      - type: object
        additionalProperties: {$ref: '#/components/schemas/JsonValue'}
    JsonSchema: {type: object, description: Bounded inline JSON Schema 2020-12 schema; remote references are forbidden., additionalProperties: true}
    Choice:
      type: object
      additionalProperties: false
      required: [choice_id, label, value]
      properties:
        choice_id: {type: string, minLength: 1}
        label: {type: string, minLength: 1}
        description: {type: string}
        value: {$ref: '#/components/schemas/JsonValue'}
    QuietHours:
      type: object
      additionalProperties: false
      required: [timezone, weekdays, start_local_time, end_local_time]
      properties:
        timezone: {type: string, minLength: 1, description: IANA time zone identifier}
        weekdays:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
        start_local_time: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
        end_local_time: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
    UpdateWorkspacePolicyRequest:
      type: object
      additionalProperties: false
      required: [replication_policy]
      properties:
        replication_policy: {type: string, enum: [LOCAL_ONLY, METADATA_ONLY, ACTIVE_TASK_INPUTS, SELECTED_FOLDERS, FULL_WORKSPACE]}
        replication_scope_root_ids:
          type: array
          description: Required and non-empty when replication_policy is SELECTED_FOLDERS; every ID must be an active root in this Workspace.
          items: {type: string, minLength: 1}
    SetWorkspaceDefaultAgentBindingRequest:
      type: object
      additionalProperties: false
      required: [agent_binding_id]
      properties:
        agent_binding_id: {type: [string, 'null'], description: Null clears the default binding.}
    Workspace:
      type: object
      required: [workspace_id, name, owner_principal_id, replication_policy, replication_scope_root_ids, current_instruction_revision, default_agent_binding_id, primary_coworker_id, hub_runtime_id, status, version, created_at, updated_at]
      properties:
        workspace_id: {type: string}
        name: {type: string}
        owner_principal_id: {type: string}
        replication_policy: {type: string, enum: [LOCAL_ONLY, METADATA_ONLY, ACTIVE_TASK_INPUTS, SELECTED_FOLDERS, FULL_WORKSPACE]}
        replication_scope_root_ids:
          type: array
          items: {type: string, minLength: 1}
        current_instruction_revision: {type: [integer, 'null'], minimum: 1}
        default_agent_binding_id: {type: [string, 'null']}
        primary_coworker_id: {type: [string, 'null']}
        hub_runtime_id: {type: [string, 'null']}
        status: {type: string, enum: [ACTIVE, ARCHIVED]}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WorkspacePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Workspace'}
        next_cursor: {type: [string, 'null']}
    RuntimeEventCursor:
      type: object
      additionalProperties: false
      required: [origin_runtime_id, last_sequence]
      properties:
        origin_runtime_id: {type: string, minLength: 1}
        last_sequence: {type: integer, minimum: 0}
    WorkspaceBackupManifest:
      type: object
      additionalProperties: false
      required: [backup_id, workspace_id, schema_version, event_cursors, database_snapshot_ref, blob_manifest_ref, blob_manifest_digest, encryption_key_ref, integrity_digest, manifest_authentication, created_at, verified_at]
      properties:
        backup_id: {type: string, minLength: 1}
        workspace_id: {type: string, minLength: 1}
        schema_version: {type: integer, minimum: 1}
        event_cursors:
          type: array
          items: {$ref: '#/components/schemas/RuntimeEventCursor'}
        database_snapshot_ref: {$ref: '#/components/schemas/BlobRef'}
        blob_manifest_ref: {$ref: '#/components/schemas/BlobRef'}
        blob_manifest_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        encryption_key_ref: {type: string, minLength: 1, readOnly: true}
        integrity_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        manifest_authentication: {type: string, minLength: 1, readOnly: true, description: Provider-generated authentication value; contains no key material}
        created_at: {type: string, format: date-time}
        verified_at: {type: string, format: date-time}
    WorkspaceBackupPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/WorkspaceBackupManifest'}
        next_cursor: {type: [string, 'null']}
    RestoreWorkspaceBackupRequest:
      type: object
      additionalProperties: false
      required: [confirm_empty_installation]
      properties:
        confirm_empty_installation: {const: true}
    RestoreReceipt:
      type: object
      additionalProperties: false
      required: [backup_id, workspace_id, new_runtime_id, restored_event_cursors, reauthentication_required_connection_ids, restored_at]
      properties:
        backup_id: {type: string, minLength: 1}
        workspace_id: {type: string, minLength: 1}
        new_runtime_id: {type: string, minLength: 1}
        restored_event_cursors:
          type: array
          items: {$ref: '#/components/schemas/RuntimeEventCursor'}
        reauthentication_required_connection_ids:
          type: array
          uniqueItems: true
          items: {type: string}
        restored_at: {type: string, format: date-time}
    Connection:
      type: object
      required: [connection_id, workspace_id, external_provider_ref, status, created_at, updated_at, version]
      properties:
        connection_id: {type: string}
        workspace_id: {type: string}
        external_provider_ref: {type: string}
        account_ref: {type: [string, 'null']}
        status: {type: string, enum: [CONNECTING, CONNECTED, DEGRADED, REAUTH_REQUIRED, DISCONNECTED]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    ConnectionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Connection'}
        next_cursor: {type: [string, 'null']}
    ChannelBinding:
      type: object
      required: [channel_binding_id, workspace_id, connection_id, provider_ref, external_account_ref, identity_ref, assurance_level, allowed_actions, status, host_assignment, created_at, updated_at, version]
      description: ACTIVE bindings always have a current host assignment. A DEGRADED binding may be safely unassigned (host_assignment null), including after RuntimeWorkspaceBinding revocation found no eligible replacement; this is not deletion of assignment history. REVOKED bindings may also have no current assignment.
      properties:
        channel_binding_id: {type: string}
        workspace_id: {type: string}
        connection_id: {type: [string, 'null']}
        provider_ref: {type: string}
        external_account_ref: {type: string}
        identity_ref: {$ref: '#/components/schemas/PrincipalRef'}
        assurance_level: {type: string, enum: [VIEW_ONLY, STEER_SAFE, APPROVE_SAFE, APPROVE_SENSITIVE, LOCAL_STRONG]}
        allowed_actions:
          type: array
          uniqueItems: true
          items: {type: string, enum: [VIEW, STEER, RESPOND, APPROVE_SAFE, APPROVE_SENSITIVE]}
        status: {type: string, enum: [ACTIVE, DEGRADED, REVOKED]}
        host_assignment:
          oneOf: [{$ref: '#/components/schemas/ChannelHostAssignment'}, {type: 'null'}]
          description: Null only when the binding currently has no assignment; historical assignment changes remain available from the event history.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
      allOf:
      - if:
          properties:
            host_assignment: {type: 'null'}
          required: [host_assignment]
        then:
          properties:
            status: {enum: [DEGRADED, REVOKED]}
    ChannelHostAssignment:
      type: object
      required: [channel_binding_id, runtime_id, host_epoch, lease_expires_at, status, ingress_continuity, assigned_at, version]
      description: Current assignment projection. Optional provenance fields are additive for older clients; an absent value on legacy records means provenance is unavailable, not that a decision or proof is inferred. For current epoch N, source-release projection joins the immutable lease-release row for epoch N-1 and, for QUIESCENT, its drain_proof_id to the scoped drain-proof row. The initial assignment has no source-release provenance.
      properties:
        channel_binding_id: {type: string}
        runtime_id: {type: string}
        host_epoch: {type: integer, minimum: 1}
        lease_expires_at: {type: string, format: date-time}
        status: {type: string, enum: [ACTIVE, DRAINING]}
        ingress_continuity: {type: string, enum: [CONTINUOUS, GAP_ACCEPTED]}
        ingress_gap_since: {type: [string, 'null'], format: date-time}
        source_release_basis:
          type: [string, 'null']
          enum: [SAFE_SETTLEMENT_PROOF, LEASE_EXPIRY_PLUS_SKEW, null]
          description: Set only by RuntimeMesh service validation for a cross-Runtime ACTIVE reassignment. SQL release_kind QUIESCENT maps to SAFE_SETTLEMENT_PROOF; EXPIRY_PLUS_SKEW maps to LEASE_EXPIRY_PLUS_SKEW after Hub-authoritative safe_reassign_after. The assignment schema cannot compare source and target Runtime IDs, so the service must compare them against the current assignment.
        source_drain_proof_ref:
          oneOf: [{$ref: '#/components/schemas/ChannelHostDrainProofRef'}, {type: 'null'}]
          description: Opaque scoped reference to the immutable SQL ChannelHostDrainProof row, present only with SAFE_SETTLEMENT_PROOF.
        source_drain_proof_digest:
          type: [string, 'null']
          pattern: '^sha256:[a-f0-9]{64}$'
          description: SQL channel_host_drain_proofs.proof_digest for source_drain_proof_ref; null together with the reference when release relied on lease expiry plus skew.
        continuity_proof_ref:
          oneOf: [{$ref: '#/components/schemas/ChannelHostContinuityProofRef'}, {type: 'null'}]
          description: Opaque scoped reference to the immutable SQL ChannelHostContinuityProof row, present for a verified cross-Runtime ACTIVE assignment with continuous ingress.
        continuity_proof_digest:
          type: [string, 'null']
          pattern: '^sha256:[a-f0-9]{64}$'
          description: SQL channel_host_continuity_proofs.proof_digest for continuity_proof_ref; null together with the reference when the assignment has no continuity proof.
        ingress_gap_decision:
          oneOf: [{$ref: '#/components/schemas/ChannelIngressGapDecision'}, {type: 'null'}]
          description: Authenticated owner decision and audit provenance for a newly accepted ingress gap. Null or absent on legacy assignments means provenance is unavailable.
        assigned_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
      allOf:
      - if:
          properties:
            ingress_continuity: {const: GAP_ACCEPTED}
          required: [ingress_continuity]
        then:
          required: [ingress_gap_since]
          properties:
            ingress_gap_since: {type: string, format: date-time}
      - if:
          properties:
            ingress_continuity: {const: CONTINUOUS}
          required: [ingress_continuity]
        then:
          properties:
            ingress_gap_since: {type: 'null'}
      - if:
          properties:
            source_release_basis: {const: SAFE_SETTLEMENT_PROOF}
          required: [source_release_basis]
        then:
          required: [source_drain_proof_ref, source_drain_proof_digest]
          properties:
            source_drain_proof_ref: {$ref: '#/components/schemas/ChannelHostDrainProofRef'}
            source_drain_proof_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      - if:
          properties:
            source_release_basis: {const: LEASE_EXPIRY_PLUS_SKEW}
          required: [source_release_basis]
        then:
          properties:
            source_drain_proof_ref: {type: 'null'}
            source_drain_proof_digest: {type: 'null'}
      - if:
          properties:
            source_release_basis: {enum: [SAFE_SETTLEMENT_PROOF, LEASE_EXPIRY_PLUS_SKEW]}
            ingress_continuity: {const: CONTINUOUS}
          required: [source_release_basis, ingress_continuity]
        then:
          required: [continuity_proof_ref, continuity_proof_digest]
          properties:
            continuity_proof_ref: {$ref: '#/components/schemas/ChannelHostContinuityProofRef'}
            continuity_proof_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      - if:
          properties:
            continuity_proof_ref: {type: object}
          required: [continuity_proof_ref]
        then:
          required: [continuity_proof_digest, ingress_continuity]
          properties:
            continuity_proof_ref: {$ref: '#/components/schemas/ChannelHostContinuityProofRef'}
            continuity_proof_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
            ingress_continuity: {const: CONTINUOUS}
      - if:
          properties:
            continuity_proof_digest: {type: string}
          required: [continuity_proof_digest]
        then:
          required: [continuity_proof_ref]
          properties:
            continuity_proof_ref: {$ref: '#/components/schemas/ChannelHostContinuityProofRef'}
      - if:
          required: [ingress_gap_decision]
        then:
          properties:
            ingress_continuity: {const: GAP_ACCEPTED}
          required: [ingress_continuity]
    ReassignChannelHostRequest:
      type: object
      additionalProperties: false
      required: [runtime_id, expected_assignment_version]
      description: Assigns or reassigns this binding to the requested eligible Runtime; it does not clear an assignment. If-Match fences the ChannelBinding aggregate version, including when unassigned, while expected_assignment_version fences the assignment snapshot (null only when no current assignment exists). Safe no-target clearing is an internal RuntimeMesh operation of RuntimeWorkspaceBinding revocation, not a public assignment-delete command.
      properties:
        runtime_id: {type: string}
        expected_assignment_version: {type: [integer, 'null'], minimum: 1, description: Must equal the current ChannelHostAssignment.version, or be null when host_assignment is null.}
        accept_ingress_gap:
          type: boolean
          default: false
          description: Must be explicitly true to confirm a host move when provider cursor transfer/replay cannot prove continuity. The authenticated owner principal and the generated audit record are retained in ingress_gap_decision; callers cannot supply or impersonate that provenance.
    ChannelIngressGapDecision:
      type: object
      additionalProperties: false
      required: [decided_by, decided_at, audit_record_id, reason_code]
      description: Projection of the immutable same-Workspace AuditRecord referenced by ingress_gap_decision_audit_id. RuntimeMesh service validation must require decided_by, decided_at, and reason_code to exactly match that record; SQL assignment triggers currently enforce the record ID, Workspace, ALLOW decision, action, and ChannelBinding reference.
      properties:
        decided_by: {$ref: '#/components/schemas/PrincipalRef'}
        decided_at: {type: string, format: date-time}
        audit_record_id: {type: string, minLength: 1}
        reason_code: {type: string, minLength: 1}
    ChannelHostDrainProofRef:
      type: object
      additionalProperties: false
      required: [proof_id, channel_binding_id, workspace_id, runtime_id, host_epoch]
      description: Opaque, non-authorizing reference to a ChannelHostDrainProof row. The service resolves proof_id and verifies every scope field against the SQL row and source assignment; this is not a LiteCowork ResourceRef or filesystem/provider locator.
      properties:
        proof_id: {type: string, minLength: 1}
        channel_binding_id: {type: string, minLength: 1}
        workspace_id: {type: string, minLength: 1}
        runtime_id: {type: string, minLength: 1}
        host_epoch: {type: integer, minimum: 1}
    ChannelHostContinuityProofRef:
      type: object
      additionalProperties: false
      required: [proof_id, channel_binding_id, workspace_id, source_runtime_id, source_host_epoch, target_runtime_id, target_host_epoch]
      description: Opaque, non-authorizing reference to a ChannelHostContinuityProof row. The service resolves proof_id, verifies every scope field and proof_digest against the SQL row and prior/current assignments; this is not a ResourceRef or filesystem/provider locator.
      properties:
        proof_id: {type: string, minLength: 1}
        channel_binding_id: {type: string, minLength: 1}
        workspace_id: {type: string, minLength: 1}
        source_runtime_id: {type: string, minLength: 1}
        source_host_epoch: {type: integer, minimum: 1}
        target_runtime_id: {type: string, minLength: 1}
        target_host_epoch: {type: integer, minimum: 2}
    ChannelBindingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ChannelBinding'}
        next_cursor: {type: [string, 'null']}
    UpdateChannelBindingActionsRequest:
      type: object
