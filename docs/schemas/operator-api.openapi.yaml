    ProbeLocalAgentProfileRequest:
      type: object
      additionalProperties: false
      required: [provider_key]
      properties:
        provider_key: {type: string, enum: [CODEX, OPENCODE]}
    AgentInstallationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AgentInstallation'}
    AgentInstallation:
      type: object
      additionalProperties: false
      required: [agent_id, display_name, protocol_candidate, installation, version, authentication, session_readiness]
      properties:
        agent_id: {type: string}
        display_name: {type: string}
        protocol_candidate: {type: string, enum: [CODEX_APP_SERVER, ACP]}
        installation: {type: string, enum: [MISSING, INSTALLED, VERSION_UNAVAILABLE]}
        version: {type: [string, 'null']}
        authentication: {type: string, enum: [UNKNOWN]}
        session_readiness: {type: string, enum: [NOT_PROBED]}
    AgentEndpoint:
      type: object
      additionalProperties: false
      required: [endpoint_id, agent_profile_id, protocol, topology, capabilities]
      properties:
        endpoint_id: {type: string}
        agent_profile_id: {type: string}
        protocol: {type: string, enum: [ACP, A2A, SDK, API, CLI, TERMINAL]}
        topology: {type: string, enum: [LOCAL_INTERACTIVE, REMOTE_AGENT_SERVICE, VENDOR_SERVICE, PROCESS_ADAPTER]}
        protocol_version: {type: [string, 'null']}
        capabilities: {$ref: '#/components/schemas/AgentCapabilities'}
    AgentProfilePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AgentProfileView'}
        next_cursor: {type: [string, 'null']}
    AgentProfileView:
      allOf:
      - {$ref: '#/components/schemas/AgentProfile'}
      - type: object
        required: [observations]
        properties:
          observations:
            type: array
            items: {$ref: '#/components/schemas/AgentProfileObservation'}
    AgentProfileObservation:
      type: object
      additionalProperties: false
      required: [endpoint_id, runtime_id, runtime_incarnation_id, compatible, readiness, observed_at, offer_expires_at, constraints]
      properties:
        endpoint_id: {type: string}
        runtime_id: {type: string}
        runtime_incarnation_id: {type: string}
        compatible: {type: boolean}
        readiness: {type: string, enum: [AVAILABLE, STARTABLE, STARTING, READY, BUSY, DEGRADED, OFFLINE, NEEDS_AUTH, UNAVAILABLE]}
        observed_at: {type: string, format: date-time}
        offer_expires_at: {type: string, format: date-time}
        constraints:
          anyOf:
          - {$ref: '#/components/schemas/JsonObject'}
          - {$ref: '#/components/schemas/OpenCodeProfileProbeConstraints'}
    OpenCodeProfileProbeConstraints:
      type: object
      additionalProperties: false
      description: Sanitized OpenCode profile-probe observation. At most 32 providers, 64 models per provider, and 256 models total are returned. Catalog metadata is display-only; authentication, inference entitlement, model selection, and Task admission are not established.
      required: [agent_id, protocol, protocol_version, probe_readiness, failure, reported_provider_status, reported_connected_provider_ids, reported_connected_provider_ids_truncated, reported_provider_ids, reported_provider_ids_truncated, reported_model_catalog, configured_providers, catalog_truncated, authentication_observation, session_model_selection, inference_access_verified, host_process_stopped, writer_quiescence_proven, profile_admission_supported]
      properties:
        agent_id: {const: opencode}
        protocol: {const: OPENCODE_SERVER}
        protocol_version: {type: [string, 'null'], maxLength: 48, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
        probe_readiness: {type: string, enum: [COMPLETE, PARTIAL, FAILED]}
        failure: {type: [string, 'null'], enum: [INVALID_ADMISSION, HOST_UNAVAILABLE, PROVIDER_STATUS_UNAVAILABLE, CATALOG_UNAVAILABLE, HOST_STOP_UNOBSERVED, UNSUPPORTED_VERSION, null]}
        reported_provider_status: {type: string, enum: [OBSERVED, UNKNOWN, NOT_PROBED]}
        reported_connected_provider_ids:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9_.:/-]+$'}
        reported_connected_provider_ids_truncated: {type: boolean}
        reported_provider_ids:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9_.:/-]+$'}
        reported_provider_ids_truncated: {type: boolean}
        reported_model_catalog: {type: string, enum: [OBSERVED, UNKNOWN, NOT_PROBED]}
        configured_providers:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/OpenCodeProviderOption'}
        catalog_truncated: {type: boolean}
        authentication_observation: {const: UNKNOWN}
        session_model_selection: {const: NOT_QUALIFIED}
        inference_access_verified: {const: false}
        host_process_stopped: {type: boolean}
        writer_quiescence_proven: {const: false}
        profile_admission_supported: {const: false}
    OpenCodeProviderOption:
      type: object
      additionalProperties: false
      required: [id, display_name, models]
      properties:
        id: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9_.:/-]+$'}
        display_name: {type: [string, 'null'], maxLength: 128}
        models:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/OpenCodeModelOption'}
    OpenCodeModelOption:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9_.:/-]+$'}
        display_name: {type: [string, 'null'], maxLength: 128}
    AgentBinding:
      type: object
      additionalProperties: false
      required: [agent_binding_id, workspace_id, agent_profile_id, runtime_id, endpoint_selection_policy, configuration_descriptor_digest, configuration, credential_bindings, default_session_options_descriptor_digest, default_session_options, enabled, lead_eligible, created_at, version]
      properties:
        agent_binding_id: {type: string}
        workspace_id: {type: string}
        agent_profile_id: {type: string}
        runtime_id: {type: [string, 'null']}
        endpoint_selection_policy: {$ref: '#/components/schemas/EndpointSelectionPolicy'}
        auth_ref:
          deprecated: true
          oneOf: [{$ref: '#/components/schemas/SecretRef'}, {type: 'null'}]
          description: Transitional single-secret field. Target credential slots use credential_bindings.
        configuration_descriptor_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        configuration:
          type: object
          maxProperties: 64
          description: Closed adapter-validated non-secret configuration only; raw credentials are forbidden.
        credential_bindings:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/AgentCredentialBinding'}
        default_session_options_descriptor_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        default_session_options:
          type: object
          maxProperties: 64
          description: Opaque agent-owned default session options validated against the named descriptor.
        enabled: {type: boolean}
        lead_eligible: {type: boolean}
        created_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    AgentBindingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AgentBinding'}
        next_cursor: {type: [string, 'null']}
    CreateAgentBindingRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, agent_profile_id, lead_eligible]
      properties:
        workspace_id: {type: string}
        agent_profile_id: {type: string}
        lead_eligible: {type: boolean}
        runtime_id: {type: [string, 'null']}
        endpoint_selection_policy:
          allOf: [{$ref: '#/components/schemas/EndpointSelectionPolicy'}]
          default: {mode: AUTO_COMPATIBLE, required_features: [], preferred_topologies: []}
        configuration_descriptor_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        configuration: {type: object, maxProperties: 64}
        credential_bindings:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/AgentCredentialBinding'}
        default_session_options_descriptor_digest: {type: [string, 'null'], pattern: '^sha256:[a-f0-9]{64}$'}
        default_session_options: {type: object, maxProperties: 64}
    ConfigureAgentBindingRequest:
      type: object
      additionalProperties: false
      required: [descriptor_digest, configuration, credential_bindings, default_session_options]
      properties:
        descriptor_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        configuration:
          type: object
          maxProperties: 64
          description: Non-secret values only; service validates against current AgentConfigurationDescriptor.
        credential_bindings:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/AgentCredentialBinding'}
        default_session_options:
          type: object
          maxProperties: 64
          description: Agent-owned option values validated against current AgentSessionOptionDescriptor.
    EndpointSelectionPolicy:
      oneOf:
      - type: object
        additionalProperties: false
        required: [mode, required_features, preferred_topologies]
        properties:
          mode: {const: AUTO_COMPATIBLE}
          required_features:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/AgentFeature'}
          preferred_topologies:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/AgentEndpointTopology'}
      - type: object
        additionalProperties: false
        required: [mode, endpoint_id, required_features, preferred_topologies]
        properties:
          mode: {const: PINNED_ENDPOINT}
          endpoint_id: {type: string}
          required_features:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/AgentFeature'}
          preferred_topologies:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/AgentEndpointTopology'}
    AgentFeature:
      type: string
      enum:
      - session.resume
      - session.steer
      - session.interrupt
      - session.cancel
      - session.fork
      - input.text
      - input.image
      - input.file
      - input.resources
      - extension.mcp_stdio
      - extension.mcp_http
      - extension.skills
      - extension.plugins
      - extension.dynamic_attach
      - reporting.tool_calls
      - reporting.plan
      - reporting.usage
      - reporting.native_subagents
      - reporting.approvals
      - environment.cwd
      - environment.extra_directories
    AgentEndpointTopology: {type: string, enum: [LOCAL_INTERACTIVE, REMOTE_AGENT_SERVICE, VENDOR_SERVICE, PROCESS_ADAPTER]}
    PrincipalRef:
      type: object
      additionalProperties: false
      required: [principal_id, kind]
      properties:
        principal_id: {type: string}
        kind: {type: string, enum: [USER, SERVICE, RUNTIME, AGENT, CHANNEL_IDENTITY]}
    ServiceRef:
      type: object
      additionalProperties: false
      required: [service_id]
      properties:
        service_id: {type: string, minLength: 1}
    MessageContentBlock:
      oneOf:
      - type: object
        additionalProperties: false
        required: [kind, text]
        properties:
          kind: {const: TEXT}
          text: {type: string}
      - type: object
        additionalProperties: false
        required: [kind, resource_ref]
        properties:
          kind: {const: RESOURCE}
          resource_ref: {$ref: '#/components/schemas/ResourceRef'}
          display_name: {type: [string, 'null']}
    ApprovalRequirement:
      type: object
      additionalProperties: false
      required: [requirement_id, action_class, required_assurance, mandatory]
      properties:
        requirement_id: {type: string}
        action_class: {type: string}
        required_assurance: {type: string, enum: [VIEW_ONLY, STEER_SAFE, APPROVE_SAFE, APPROVE_SENSITIVE, LOCAL_STRONG]}
        mandatory: {type: boolean}
    AcceptanceCriterion:
      type: object
      additionalProperties: false
      required: [criterion_id, description, required_evidence, mandatory]
      properties:
        criterion_id: {type: string}
        description: {type: string}
        subject_refs:
          type: array
          items: {$ref: '#/components/schemas/ResourceRef'}
        required_evidence: {type: string, enum: [REPORTED, OBSERVED, VERIFIED]}
        verifier_hint: {type: [string, 'null']}
        mandatory: {type: boolean}
    OutputRequirement:
      type: object
      additionalProperties: false
      required: [output_id, description, mandatory]
      properties:
        output_id: {type: string}
        description: {type: string}
        kind: {type: [string, 'null']}
        media_type: {type: [string, 'null']}
        destination:
          oneOf: [{$ref: '#/components/schemas/ResourceRef'}, {type: 'null'}]
        mandatory: {type: boolean}
    BudgetSpec:
      type: object
      additionalProperties: false
      properties:
        max_wall_time_ms: {type: [integer, 'null'], minimum: 0}
        max_cost_minor_units: {type: [integer, 'null'], minimum: 0}
        currency: {type: [string, 'null'], minLength: 3, maxLength: 3}
        max_tokens: {type: [integer, 'null'], minimum: 0}
        max_child_attempts: {type: [integer, 'null'], minimum: 0}
        max_concurrency: {type: [integer, 'null'], minimum: 1}
    EnvironmentBudgetUsage:
      type: object
      additionalProperties: false
      required: [status, consumed_cost_minor_units, currency, consumed_wall_time_ms, confidence, observed_at]
      properties:
        status: {type: string, enum: [WITHIN_LIMIT, LIMIT_REACHED, UNKNOWN]}
        consumed_cost_minor_units: {type: [integer, 'null'], minimum: 0}
        currency: {type: [string, 'null'], pattern: '^[A-Z]{3}$'}
        consumed_wall_time_ms: {type: [integer, 'null'], minimum: 0}
        confidence: {type: string, enum: [EXACT, ESTIMATED, UNKNOWN]}
        observed_at: {type: [string, 'null'], format: date-time}
    CapabilityRequirement:
      type: object
      additionalProperties: false
      required: [semantic_requirement, operation_ids]
      properties:
        semantic_requirement: {type: string}
        operation_ids:
          type: array
          items: {type: string}
        resource_scope: {$ref: '#/components/schemas/ResourceScope'}
    ResourceScope:
      type: object
      additionalProperties: false
      properties:
        resource_refs:
          type: array
          items: {$ref: '#/components/schemas/ResourceRef'}
        operation_ids:
          type: array
          items: {type: string}
        constraints: {type: object, additionalProperties: true}
    FailureRecord:
      type: object
      required: [code, category, safe_message, retryable, signature, correlation_id]
      properties:
        code: {type: string}
        category: {type: string, enum: [TRANSIENT, PERMANENT, POLICY, USER_REQUIRED, AMBIGUOUS]}
        safe_message: {type: string}
        retryable: {type: boolean}
        signature: {type: string}
        correlation_id: {type: string}
        details: {type: [object, 'null'], additionalProperties: true}
    ProvenanceRecord:
      type: object
      additionalProperties: false
      required: [source_inputs, transformations, tool_reports]
      properties:
        created_by_attempt: {type: string}
        provider_ref: {type: string}
        capability_ref: {$ref: '#/components/schemas/CapabilityRef'}
        source_inputs:
          type: array
          items: {$ref: '#/components/schemas/ResourceInput'}
        transformations:
          type: array
          items: {$ref: '#/components/schemas/ProvenanceTransformation'}
        tool_reports:
          type: array
          items: {$ref: '#/components/schemas/PinnedResourceRef'}
        folder_import: {oneOf: [{$ref: '#/components/schemas/FolderImportMetadata'}, {type: 'null'}]}
    FolderImportMetadata:
      type: object
      additionalProperties: false
      required: [relative_path]
      properties:
        relative_path: {type: string, minLength: 1, maxLength: 240, description: Slash-separated selected path; no absolute/drive/UNC form, empty segment, dot segment, backslash or control character. The daemon validates it and uses it only as provenance/display metadata.}
    ProvenanceTransformation:
      type: object
      additionalProperties: false
      required: [operation, inputs]
      properties:
        operation: {type: string, minLength: 1}
        inputs:
          type: array
          items: {$ref: '#/components/schemas/ResourceInput'}
        output_digest: {type: string, minLength: 1, pattern: '^sha256:[a-f0-9]{64}$'}
        capability_ref: {$ref: '#/components/schemas/CapabilityRef'}
    PlannedStep:
      type: object
      additionalProperties: false
      required: [logical_key, title, objective, depends_on_logical_keys, required_capabilities, acceptance_criteria]
      properties:
        logical_key: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        objective: {type: string, minLength: 1}
        depends_on_logical_keys:
          type: array
          uniqueItems: true
          items: {type: string}
        required_capabilities:
          type: array
          items: {$ref: '#/components/schemas/CapabilityRequirement'}
        acceptance_criteria:
          type: array
          items: {$ref: '#/components/schemas/AcceptanceCriterion'}
    PlanRevision:
      type: object
      required: [task_id, revision, task_spec_revision, produced_by_agent_session_id, steps, created_at]
      properties:
        task_id: {type: string}
        revision: {type: integer, minimum: 1}
        task_spec_revision: {type: integer, minimum: 1}
        produced_by_agent_session_id: {type: string}
        produced_by_attempt_id: {type: [string, 'null']}
        steps:
          type: array
          items: {$ref: '#/components/schemas/PlannedStep'}
        reason_for_revision: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    SubmitPlanRequest:
      type: object
      additionalProperties: false
      required: [task_spec_revision, steps]
      properties:
        task_spec_revision: {type: integer, minimum: 1, description: Must equal the current TaskSpec revision and the producer's authorized planning scope.}
        steps:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PlannedStep'}
        reason_for_revision: {type: [string, 'null'], maxLength: 8192}
    PlanAcceptance:
      type: object
      additionalProperties: false
      required: [plan_revision, materialized_steps, task_version]
      properties:
        plan_revision: {$ref: '#/components/schemas/PlanRevision'}
        materialized_steps:
          type: array
          items: {$ref: '#/components/schemas/Step'}
        task_version: {type: integer, minimum: 1, description: Task aggregate version after the acceptance transaction commits.}
    Step:
      type: object
      required: [step_id, task_id, plan_revision, title, objective, dependencies, required_capabilities, acceptance_criteria, status, created_at, updated_at, version]
      properties:
        step_id: {type: string}
        task_id: {type: string}
        plan_revision: {type: integer, minimum: 1}
        logical_key: {type: [string, 'null']}
        title: {type: string}
        objective: {type: string}
        dependencies:
          type: array
          items: {type: string}
        required_capabilities:
          type: array
          items: {$ref: '#/components/schemas/CapabilityRequirement'}
        acceptance_criteria:
          type: array
          items: {$ref: '#/components/schemas/AcceptanceCriterion'}
        status: {type: string, enum: [PENDING, READY, RUNNING, WAITING_USER, BLOCKED, VERIFYING, COMPLETED, FAILED, CANCEL_REQUESTED, CANCELLED, SUPERSEDED]}
        current_attempt_id: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    Attempt:
      type: object
      required: [attempt_id, task_id, step_id, parent_attempt_id, agent_binding_id, delegation_profile_id, delegation_profile_revision, runtime_id, runtime_incarnation_id, environment_id, capability_grant_ids, failover_class, status, created_at, version]
      properties:
        attempt_id: {type: string}
        task_id: {type: string}
        step_id: {type: string}
        parent_attempt_id: {type: [string, 'null']}
        agent_binding_id: {type: string}
        delegation_profile_id: {type: [string, 'null']}
        delegation_profile_revision: {type: [integer, 'null'], minimum: 1}
        agent_session_id: {type: [string, 'null']}
        runtime_id: {type: string}
        runtime_incarnation_id: {type: string}
        environment_id: {type: string}
        capability_grant_ids:
          type: array
          items: {type: string}
        execution_lease_id: {type: [string, 'null']}
        failover_class: {type: string, enum: [SAFE_PORTABLE, REPLAYABLE, HANDOFF_REQUIRED, LOCAL_BOUND]}
        checkpoint_ref:
          oneOf: [{$ref: '#/components/schemas/ResourceRef'}, {type: 'null'}]
        status: {type: string, enum: [CREATED, PREPARING, RUNNING, WAITING_APPROVAL, WAITING_RESOURCE, CHECKPOINTING, COMPLETED, FAILED, ABANDONED, CANCEL_REQUESTED, CANCELLED]}
        failure:
          oneOf: [{$ref: '#/components/schemas/FailureRecord'}, {type: 'null'}]
        started_at: {type: [string, 'null'], format: date-time}
        settled_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
      allOf:
      - if:
          properties: {parent_attempt_id: {type: string}}
          required: [parent_attempt_id]
        then:
          properties:
            delegation_profile_id: {type: string, minLength: 1}
            delegation_profile_revision: {type: integer, minimum: 1}
      - if:
          properties: {parent_attempt_id: {type: 'null'}}
          required: [parent_attempt_id]
        then:
          properties:
            delegation_profile_id: {type: 'null'}
            delegation_profile_revision: {type: 'null'}
      - if:
          properties: {delegation_profile_id: {type: string}}
          required: [delegation_profile_id]
        then:
          properties: {delegation_profile_revision: {type: integer, minimum: 1}}
      - if:
          properties: {delegation_profile_revision: {type: integer}}
          required: [delegation_profile_revision]
        then:
          properties: {delegation_profile_id: {type: string, minLength: 1}}
    ExecutionDependencyPlan:
      type: object
      additionalProperties: false
      required: [plan_id, task_id, step_id, task_version, step_version, task_spec_revision, plan_revision, selected_runtime_id, plan_digest, environment_candidates, nodes, status, computed_at, expires_at]
      properties:
        plan_id: {type: string}
        task_id: {type: string}
        step_id: {type: string}
        task_version: {type: integer, minimum: 1}
        step_version: {type: integer, minimum: 1}
        task_spec_revision: {type: integer, minimum: 1}
        plan_revision: {type: integer, minimum: 1}
        selected_runtime_id: {type: [string, 'null']}
        plan_digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        environment_candidates:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentPlacementCandidate'}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/ExecutionDependencyNode'}
        status: {type: string, enum: [READY, WAITING, INFEASIBLE, STALE]}
        computed_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    EnvironmentPlacementCandidate:
      type: object
      additionalProperties: false
      required: [candidate_id, runtime_id, runtime_incarnation_id, environment_id, environment_version, readiness, eligible, dependency_node_ids, blockers]
      properties:
        candidate_id: {type: string, minLength: 1}
        runtime_id: {type: string}
        runtime_incarnation_id: {type: string}
        environment_id: {type: string}
        environment_version: {type: integer, minimum: 1}
        readiness: {type: string, enum: [AVAILABLE, STARTABLE, STARTING, READY, BUSY, DEGRADED, OFFLINE, NEEDS_AUTH, UNAVAILABLE]}
        eligible: {type: boolean}
        dependency_node_ids:
          type: array
          uniqueItems: true
          items: {type: string}
        blockers:
          type: array
          items: {$ref: '#/components/schemas/Blocker'}
    ExecutionDependencyNode:
      type: object
      additionalProperties: false
      required: [node_id, kind, ref, depends_on_node_ids, readiness]
      properties:
        node_id: {type: string}
        kind: {type: string, enum: [RESOURCE, AGENT_HOST, ENVIRONMENT, CAPABILITY, SECRET, APPLICATION, RUNTIME_ROLE]}
        ref: {type: string}
        depends_on_node_ids:
          type: array
          uniqueItems: true
          items: {type: string}
        runtime_id: {type: [string, 'null']}
        readiness: {type: string, enum: [AVAILABLE, STARTABLE, STARTING, READY, BUSY, DEGRADED, OFFLINE, NEEDS_AUTH, UNAVAILABLE]}
        blocker_code: {type: [string, 'null']}
    Effect:
      type: object
