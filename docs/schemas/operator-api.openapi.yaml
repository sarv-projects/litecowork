          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanRevision'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [tasks]
      operationId: submitTaskPlan
      description: >-
        Authenticated plan submission. In addition to the authenticated Workspace owner
        context, the bearer identity must carry the currently authorized producer scope:
        either the current lead's active TASK_PLANNING AgentSession or the current lead
        execution Attempt's active AgentSession and valid lease. Producer IDs are derived
        from trusted authentication context; they are not request-body authority. If-Match
        pins the Task aggregate version and task_spec_revision pins the current TaskSpec.
        An identical idempotent retry replays the original committed PlanAcceptance after
        authentication/Workspace authorization and receipt-subject matching; it does not
        re-run mutable producer admission after the producer session has closed.
      parameters:
      - {$ref: '#/components/parameters/TaskId'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitPlanRequest'}
      responses:
        '201':
          description: PlanRevision and its materialized Steps committed atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanAcceptance'}
        '409':
          description: Stale Task/spec, producer no longer authorized, or idempotency-key reuse with different request digest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        default: {$ref: '#/components/responses/Error'}
