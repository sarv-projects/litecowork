name: Architecture documentation contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema PyYAML openapi-spec-validator
      - run: python scripts/validate_architecture.py
      - run: python scripts/validate_implementation_plan.py
