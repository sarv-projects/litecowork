[workspace]
members = [
  "apps/litecoworkd",
  "crates/storage-core",
  "crates/storage-sqlite",
  "crates/domain-workspace",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
