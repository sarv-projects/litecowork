[workspace]
members = [
  "apps/litecoworkd",
  "crates/operator-ipc",
  "crates/storage-core",
  "crates/storage-sqlite",
  "crates/domain-task",
  "crates/domain-responsibility",
  "crates/domain-workspace",
  "crates/domain-effects",
  "crates/domain-environment",
  "crates/domain-conversation",
  "crates/local-environment-staging",
  "crates/linux-process-scope",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
